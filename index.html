<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tactical Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #0d0d0d; }
    #map { width: 100vw; height: 100vh; }

    .soldier-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      box-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 0 2px rgba(255,255,255,0.15);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .soldier-marker:hover {
      transform: scale(1.2);
      box-shadow: 0 4px 14px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,255,255,0.35);
    }
    .blue-marker { background: radial-gradient(circle at 35% 35%, #42a5f5, #0d47a1); border: 2px solid #90caf9; }
    .red-marker  { background: radial-gradient(circle at 35% 35%, #ef5350, #7f0000); border: 2px solid #ef9a9a; }

    #loading {
      position: fixed; inset: 0;
      background: rgba(5, 8, 15, 0.92);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; color: #ccc;
      gap: 14px;
    }
    #loading-text { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #90caf9;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #login {
      position: fixed; inset: 0; z-index: 20000;
      background: #07090f;
      display: flex; align-items: center; justify-content: center;
    }
    #login-box {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      width: 260px;
    }
    #login-title {
      font-size: 15px; letter-spacing: 5px; color: #aaa; text-transform: uppercase; margin-bottom: 4px;
    }
    #login-input {
      width: 100%; padding: 10px 14px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 4px; color: #ccc; font-family: monospace;
      font-size: 15px; letter-spacing: 3px; outline: none; text-align: center;
    }
    #login-input:focus { border-color: rgba(255,255,255,0.35); }
    #login-btn {
      width: 100%; padding: 9px; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
      color: #bbb; font-family: monospace; font-size: 12px; letter-spacing: 2px;
      cursor: pointer; text-transform: uppercase;
    }
    #login-btn:hover { background: rgba(255,255,255,0.13); }
    #login-err { font-size: 11px; color: #ef9a9a; letter-spacing: 1px; min-height: 16px; }

    .soldier-marker.selected {
      box-shadow: 0 0 0 3px #fff, 0 0 12px 4px rgba(255,255,255,0.6);
      transform: scale(1.15);
    }
    #status {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(8,10,18,0.88); color: #ccc;
      padding: 7px 16px; border-radius: 20px; z-index: 1000;
      font-size: 12px; letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: none; white-space: nowrap; user-select: none;
    }
    #status.interactive {
      pointer-events: auto;
      display: none;
    }

    /* ── Panel ── */
    #unit-panel {
      position:fixed; bottom:0; left:0; width:272px; max-height:64vh;
      background:#07090f; border-top:1px solid rgba(255,255,255,0.07);
      border-right:1px solid rgba(255,255,255,0.07); border-radius:0 14px 0 0;
      z-index:1001; display:none; flex-direction:column; font-family:monospace; color:#b8c0d0;
      box-shadow:4px -4px 24px rgba(0,0,0,0.55);
    }
    /* header */
    .ph { display:flex; justify-content:space-between; align-items:flex-start; padding:13px 15px 8px; flex-shrink:0; }
    .ph-title { font-size:14px; font-weight:700; color:#e8ecf5; letter-spacing:0.3px; }
    .ph-meta { font-size:9px; letter-spacing:1.4px; text-transform:uppercase; margin-top:3px; }
    .ph-x { background:none; border:none; color:#2a3040; cursor:pointer; font-size:17px; padding:0; line-height:1; transition:color .12s; }
    .ph-x:hover { color:#ef5350; }
    /* stats */
    .pstats { display:flex; flex-wrap:wrap; gap:4px; padding:0 15px 10px; flex-shrink:0; border-bottom:1px solid rgba(255,255,255,0.05); }
    .pstat { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:7px; padding:5px 9px; min-width:70px; flex:1; }
    .pstat.full { flex-basis:100%; }
    .pstat.warn { border-color:rgba(255,87,34,0.35); }
    .pstat-l { font-size:8px; letter-spacing:0.9px; text-transform:uppercase; color:#3a4555; margin-bottom:2px; }
    .pstat-v { font-size:13px; font-weight:600; color:#d4dae8; }
    .p-bar { background:rgba(255,255,255,0.06); border-radius:2px; height:2px; margin-top:5px; }
    .p-bar-fill { height:2px; border-radius:2px; transition:width .4s; }
    /* tabs */
    .ptabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.05); flex-shrink:0; }
    .ptab { flex:1; padding:9px 0; text-align:center; font-size:9px; letter-spacing:1.3px; text-transform:uppercase; color:#2e3a4a; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s,border-color .15s; }
    .ptab:hover { color:#556070; }
    .ptab.on { color:#82b4f0; border-bottom-color:#42a5f5; }
    /* content */
    .pc { flex:1; overflow-y:auto; padding:11px 15px 16px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.07) transparent; }
    /* section label */
    .psec { font-size:9px; letter-spacing:1.1px; text-transform:uppercase; color:#5a7898; font-weight:600; margin:12px 0 5px; }
    .psec:first-child { margin-top:0; }
    /* fortification indicator on marker */
    .fort-badge { position:absolute; top:-7px; right:-4px;
      font-size:8px; background:rgba(100,60,10,0.92); color:#ffd54f; border-radius:3px;
      padding:1px 4px; white-space:nowrap; pointer-events:none; z-index:10; letter-spacing:.3px;
      border:1px solid rgba(255,213,79,0.4); box-shadow:0 1px 4px rgba(0,0,0,0.6); }
    /* 3D map mode */
    #map-wrap { position:absolute; inset:0; transition: transform 0.4s ease; transform-origin: 50% 50%; }
    #map-wrap.map-3d { transform: perspective(900px) rotateX(30deg) scale(1.25) translateY(8%); }
    #map-wrap.map-3d #map { cursor: crosshair; }
    /* action buttons */
    .pb { display:flex; align-items:center; gap:8px; padding:8px 11px; width:100%;
          background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07);
          border-radius:7px; color:#8a96aa; font-family:monospace; font-size:11px;
          cursor:pointer; text-align:left; transition:background .1s,border-color .1s; margin-bottom:3px; }
    .pb:hover:not([disabled]) { background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.14); color:#c0c8d8; }
    .pb[disabled] { opacity:0.22; cursor:default; }
    .pb-ic { font-size:10px; width:13px; text-align:center; flex-shrink:0; opacity:0.6; }
    .pb.atk { border-color:rgba(239,83,80,0.22); color:#ef9a9a; }
    .pb.atk:hover:not([disabled]) { background:rgba(239,83,80,0.07); border-color:rgba(239,83,80,0.4); }
    .pb.sup { border-color:rgba(255,87,34,0.22); color:#ff8a65; }
    .pb.sup:hover:not([disabled]) { background:rgba(255,87,34,0.07); border-color:rgba(255,87,34,0.4); }
    .pb.tac { border-color:rgba(38,198,218,0.2); color:#6dd5e8; }
    .pb.tac:hover:not([disabled]) { background:rgba(38,198,218,0.06); border-color:rgba(38,198,218,0.35); }
    .pb.lit { border-color:rgba(255,193,7,0.2); color:#ffd54f; }
    .pb.lit:hover:not([disabled]) { background:rgba(255,193,7,0.06); }
    .pb.on { background:rgba(239,83,80,0.1); border-color:rgba(239,83,80,0.45); color:#ef9a9a; }
    .pb-note { font-size:10px; color:#2e3a4a; padding:2px 2px 5px; line-height:1.5; }
    /* move row */
    .pmove { display:flex; align-items:center; gap:7px; background:rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.06); border-radius:7px; padding:7px 10px; margin-bottom:5px; }
    .pmove-n { font-weight:700; font-size:15px; color:#e8ecf5; min-width:22px; text-align:center; }
    .pmove-l { flex:1; font-size:9px; color:#2e3a4a; }
    .padj { width:24px; height:24px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); border-radius:5px; color:#667; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .1s; }
    .padj:hover { background:rgba(255,255,255,0.12); color:#bbb; }
    /* soldier list */
    .sol-list { display:flex; flex-direction:column; gap:2px; margin-bottom:6px; }
    .sol-row { display:flex; justify-content:space-between; padding:4px 9px; border-radius:5px; cursor:pointer; font-size:10px; background:rgba(255,255,255,0.025); border:1px solid transparent; transition:background .1s; color:#566070; }
    .sol-row:hover { background:rgba(255,255,255,0.06); color:#8a96aa; }
    .sol-row.sel { background:rgba(255,193,7,0.08); border-color:rgba(255,193,7,0.28); color:#ffd54f; }
    /* conditions */
    .cond-card { display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border:1px solid rgba(255,255,255,0.06); border-radius:7px; margin-bottom:4px; cursor:pointer; transition:background .1s; background:rgba(255,255,255,0.02); }
    .cond-card:hover { background:rgba(255,255,255,0.04); }
    .cond-card input[type=checkbox] { accent-color:#42a5f5; cursor:pointer; margin-top:1px; flex-shrink:0; }
    .cond-title { font-size:11px; color:#a0acbc; font-weight:600; }
    .cond-desc { font-size:9px; color:#3a4555; margin-top:2px; line-height:1.45; }
    /* log */
    .log-row { display:flex; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.035); }
    .log-t { font-size:9px; color:#2e3a4a; flex-shrink:0; font-variant-numeric:tabular-nums; }
    .log-msg { font-size:10px; color:#667; line-height:1.4; }
    .dep-role-btn { background:#1a2030; color:#ccc; border:1px solid #30363d; border-radius:4px; padding:3px 7px; font-size:10px; cursor:pointer; }
    .dep-role-btn:hover { background:#2a3448; color:#fff; }
    #dep-picker { display:none; position:fixed; bottom:58px; right:14px; z-index:9100; background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:7px; flex-wrap:wrap; gap:3px; max-width:200px; box-shadow:0 2px 8px #000a; }
    /* toolbar */
    #toolbar { position:fixed; bottom:14px; right:14px; z-index:9000; display:flex; gap:3px;
      background:rgba(7,9,15,0.9); border:1px solid rgba(255,255,255,0.09); border-radius:9px; padding:4px; }
    .tb-btn { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:13px; transition:background .1s; color:#556; font-family:monospace; }
    .tb-btn:hover { background:rgba(255,255,255,0.09); color:#aaa; }
    .tb-btn.active { background:rgba(38,198,218,0.12); border-color:rgba(38,198,218,0.4); color:#26c6da; }
    .tb-btn.ruler-on { background:rgba(255,213,79,0.12); border-color:rgba(255,213,79,0.4); color:#ffd54f; }
    /* annotate toolbar */
    #annotate-toolbar { position:fixed; right:14px; bottom:58px; z-index:9000; display:none;
      background:rgba(7,9,15,0.93); border:1px solid rgba(255,255,255,0.09);
      border-radius:9px; padding:7px 9px; gap:4px; flex-direction:column; min-width:130px; }
    #annotate-toolbar.show { display:flex; }
    .ann-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); color:#778; font-size:11px; padding:5px 9px; border-radius:5px; cursor:pointer; white-space:nowrap; transition:background .1s; font-family:monospace; }
    .ann-btn:hover { background:rgba(255,255,255,0.1); color:#bbb; }
    .ann-btn.active { background:rgba(129,199,132,0.15); border-color:rgba(129,199,132,0.4); color:#81c784; }
    .ann-color-swatch { width:15px; height:15px; border-radius:3px; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
    .ann-color-swatch.active-swatch { border-color:#fff; }
    .ruler-label-wrap { overflow:visible !important; }
    .ruler-chip { background:rgba(7,9,15,0.92); border:1px solid #ffd54f; color:#ffd54f; font-size:11px; font-family:monospace; padding:3px 10px; border-radius:4px; white-space:nowrap; pointer-events:none; display:inline-block; position:absolute; left:50%; transform:translateX(-50%); box-shadow:0 2px 8px rgba(0,0,0,0.6); }
    /* toasts */
    #toast-area { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:20000; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
    .toast { background:rgba(7,9,15,0.94); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:7px 18px; font-size:12px; font-family:monospace; letter-spacing:.4px; animation:toastIn .2s ease; }
    /* drone tooltips */
    .fpv-eta-tip { background:rgba(7,9,15,0.88)!important; border:1px solid #ef5350!important; color:#ef9a9a!important; font-size:10px!important; font-family:monospace!important; padding:2px 6px!important; border-radius:4px!important; white-space:nowrap; }
    .fpv-eta-tip::before { display:none!important; }
    /* suppression */
    @keyframes suppressPulse { 0%,100%{opacity:0.9;transform:scale(1)} 50%{opacity:0.3;transform:scale(1.22)} }
    .suppressed-ring { position:absolute;inset:-6px;border-radius:50%;border:2px solid #ff5722; animation:suppressPulse 0.75s ease-in-out infinite;pointer-events:none;z-index:1; }
    @keyframes suppressFlash { 0%{box-shadow:0 0 0 0 rgba(255,87,34,0.8)} 100%{box-shadow:0 0 0 16px rgba(255,87,34,0)} }
    .suppress-flash .soldier-marker { animation:suppressFlash 0.4s ease-out 3; }
    .ghost-marker { opacity:0.68; filter:grayscale(0.6) brightness(0.7); }
    @keyframes toastIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
    @keyframes explode {
      0%   { transform:translate(-50%,-50%) scale(0.1); opacity:1; }
      40%  { transform:translate(-50%,-50%) scale(1);   opacity:0.85; }
      100% { transform:translate(-50%,-50%) scale(2.2); opacity:0; }
    }
    @keyframes explodeRing {
      0%   { transform:translate(-50%,-50%) scale(0.1); opacity:0.9; }
      100% { transform:translate(-50%,-50%) scale(2.8); opacity:0; }
    }
    .expl-core { position:fixed; pointer-events:none; z-index:9500; border-radius:50%;
      background:radial-gradient(circle, #fff 0%, #ffeb3b 30%, #ff6f00 65%, rgba(200,50,0,0) 100%);
      animation: explode 0.55s ease-out forwards; }
    .expl-ring  { position:fixed; pointer-events:none; z-index:9499; border-radius:50%;
      border:3px solid rgba(255,140,0,0.75);
      animation: explodeRing 0.65s ease-out forwards; }
    /* Persistent crater/smoke after impact */
    @keyframes craterFade { 0%{opacity:0.85} 20%{opacity:0.7} 100%{opacity:0} }
    @keyframes smokeDrift { 0%{transform:translate(-50%,-50%) scale(1);opacity:0.7} 100%{transform:translate(-50%,-50%) scale(2.4);opacity:0} }
    .impact-crater { position:absolute; pointer-events:none; border-radius:50%; transform:translate(-50%,-50%); }
    .impact-crater.shell  { background:radial-gradient(circle,#5a4a3a 0%,#3a2a1a 40%,transparent 100%); animation:craterFade 10s ease-out forwards; }
    .impact-crater.mortar { background:radial-gradient(circle,#4a3a2a 0%,#2a1a0a 40%,transparent 100%); animation:craterFade 8s ease-out forwards; }
    .impact-crater.fpv    { background:radial-gradient(circle,#ff6f00 0%,#bf360c 30%,transparent 100%); animation:craterFade 6s ease-out forwards; }
    .impact-smoke { position:absolute; pointer-events:none; border-radius:50%; transform:translate(-50%,-50%); border:2px solid rgba(180,180,160,0.6); animation:smokeDrift 7s ease-out forwards; }

    #weather-widget {
      position: fixed; top: 10px; right: 10px; z-index: 9000;
      background: rgba(8,10,18,0.88); color: #ccc;
      padding: 5px 12px; border-radius: 20px; font-size: 11px;
      border: 1px solid rgba(255,255,255,0.12); font-family: monospace;
      white-space: nowrap; user-select: none; letter-spacing: 0.3px;
    }

    #error {
      display: none;
      position: fixed; inset: 0;
      background: rgba(5,8,15,0.92);
      align-items: center; justify-content: center;
      z-index: 9999; color: #ef9a9a;
      font-size: 14px; padding: 30px; text-align: center;
    }
  </style>
<!-- Firebase (loaded on-demand when user configures it) -->
<script>
function loadFirebaseSDK(cb) {
  if (window._fbLoaded) { cb(); return; }
  const s1 = document.createElement('script');
  s1.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js';
    s2.onload = () => { window._fbLoaded = true; cb(); };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}
</script>
</head>
<body>

<div id="login">
  <div id="login-box">
    <div id="login-title">Tactical Map</div>
    <input type="password" id="login-input" placeholder="Access code" autocomplete="off" />
    <button id="login-btn">Enter</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="loading" style="display:none">
  <div class="spinner"></div>
  <div id="loading-text">Fetching OSM woodland data…</div>
</div>
<div id="error"></div>
<div id="map-wrap"><div id="map"></div></div>
<div id="status"></div>
<div id="unit-panel"></div>
<div id="toast-area"></div>
<div id="weather-widget">Loading weather…</div>
<div id="dep-picker">
  <div style="width:100%;color:#556;font-size:10px;padding-bottom:4px;letter-spacing:.4px">DEPLOY POINT FOR:</div>
  <button class="dep-role-btn" onclick="selectDepRole('infantry')">Infantry</button>
  <button class="dep-role-btn" onclick="selectDepRole('fpv')">FPV</button>
  <button class="dep-role-btn" onclick="selectDepRole('mavic')">Mavic</button>
  <button class="dep-role-btn" onclick="selectDepRole('artillery')">Artillery</button>
  <button class="dep-role-btn" onclick="selectDepRole('mortar')">Mortar</button>
</div>
<div id="version-badge" style="position:fixed;bottom:14px;left:14px;z-index:9000;font-family:monospace;font-size:10px;color:#555;pointer-events:none"></div>
<div id="toolbar">
  <button class="tb-btn" id="dep-btn" onclick="enterPlaceDeployPoint()" title="Place deployment point">⚑</button>
  <button class="tb-btn" id="ruler-btn" title="Measure distances">⊾</button>
  <button class="tb-btn" id="annotate-btn" title="Draw annotations">✎</button>
  <button class="tb-btn" id="elev-btn" onclick="toggleElevationMap()" title="Toggle elevation map">⛰</button>
  <button class="tb-btn" id="map3d-btn" onclick="toggle3DMap()" title="Toggle 3D map view">3D</button>
  <button class="tb-btn" onclick="resetMap()" title="Reset map">↺</button>
  <button class="tb-btn" id="gh-btn" onclick="openGHConfig()" title="GitHub sync settings">⇅</button>
  <button class="tb-btn" id="mp-btn" onclick="openFBConfig()" title="Multiplayer / real-time sync">⟳</button>
</div>
<div id="annotate-toolbar">
  <button class="ann-btn" id="ann-line-btn"   onclick="setAnnotateMode('line')">— Line</button>
  <button class="ann-btn" id="ann-arrow-btn"  onclick="setAnnotateMode('arrow')">→ Arrow</button>
  <button class="ann-btn" id="ann-circle-btn" onclick="setAnnotateMode('circle')">◯ Circle</button>
  <button class="ann-btn" id="ann-free-btn"   onclick="setAnnotateMode('free')">✏ Free</button>
  <button class="ann-btn" id="ann-note-btn"   onclick="setAnnotateMode('note')">📌 Note</button>
  <select id="ann-weight" title="Line thickness" style="background:#0d1117;color:#ccc;border:1px solid #30363d;border-radius:4px;padding:2px 4px;font-size:11px;cursor:pointer">
    <option value="2">Thin</option>
    <option value="3.5" selected>Normal</option>
    <option value="6">Thick</option>
  </select>
  <div style="display:flex;gap:4px;align-items:center">
    <span style="font-size:9px;color:#556;letter-spacing:.5px">COLOR</span>
    <div id="ann-color-team"  class="ann-color-swatch active-swatch" title="Team color" onclick="setAnnotateColor('team')"  style="background:var(--ann-team-col,#42a5f5)"></div>
    <div id="ann-color-red"   class="ann-color-swatch" title="Red"         onclick="setAnnotateColor('#ef5350')" style="background:#ef5350"></div>
    <div id="ann-color-yellow"class="ann-color-swatch" title="Yellow"      onclick="setAnnotateColor('#ffd54f')" style="background:#ffd54f"></div>

const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
];

async function fetchAreas() {
  const [clat, clng] = CENTER;
  const bbox = `${clat - BBOX_PAD},${clng - BBOX_PAD},${clat + BBOX_PAD},${clng + BBOX_PAD}`;
  const q = `[out:json][timeout:45];(
    way["natural"="wood"](${bbox});
    relation["natural"="wood"](${bbox});
    way["landuse"="residential"](${bbox});
    way["place"~"village|town|hamlet"](${bbox});
    node["place"~"village|town|hamlet"](${bbox});
    way["building"](${bbox});
    way["highway"~"residential|service|unclassified|tertiary|living_street"](${bbox});
    way["natural"="water"](${bbox});
    relation["natural"="water"](${bbox});
    way["waterway"~"river|canal"](${bbox});
    way["waterway"~"stream|ditch"](${bbox});
  );out body;>;out skel qt;`;

  for (const endpoint of OVERPASS_ENDPOINTS) {
    try {
      document.getElementById('loading-text').textContent = `Querying ${new URL(endpoint).hostname}…`;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      const r = await fetch(`${endpoint}?data=${encodeURIComponent(q)}`, { signal: controller.signal });
      clearTimeout(timer);
      if (r.ok) return r.json();
    } catch (_) { /* try next */ }
  }
  throw new Error('All Overpass endpoints failed. Try again in a moment.');
}

// approximate circle polygon around a node (for place=village nodes)
function circlePolyAround(lat, lng, radiusMeters = 250, steps = 24) {
  const dLat = (radiusMeters / 111320);
  const dLng = (radiusMeters / (111320 * Math.cos(lat * Math.PI / 180)));
  const ring = [];
  for (let i = 0; i < steps; i++) {
    const angle = (2 * Math.PI * i) / steps;
    ring.push([lat + dLat * Math.sin(angle), lng + dLng * Math.cos(angle)]);
  }
  return ring;
}

function buildNodeMap(elements) {
  const m = {};
  for (const el of elements) if (el.type === 'node') m[el.id] = [el.lat, el.lon];
  return m;
}

function wayToRing(way, nodeMap) {
  const ring = way.nodes.map(id => nodeMap[id]).filter(Boolean);
  return ring.length >= 3 ? ring : null;
}

function stitchWays(wayIds, wayMap, nodeMap) {
  const segs = wayIds
    .map(id => wayMap[id]).filter(Boolean)
    .map(w => w.nodes.map(id => nodeMap[id]).filter(Boolean))
    .filter(s => s.length >= 2);

  if (!segs.length) return null;
  if (segs.length === 1) return segs[0].length >= 3 ? segs[0] : null;

  const result = [...segs[0]];
  const used = new Set([0]);
  const close = (a, b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) < 1e-5;

  while (used.size < segs.length) {
    const tail = result[result.length - 1];
    let found = false;
    for (let i = 0; i < segs.length; i++) {
      if (used.has(i)) continue;
      const s = segs[i];
      if (close(tail, s[0])) { result.push(...s.slice(1)); used.add(i); found = true; break; }
      if (close(tail, s[s.length-1])) { result.push(...[...s].reverse().slice(1)); used.add(i); found = true; break; }
    }
    if (!found) break;
  }
  return result.length >= 3 ? result : null;
}

function extractPolygons(data) {
  const nodeMap = buildNodeMap(data.elements);
  const wayMap = {};
  for (const el of data.elements) if (el.type === 'way') wayMap[el.id] = el;

  const polys = []; // terrain: { ring, urban }
  const wPolys = []; // water bodies: { ring }
  const rLines = []; // rivers: [ [lat,lng], ... ]

  for (const el of data.elements) {
    if (el.type === 'way') {
      const urban = !!(el.tags?.landuse === 'residential' || el.tags?.place);
      const wood  = el.tags?.natural === 'wood';
      const water = el.tags?.natural === 'water';
      const wway  = el.tags?.waterway;
      if (urban || wood) {
        const r = wayToRing(el, nodeMap);
        if (r) polys.push({ ring: r, urban });
      }
      if (water) {
        const r = wayToRing(el, nodeMap);
        if (r) wPolys.push({ ring: r });
      }
      if (wway === 'river' || wway === 'canal') {
        const pts = el.nodes.map(id => nodeMap[id]).filter(Boolean);
        if (pts.length >= 2) rLines.push({ pts, major: true });
      }
      if (wway === 'stream' || wway === 'ditch') {
        const pts = el.nodes.map(id => nodeMap[id]).filter(Boolean);
        if (pts.length >= 2) rLines.push({ pts, major: false });
      }
    }
    if (el.type === 'relation') {
      if (el.tags?.natural === 'wood') {
        const outerIds = el.members.filter(m => m.type==='way' && (m.role==='outer'||m.role==='')).map(m => m.ref);
        const r = stitchWays(outerIds, wayMap, nodeMap);
        if (r) polys.push({ ring: r, urban: false });
      }
      if (el.tags?.natural === 'water') {
        const outerIds = el.members.filter(m => m.type==='way' && (m.role==='outer'||m.role==='')).map(m => m.ref);
        const r = stitchWays(outerIds, wayMap, nodeMap);
        if (r) wPolys.push({ ring: r });
      }
    }
    if (el.type === 'node' && el.tags?.place) {
      polys.push({ ring: circlePolyAround(el.lat, el.lon, 300), urban: true });
    }
  }
  return { polys, wPolys, rLines };
}

// Contact line — traced from the image (west → east)
const CONTACT_LINE = [
  [47.7810, 36.2133],
  [47.7798, 36.2306],
  [47.7804, 36.2478],
  [47.7827, 36.2651],
  [47.7856, 36.2806],
  [47.7896, 36.2961],
  [47.7913, 36.3099],
  [47.7919, 36.3220],
  [47.7971, 36.3341],
  [47.7982, 36.3513],
];

// Interpolate the line's latitude at a given longitude
function latOnLine(lng) {
  if (lng <= CONTACT_LINE[0][1]) return CONTACT_LINE[0][0];
  if (lng >= CONTACT_LINE[CONTACT_LINE.length-1][1]) return CONTACT_LINE[CONTACT_LINE.length-1][0];
  for (let i = 0; i < CONTACT_LINE.length - 1; i++) {
    const [la1, lo1] = CONTACT_LINE[i], [la2, lo2] = CONTACT_LINE[i+1];
    if (lng >= lo1 && lng <= lo2) {
      const t = (lng - lo1) / (lo2 - lo1);
      return la1 + t * (la2 - la1);
    }
  }
  return CENTER[0];
}

// True if point is north (blue side) of the contact line
function isNorthOfLine([lat, lng]) { return lat > latOnLine(lng); }

function polyBbox(poly) {
  let s=Infinity, n=-Infinity, w=Infinity, e=-Infinity;
  for (const [la, lo] of poly) {
    if (la < s) s = la; if (la > n) n = la;
    if (lo < w) w = lo; if (lo > e) e = lo;
  }
  return { s, n, w, e };
}

function pip([lat, lng], poly) {
  let inside = false;
  const len = poly.length;
  for (let i = 0, j = len-1; i < len; j = i++) {
    const [ila, ilo] = poly[i], [jla, jlo] = poly[j];
    if ((ilo > lng) !== (jlo > lng) && lat < ((jla-ila)*(lng-ilo))/(jlo-ilo)+ila)
      inside = !inside;
  }
  return inside;
}

function randomInPoly(ring, tries = 300) {
  const b = polyBbox(ring);
  for (let i = 0; i < tries; i++) {
    const lat = b.s + Math.random() * (b.n - b.s);
    const lng = b.w + Math.random() * (b.e - b.w);
    if (pip([lat, lng], ring)) return [lat, lng];
  }
  return null;
}

const URBAN_WEIGHT = 4;
let urbanAnchors = []; // building centroids + road nodes, set after fetch

function extractUrbanAnchors(data) {
  const nm = buildNodeMap(data.elements);
  const pts = [];
  for (const el of data.elements) {
    if (el.type === 'way' && el.tags?.building && el.nodes?.length >= 3) {
      const ns = el.nodes.map(id => nm[id]).filter(Boolean);
      if (ns.length) pts.push([ns.reduce((s,n)=>s+n[0],0)/ns.length, ns.reduce((s,n)=>s+n[1],0)/ns.length]);
    }
    if (el.type === 'way' && el.tags?.highway && el.nodes?.length >= 2) {
      el.nodes.forEach(id => { if (nm[id]) pts.push(nm[id]); });
    }
  }
  return pts;
}

// Pick a random point from any polygon, weighted by area × urban bonus
function randomInAny(polys, tries = 600) {
  const areas = polys.map(({ ring, urban }) => {
    const b = polyBbox(ring);
    return (b.n - b.s) * (b.e - b.w) * (urban ? URBAN_WEIGHT : 1);
  });
  const total = areas.reduce((a, b) => a + b, 0);
  if (total === 0) return null;
  for (let i = 0; i < tries; i++) {
    let r = Math.random() * total, idx = 0;
    for (let k = 0; k < areas.length; k++) { r -= areas[k]; if (r <= 0) { idx = k; break; } }
    const poly = polys[idx];
    if (poly.urban && urbanAnchors.length) {
      const inside = urbanAnchors.filter(pt => pip(pt, poly.ring));
      if (inside.length) return inside[Math.floor(Math.random() * inside.length)];
    }
    const pt = randomInPoly(poly.ring);
    if (pt) return pt;
  }
  return null;
}

function dist2(a, b) { return (a[0]-b[0])**2 + (a[1]-b[1])**2; }

// Distance in degrees from point to the contact line
function distToLine([lat, lng]) { return Math.abs(lat - latOnLine(lng)); }

// ── soldier roles (infantry sub-units) ───────────────────────
const SOLDIER_ROLES = {

function unitRangeM(m) { return 400; }
function unitHasMG(m)        { return false; }
function unitHasGrenadier(m) { return false; }

const ROLES = {

function soldierIcon(side, count, role = '') {

// ── globals ───────────────────────────────────────────────────
const TIME_SCALE = 20;
const WALK_MS = 1.111 * TIME_SCALE;

// ── terrain polygons (populated after OSM load) ───────────────
let terrainPolys = []; // [{ ring, urban }]  urban=true→village/buildings, false→forest
let waterPolys   = []; // large water bodies — impassable except infantry (very slow)
let riverLines   = []; // rivers/streams — slow everybody, block artillery
let spawnPolys   = []; // alias kept for spawn functions — set alongside terrainPolys

function terrainAt(pt) {
  for (const { ring, urban } of terrainPolys) {
    if (pointInPolygon(pt, ring)) return urban ? 'urban' : 'forest';
  }
  return 'field';
}

// Returns water type at pt: 'water' (large body), 'river', 'stream', or null
function waterAt(pt) {
  for (const { ring } of waterPolys) {
    if (pointInPolygon(pt, ring)) return 'water';
  }
  // check proximity to river/stream lines (within ~40m)
  const RIVER_NEAR_DEG = 0.00040; // ~44m
  const STREAM_NEAR_DEG = 0.00018; // ~20m
  for (const { pts, major } of riverLines) {
    const thr = major ? RIVER_NEAR_DEG : STREAM_NEAR_DEG;
    for (let i = 0; i < pts.length - 1; i++) {
      if (pointNearSegment(pt, pts[i], pts[i+1], thr)) return major ? 'river' : 'stream';
    }
  }
  return null;
}

// Check if a route segment list crosses water; returns first crossing type or null
function routeWaterCrossing(points, role) {
  for (let i = 0; i < points.length - 1; i++) {
    const steps = 6;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const pt = [points[i][0]+(points[i+1][0]-points[i][0])*t, points[i][1]+(points[i+1][1]-points[i][1])*t];
      const w = waterAt(pt);
      if (w) return w;
    }
  }
  return null;
}

// Speed multiplier for a given role crossing water type
function waterSpeedMult(waterType, role) {
  if (!waterType) return 1.0;
  if (waterType === 'water') {
    // Large water body: infantry very slow, others blocked
    return role === 'infantry' ? 0.12 : 0.0;
  }
  if (waterType === 'river') {
    // River: artillery blocked, others very slow
    return role === 'artillery' ? 0.0 : role === 'infantry' ? 0.25 : 0.18;
  }
  // Stream: everybody slowed, artillery passable very slowly
  return role === 'artillery' ? 0.15 : role === 'infantry' ? 0.40 : 0.28;
}

// Point-near-segment check (degrees, squared)
function pointNearSegment(pt, a, b, thr) {
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const lenSq = dx*dx+dy*dy;
  if (lenSq < 1e-12) return Math.hypot(pt[0]-a[0],pt[1]-a[1]) < thr;
  const t = Math.max(0,Math.min(1,((pt[0]-a[0])*dx+(pt[1]-a[1])*dy)/lenSq));
  return Math.hypot(pt[0]-a[0]-t*dx,pt[1]-a[1]-t*dy) < thr;
}

// Realistic drone-camera detection probability.
// Mavic-class drone at 200m AGL with 90° diagonal FOV + 30x optical zoom.
// Full-FOV footprint: tan(45°)×200 ≈ 200m radius (scan circle).
// 30x zoom lets operator zoom into any quadrant — effectively ~3° effective FOV when zoomed —
// so detection is much more uniform across the scan footprint (flat falloff).
// Without zoom: centre 90%, edge ~15%. With 30x zoom: centre 92%, mid ~78%, edge ~52%.
const MAVIC_ALTITUDE   = 200; // AGL in metres
const MAVIC_CAM_FOV    = 90;  // degrees diagonal (full-FOV for scan footprint)
const MAVIC_GND_RADIUS = MAVIC_ALTITUDE * Math.tan((MAVIC_CAM_FOV / 2) * Math.PI / 180); // ~200m

function mavicSpotProb(scanCentrePos, targetPos) {
  const distM = segMeters(scanCentrePos, targetPos);
  if (distM > MAVIC_GND_RADIUS) return 0; // off sensor footprint
  // Normalised distance 0 (nadir) → 1 (edge of footprint)
  const nd = distM / MAVIC_GND_RADIUS;
  // 30x zoom: operator can zoom any target in the footprint into full frame →
  // flat falloff; edge detection still meaningful.
  // centre (nd=0): ~0.92  mid (nd=0.5): ~0.78  edge (nd=1): ~0.52
  const basePct = 0.85 * Math.exp(-0.55 * nd * nd) + 0.10 * (1 - nd * 0.5);
  // Terrain + fortification cover — dense canopy and dug-in positions hide targets
  const terrain = terrainAt(targetPos);
  const terrainCover = terrain === 'forest' ? 0.22 : terrain === 'urban' ? 0.48 : 1.00;
  const unitAtPos = allMarkers.find(m => segMeters(markerPos(m), targetPos) < 20);
  const fortDetCover = 1 - (FORT_COVER.detection[unitAtPos?._fortLevel ?? 0] ?? 0);
  return Math.min(0.95, basePct * terrainCover * fortDetCover * weatherFactor);
}

// Legacy terrain multiplier used only for infantry visual detection
function terrainSpotFactor(pt) {
  switch (terrainAt(pt)) {
    case 'forest': return 0.22;
    case 'urban':  return 0.45;
    default:       return 1.00;
  }
}

// Probability multiplier for infantry visual detection at position pt
function terrainVisualFactor(pt) {
  switch (terrainAt(pt)) {
    case 'forest': return 0.30;
    case 'urban':  return 0.50;
    default:       return 1.00;
  }
}

// Battery constants — all in % per real second
const MAVIC_BATT_PER_METER = 0.006;  // % per metre flown (100% → ~16.7 km range)
const MAVIC_HOVER_BATT_PER_SEC = 1.8; // % per real second hovering
const MAVIC_BATT_SAFETY = 8;          // % kept in reserve for emergencies

// ── supply & logistics system ──────────────────────────────────
// Depots are ~25 km behind each side's start line
const SUPPLY_DEPOT_BLUE = [48.005, 36.282]; // ~25 km north of contact line
const SUPPLY_DEPOT_RED  = [47.555, 36.282]; // ~25 km south of contact line
// Convoy speed: 40 km/h (realistic truck on roads) scaled to game time
// Real transit time = distance_km * SUPPLY_MS_PER_KM milliseconds
const SUPPLY_MS_PER_KM  = 5400; // ~5.4 s/km real time (40 km/h at TIME_SCALE=20)
const FPV_MAX_DRONES    = 6;
const SUPPLY_TYPES = {
  ammo:    { label: 'Ammo Resupply',    icon: '◈', roles: ['infantry','mortar','artillery'], desc: 'Truck delivers full ammo load' },
  drones:  { label: 'Drone Resupply',   icon: '◈', roles: ['fpv'],                          desc: 'Van delivers 3 replacement drones' },
  reinf:   { label: 'Reinforcements',   icon: '◈', roles: ['infantry','fpv','mavic','artillery','mortar'], desc: 'New unit spawns at deployment point' },
  battery: { label: 'Battery Swap',     icon: '◈', roles: ['mavic'],                        desc: 'Technician swaps battery pack (100%)' },
};

// ── weather system ────────────────────────────────────────────
let weatherFactor = 1.0; // multiplier applied to mavic detection probability
let weatherData   = null;

const WMO = {
  0:'☀ Clear', 1:'🌤 Mostly clear', 2:'⛅ Partly cloudy', 3:'☁ Overcast',
  45:'🌫 Fog', 48:'🌫 Freezing fog',
  51:'🌦 Drizzle', 53:'🌦 Drizzle', 55:'🌦 Drizzle',
  61:'🌧 Rain', 63:'🌧 Rain', 65:'🌧 Heavy rain',
  71:'🌨 Snow', 73:'🌨 Snow', 75:'🌨 Heavy snow',
  80:'🌦 Showers', 81:'🌦 Showers', 82:'🌦 Heavy showers',
  95:'⛈ Thunderstorm', 96:'⛈ Thunderstorm', 99:'⛈ Thunderstorm',
};

function wmoFactor(code) {
  if (code === 45 || code === 48) return 0.22; // fog kills drone optics
  if (code >= 95) return 0.32;                 // thunderstorm
  if (code >= 71 && code <= 77) return 0.48;   // snow
  if (code >= 61 && code <= 67) return 0.58;   // rain
  if (code >= 80 && code <= 82) return 0.64;   // showers
  if (code >= 51 && code <= 55) return 0.74;   // drizzle
  if (code === 3) return 0.88;                 // overcast, slightly reduced
  return 1.00;
}

async function fetchWeather() {
  const [lat, lng] = CENTER;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=weather_code,wind_speed_10m,visibility&wind_speed_unit=ms`);
    if (!r.ok) throw new Error('bad response');
    const d = await r.json();
    const c = d.current;
    const code = c.weather_code ?? 0;
    const wind = c.wind_speed_10m ?? 0;
    const vis  = c.visibility ?? 10000;
    let f = wmoFactor(code);
    if (wind > 12) f *= 0.78; // drone camera shake / reduced stability
    if (wind > 18) f *= 0.60; // borderline flyable
    if (vis > 0 && vis < 2000) f *= vis / 2000; // low visibility cap
    weatherFactor = Math.max(0.05, Math.min(1.0, f));
    weatherData = { code, wind, vis };
    updateWeatherWidget();
  } catch (_) {}
  setTimeout(fetchWeather, 600000); // refresh every 10 min
}

function updateWeatherWidget() {
  const el = document.getElementById('weather-widget');
  if (!el) return;
  if (!weatherData) { el.textContent = 'Weather unavailable'; return; }
  const { code, wind, vis } = weatherData;
  const desc = WMO[code] ?? '? Unknown';
  const visStr = vis >= 10000 ? '>10 km' : vis >= 1000 ? (vis/1000).toFixed(1)+' km' : Math.round(vis)+' m';
  const fc = weatherFactor;
  const col = fc > 0.8 ? '#66bb6a' : fc > 0.5 ? '#ffa726' : '#ef5350';
  el.innerHTML = `${desc} &nbsp;💨 ${wind.toFixed(0)} m/s &nbsp;👁 ${visStr} &nbsp;<span style="color:${col}">drone ${Math.round(fc*100)}%</span>`;
}

// ── mavic patrol route ────────────────────────────────────────
let patrolMode = false, patrolActor = null;
let patrolPoints = [], patrolLine = null, patrolCostLabel = null;

function patrolFlightCost(pts) {
  // total flight cost (home→wp1→wp2→...→home) in % battery
  let dist = 0;
  for (let i = 0; i < pts.length - 1; i++) dist += segMeters(pts[i], pts[i+1]);
  dist += segMeters(pts[pts.length-1], pts[0]); // return leg
  return dist * MAVIC_BATT_PER_METER;
}

function enterPatrolDraw(unit) {
  if (unit._mavicMission) { showToast('Drone already on a mission.', '#888'); return; }
  if (unit._mavicCooldownUntil > Date.now()) { showToast('Drone still on cooldown.', '#888'); return; }
  patrolMode = true; patrolActor = unit;
  patrolPoints = [markerPos(unit)]; // first point is the unit itself (home)
  patrolLine = null;
  exitCombatMode();
  closePanel();
  setStatus('Patrol route: click waypoints · Enter/dblclick to launch · Esc to cancel');
}

function patrolClick(latlng) {
  // Hard battery check BEFORE adding the point
  const testPoints = [...patrolPoints, [latlng.lat, latlng.lng]];
  const cost = patrolFlightCost(testPoints);
  const budget = patrolActor._mavicBattery - MAVIC_BATT_SAFETY;
  if (cost > budget) {
    showToast(`Battery limit — can't reach waypoint and return safely (${Math.round(cost)}% needed, ${Math.round(budget)}% available)`, '#ef5350');
    setStatus(`Patrol: battery limit reached (${Math.round(budget)}% budget used) · Enter to launch or Esc to cancel`);
    return; // refuse the waypoint
  }
  patrolPoints.push([latlng.lat, latlng.lng]);
  if (patrolLine) patrolLine.setLatLngs(patrolPoints);
  else patrolLine = L.polyline(patrolPoints, { color: '#26c6da', weight: 2, dashArray: '8 4', opacity: 0.85 }).addTo(map);
  const hoverBudget = Math.max(0, budget - cost);
  const hoverPerWP = patrolPoints.length > 1 ? hoverBudget / MAVIC_HOVER_BATT_PER_SEC / (patrolPoints.length - 1) : 0;
  const remaining = Math.round(budget - cost);
  const pctUsed = Math.min(100, Math.round(cost / budget * 100));
  const barColor = pctUsed < 60 ? '#26c6da' : pctUsed < 85 ? '#ffa726' : '#ef5350';
  setStatus(`Patrol: ${patrolPoints.length-1} WP · ${Math.round(cost)}% battery · ~${hoverPerWP.toFixed(0)}s hover/WP · ${remaining}% remaining · Enter to launch`);
}

function confirmPatrol() {
  const unit = patrolActor;
  if (!unit || patrolPoints.length < 2) { cancelPatrol(); return; }
  const cost = patrolFlightCost(patrolPoints);
  if (cost + MAVIC_BATT_SAFETY > unit._mavicBattery) {
    showToast('Route too long — not enough battery to return safely!', '#ef5350');
    return;
  }
  unit._patrolRoute = [...patrolPoints]; // save route for repeat use
  launchMavicPatrol(unit, patrolPoints);
  cancelPatrol();
}

function cancelPatrol() {
  patrolMode = false; patrolActor = null; patrolPoints = [];
  if (patrolLine) { map.removeLayer(patrolLine); patrolLine = null; }
  setStatus('');
}

function launchMavicPatrol(unit, waypoints) {
  const cost = patrolFlightCost(waypoints);
  if (cost + MAVIC_BATT_SAFETY > unit._mavicBattery) {
    showToast(`Not enough battery! Need ${Math.round(cost + MAVIC_BATT_SAFETY)}%, have ${Math.round(unit._mavicBattery)}%`, '#ef5350');
    return;
  }
  const hoverBudget = Math.max(0, unit._mavicBattery - cost - MAVIC_BATT_SAFETY);
  const numWPs = waypoints.length - 1; // first point is home
  const hoverPerWP = numWPs > 0 ? hoverBudget / MAVIC_HOVER_BATT_PER_SEC / numWPs : 0;
  const flightSec = segMeters(waypoints[0], waypoints[1]) / MAVIC_SPD;
  const droneMarker = L.marker(unit.getLatLng(), {
    icon: mavicDroneIcon(), zIndexOffset: 300
  }).addTo(map).bindTooltip('ETA ' + fmtETA(Math.round(flightSec)), {
    permanent: true, className: 'fpv-eta-tip', direction: 'right', offset: [8,0]
  });
  // Draw the full planned route on the map
  const routeLine = L.polyline(waypoints, { color: '#26c6da', weight: 1.5, dashArray: '6 5', opacity: 0.45 }).addTo(map);
  unit._mavicMission = {
    type: 'patrol', waypoints, currentWP: 1, hoverPerWP,
    lat: waypoints[0][0], lng: waypoints[0][1],
    homeLat: waypoints[0][0], homeLng: waypoints[0][1],
    dstLat: waypoints[1][0], dstLng: waypoints[1][1],
    phase: 'outbound', scanCircle: null, scanEndsAt: 0,
    droneMarker, routeLine,
    outboundBatt: 0, returnBatt: 0, hoverSec: hoverPerWP
  };
  unit._mavicBattery = Math.max(0, unit._mavicBattery - cost);
  unitLog(unit, `Patrol launched · ${numWPs} waypoints · hover ~${hoverPerWP.toFixed(0)}s/WP`);
  showToast(`Patrol launched — ${numWPs} waypoints · ${hoverPerWP.toFixed(0)}s hover each`, '#26c6da');
  if (activePanel === unit) renderPanel();
}

function pointInPolygon(pt, poly) {
  // Ray-casting algorithm
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function polygonCentroid(pts) {
  return [pts.reduce((s,p) => s + p[0], 0) / pts.length, pts.reduce((s,p) => s + p[1], 0) / pts.length];
}

function makeArrowHead(pts, col) {
  if (pts.length < 2) return null;
  const p1 = pts[pts.length - 2], p2 = pts[pts.length - 1];
  const angle = Math.atan2(p2[0] - p1[0], p2[1] - p1[1]);
  const size = 0.00015;
  const a1 = [p2[0] - size * Math.cos(angle - Math.PI/6), p2[1] - size * Math.sin(angle - Math.PI/6)];
  const a2 = [p2[0] - size * Math.cos(angle + Math.PI/6), p2[1] - size * Math.sin(angle + Math.PI/6)];
  return L.polygon([p2, a1, a2], { color: col, fillColor: col, fillOpacity: 0.9, weight: 1, interactive: false }).addTo(map);
}
function finishAnnotateLine() {

  if (annotateCurLine && annotatePoints.length >= 2) {
    const col = annotateColor(); const w = annWeight();
    if (annotateSubMode === 'arrow') {
      const head = makeArrowHead(annotatePoints, col);
      annotationLayers.push({ type: 'arrow', layer: annotateCurLine, head, points: [...annotatePoints], color: col, weight: w });
    } else {
      annotationLayers.push({ type: 'line', layer: annotateCurLine, points: [...annotatePoints], color: col, weight: w });

}

function saveAnnotations() {

        annotationLayers.push({ type: 'circle', layer: lyr, center: a.center, radius: a.radius, color: col, weight: w });
      } else if (a.type === 'note' && a.latlng) {

          iconAnchor: [0, 10]

function enterSuppressMode(unit) {

  enterCombatMode('suppress', unit, rangeKm, '#ff5722');
  const now = Date.now();
  const enemies = findEnemiesInRange(unit, rangeKm).filter(e => e._spottedUntil > now);
  enemies.forEach(enemy => {

function spawnSuppressTracers(attacker, target) {
  // Sustained burst of directional tracers for the duration of suppression
  const durMs = 20000 / TIME_SCALE;
  const endAt = Date.now() + durMs;
  const posA = markerPos(attacker);
  const jitter = () => (Math.random() - 0.5) * 0.0006; // wider spread than firefight
  function burst() {
    if (Date.now() >= endAt || !allMarkers.includes(attacker) || !allMarkers.includes(target)) return;
    const posB = markerPos(target);
    for (let i = 0; i < 4; i++) {
      const marker = L.marker([posA[0] + jitter()*0.3, posA[1] + jitter()*0.3],
        { icon: bulletIcon(), zIndexOffset: 350, interactive: false }).addTo(map);
      flyingBullets.push({ marker, lat: posA[0], lng: posA[1],
        dstLat: posB[0] + jitter(), dstLng: posB[1] + jitter(), born: Date.now() });
    }
    setTimeout(burst, 180);
  }
  burst();
  // Flash the target element
  const el = target.getElement();
  if (el) { el.classList.add('suppress-flash'); setTimeout(() => el.classList.remove('suppress-flash'), 1200); }
}

function executeSuppression(attacker, target) {
  exitCombatMode();
  if (attacker._ammo <= 0) return;
  attacker._ammo = Math.max(0, attacker._ammo - 1);
  // Scale suppression duration by fraction of soldiers engaged (1 soldier = 8s, full squad = 28s)
  const totalAlive = aliveSoldiers(attacker).length || attacker._count || 1;
  const engagedIds = attacker._engagedSoldierIds;
  const engaged = engagedIds ? engagedIds.size : totalAlive;
  const fraction = Math.max(0.05, engaged / totalAlive);
  const baseDurS = 8 + 20 * fraction; // 8s with 1 soldier → 28s with full squad
  const dur = baseDurS * 1000 / TIME_SCALE;
  target._suppressedUntil = Math.max(target._suppressedUntil || 0, Date.now() + dur);
  showSuppressedRing(target);
  spawnSuppressTracers(attacker, target);
  const note = engagedIds ? ` (${engaged}/${totalAlive} soldiers)` : '';
  unitLog(attacker, `Suppressed ${ROLES[target._role]?.label ?? 'enemy'} for ${Math.round(baseDurS)}s${note}`);
  showToast(`Enemy suppressed for ${Math.round(baseDurS)}s!`, '#ff5722');
  attacker._engagedSoldierIds = null;
  if (allMarkers.includes(attacker)) { activePanel = attacker; renderPanel(); }
}
function showSuppressedRing(m) {
  const el = m.getElement(); if (!el) return;
  if (el.querySelector('.suppressed-ring')) return;
  const ring = document.createElement('div');
  ring.className = 'suppressed-ring';
  el.style.position = 'relative';
  el.appendChild(ring);
}
function removeSuppressedRing(m) {
  m.getElement()?.querySelector('.suppressed-ring')?.remove();
}

// ── area suppression ──────────────────────────────────────────
const suppressedZones = []; // { circle, expiresAt }

function enterAreaSuppressMode(unit) {
  if (unit._ammo <= 0) { showToast('No ammo.', '#888'); return; }
  const rangeKm = unitRangeM(unit) / 1000;
  enterCombatMode('area-suppress', unit, rangeKm, '#ff5722');
  setStatus(`Area suppression: click empty ground to saturate (${unitRangeM(unit)}m range) — Esc to cancel`);
  closePanel();
}

function executeAreaSuppress(attacker, latlng) {
  exitCombatMode();
  if (attacker._ammo <= 0) return;
  attacker._ammo = Math.max(0, attacker._ammo - 1);
  const gameDur = 20000 / TIME_SCALE;          // gameplay suppression window
  const visualDur = Math.max(gameDur, 5000);   // circle stays at least 5 real seconds
  const radius = 80;
  const zone = L.circle(latlng, {
    radius, color: '#ff5722', fillColor: '#ff5722', fillOpacity: 0.12,
    weight: 2, dashArray: '5 4', opacity: 0.8
  }).addTo(map);
  const expires = Date.now() + gameDur;
  suppressedZones.push({ circle: zone, expiresAt: expires });
  // Apply suppression to any units currently in the zone
  const pt = [latlng.lat, latlng.lng];
  allMarkers.forEach(m => {
    if (segMeters(markerPos(m), pt) <= radius) {
      m._suppressedUntil = Math.max(m._suppressedUntil || 0, expires);
      showSuppressedRing(m);
    }
  });
  // Remove circle after visual duration; zone already removed from suppressedZones by then
  setTimeout(() => {
    map.removeLayer(zone);
    const idx = suppressedZones.findIndex(z => z.circle === zone);
    if (idx >= 0) suppressedZones.splice(idx, 1);
  }, visualDur);
  // Animate burst of tracers from attacker to impact zone
  const posA = markerPos(attacker);
  const jitter = () => (Math.random() - 0.5) * 0.0008;
  for (let wave = 0; wave < 4; wave++) {
    setTimeout(() => {
      for (let i = 0; i < 4; i++) {
        const marker = L.marker([posA[0], posA[1]],
          { icon: bulletIcon(), zIndexOffset: 350, interactive: false }).addTo(map);
        flyingBullets.push({ marker, lat: posA[0], lng: posA[1],
          dstLat: latlng.lat + jitter(), dstLng: latlng.lng + jitter(), born: Date.now() });
      }
    }, wave * 120);
  }
  unitLog(attacker, `Area suppression placed at ${latlng.lat.toFixed(4)},${latlng.lng.toFixed(4)}`);
  showToast('Area suppression active', '#ff5722');
  if (allMarkers.includes(attacker)) { activePanel = attacker; renderPanel(); }
}

const statusEl = document.getElementById('status');
function setStatus(msg) {
  statusEl.classList.remove('interactive');
  statusEl.style.display = msg ? 'block' : 'none';
  statusEl.textContent = msg;
}

// ── helpers ───────────────────────────────────────────────────
function segMeters(a, b) {
  const dlat = (b[0]-a[0]) * 111320;
  const dlng = (b[1]-a[1]) * 111320 * Math.cos(a[0]*Math.PI/180);
  return Math.sqrt(dlat*dlat + dlng*dlng);
}
function markerPos(m) { const ll = m.getLatLng(); return [ll.lat, ll.lng]; }
function findEnemiesInRange(marker, radiusKm) {
  const pos = markerPos(marker), maxM = radiusKm * 1000;
  return allMarkers.filter(m => m !== marker && m._side !== marker._side && segMeters(pos, markerPos(m)) <= maxM);
}
function findFriendliesInRange(marker, radiusKm, excludeSelf = false) {
  const pos = markerPos(marker), maxM = radiusKm * 1000;
  return allMarkers.filter(m => {
    if (excludeSelf && m === marker) return false;
    return m._side === marker._side && segMeters(pos, markerPos(m)) <= maxM;
  });
}
function etaSeconds(state) {
  const { route, seg, t } = state;
  if (seg >= route.length - 1) return 0;
  let dist = segMeters(route[seg], route[seg+1]) * (1 - t);
  for (let i = seg + 1; i < route.length - 1; i++) dist += segMeters(route[i], route[i+1]);
  return dist / WALK_MS;
}
function formatETA(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.round(s % 60);
  if (h > 0) return `${h}h ${m}min ${sec}s`;
  if (m > 0) return `${m}min ${sec}s`;
  return `${sec}s`;
}

// ── toast ─────────────────────────────────────────────────────
function showExplosion(latlng, sizePx) {

// Persistent fading crater / smoke on the map after impact
const _craterMarkers = []; // { marker, removeAt }
function showCrater(latlng, type) {

function showToast(msg, color) {

  area.appendChild(t);

function unitLog(m, text) {
  if (!m || !m._log) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  m._log.unshift({ time: `${hh}:${mm}:${ss}`, text });
  if (m._log.length > 20) m._log.length = 20;
}

// ── unit removal / damage ─────────────────────────────────────
function removeUnit(marker) {
  if (marker._artPending) { map.removeLayer(marker._artPending.aimCircle); marker._artPending = null; }
  if (marker._supply?.convoyMarker) { map.removeLayer(marker._supply.convoyMarker); marker._supply = null; }
  marker._fpvReadyAt = 0;
  endFight(marker);
  for (const [atk, f] of activeFights) { if (f.defender === marker) endFight(atk); }
  removeGhost(marker);
  removeSuppressedRing(marker);
  const idx = allMarkers.indexOf(marker);
  if (idx >= 0) allMarkers.splice(idx, 1);
  clearRoute(marker);
  map.removeLayer(marker);
  if (activePanel === marker) closePanel();
}
function damageUnit(marker, casualties) {
  if (casualties <= 0) return false;
  if (marker._soldiers?.length) {
    // Kill individual soldiers randomly
    let alive = aliveSoldiers(marker);
    for (let i = 0; i < casualties && alive.length; i++) {
      const idx = Math.floor(Math.random() * alive.length);
      alive[idx].alive = false;
      alive.splice(idx, 1);
    }
    marker._count = aliveSoldiers(marker).length;
    // Sync ammo pool from surviving soldiers
    marker._ammo   = aliveSoldiers(marker).reduce((s, sol) => s + sol.ammo, 0);
    marker._maxAmmo = marker._soldiers.reduce((s, sol) => s + (SOLDIER_ROLES[sol.role] ?? SOLDIER_ROLES['rifleman']).ammo, 0);
    if (marker._count === 0) { removeUnit(marker); return true; }
    marker.setIcon(soldierIcon(marker._side, marker._count, marker._role));
    return false;
  }
  marker._count = Math.max(0, marker._count - casualties);
  if (marker._count === 0) { removeUnit(marker); return true; }
  marker.setIcon(soldierIcon(marker._side, marker._count, marker._role));
  return false;
}

// ── combat mode ───────────────────────────────────────────────
let combatMode = null, combatActor = null, combatArc = null;
const combatTargetHandlers = [];

function enterCombatMode(mode, actor, rangeKm, arcColor) {

  combatMode = mode; combatActor = actor;
  combatArc = L.circle(actor.getLatLng(), {
    radius: rangeKm * 1000, color: arcColor, fill: true, fillColor: arcColor,
    fillOpacity: 0.06, weight: 3, opacity: 1
  }).addTo(map);
  map.getContainer().style.cursor = 'crosshair';
}
function exitCombatMode() {
  combatMode = null; combatActor = null;
  if (combatArc) { map.removeLayer(combatArc); combatArc = null; }
  while (combatTargetHandlers.length) { const { m, h } = combatTargetHandlers.pop(); m.off('click', h); }
  clearFPVHorizon();
  if (!drawMode) { map.getContainer().style.cursor = ''; setStatus(''); }
}

// ── unit panel ─────────────────────────────────────────────────
let panelRangeCircle = null;

function clearPanelRange() {
  if (panelRangeCircle) { map.removeLayer(panelRangeCircle); panelRangeCircle = null; }
}

function unitDisplayRangeKm(m) {
  if (m._role === 'infantry' || m._role === 'mortar') return unitRangeM(m) / 1000;
  if (m._role === 'fpv')       return FPV_RADIO_HORIZON_M / 1000;
  if (m._role === 'artillery') return 25;
  if (m._role === 'mavic')     return MAVIC_GND_RADIUS / 1000;
  return null;
}

function showPanelRange(m) {
  clearPanelRange();
  const rangeKm = unitDisplayRangeKm(m);
  if (!rangeKm) return;
  const roleColors = { infantry:'#42a5f5', fpv:'#ef5350', artillery:'#ff9500', mortar:'#ffa726', mavic:'#26c6da' };
  const color = roleColors[m._role] ?? '#fff';
  panelRangeCircle = L.circle(m.getLatLng(), {
    radius: rangeKm * 1000, color, fill: true, fillColor: color,
    fillOpacity: 0.04, weight: 1.5, opacity: 0.65, dashArray: '6 4'
  }).addTo(map);
}

function updatePanelRange() {
  if (!activePanel || !panelRangeCircle) return;
  const ll = activePanel.getLatLng();
  panelRangeCircle.setLatLng(ll);
  // Recompute radius in case elevation-dependent range changed
  const newRangeKm = unitDisplayRangeKm(activePanel);
  if (newRangeKm && Math.abs(panelRangeCircle.getRadius() - newRangeKm * 1000) > 1) {
    panelRangeCircle.setRadius(newRangeKm * 1000);
  }
}

function closePanel() {
  activePanel = null; pendingSplitCount = null;
  clearPanelRange();
  document.getElementById('unit-panel').style.display = 'none';
}

/* ── panel helpers ── */
function _pb(label, icon, cls, onclick, disabled) {

  const c = ['pb', cls].filter(Boolean).join(' ');

}

}
function _buildStats(m, now) {
