}

// ── Profile chart ──
const HZ_PROFILE_DENSE = 220;
const HZ_PROFILE_PAD = {L:40,R:8,T:8,B:16};
let hzProfileReqId=0, hzProfileSamples=null, hzProfileDomain=null;
async function hzFetchDenseProfile(entry, idx) {
  const a=entry.horizonAngles[idx]; if (!a) return null;
  const dists=[];
  for (let i=1;i<=HZ_PROFILE_DENSE;i++) dists.push(entry.maxRangeM*(i/HZ_PROFILE_DENSE));
  const latlngs=dists.map(d=>hzDest(entry.point,a.bearing,d));
  const elevs=await Promise.all(latlngs.map(p=>hzFetchElevAt(p,HZ_ELEV_ZOOM)));
  return dists.map((d,i)=>({distM:d,elevM:elevs[i],latlng:latlngs[i]}));
}
function hzProfileGeo(samples,eyeAbs,slope,W,H,domain){
  const groundY=s=>s.elevM-hzCurvDrop(s.distM), losY=d=>eyeAbs+slope*d;
  const inR=samples.filter(s=>s.elevM!==null&&s.distM>=domain.min&&s.distM<=domain.max);
  const {L:pL,R:pR,T:pT,B:pB}=HZ_PROFILE_PAD, w=W-pL-pR, h=H-pT-pB;
  const gVals=inR.map(groundY);
  const losS=losY(domain.min),losE=losY(domain.max);
  const minE=Math.min(...(gVals.length?gVals:[losS]),losS,losE);
  const maxE=Math.max(...(gVals.length?gVals:[losS]),losS,losE);
  const range=Math.max(maxE-minE,1);
  return {pL,pT,w,h,minE,maxE,range,groundY,losY,
    xOf:d=>pL+((d-domain.min)/(domain.max-domain.min))*w,
    yOf:e=>pT+h-((e-minE)/range)*h};
}
function hzBuildProfileSvg(samples,eyeAbs,slope,W,H,domain){
  const valid=samples.filter(s=>s.elevM!==null&&s.distM>=domain.min&&s.distM<=domain.max);
  if (valid.length<2) return '<div style="font-size:11px;color:#8891a5;padding:6px 0;">Not enough terrain data along this direction.</div>';
  const geo=hzProfileGeo(samples,eyeAbs,slope,W,H,domain);
  const {pL,pT,w,h,minE,maxE,groundY,losY,xOf,yOf}=geo;
  let pathD='',started=false;
  samples.forEach(s=>{
    if (s.elevM===null||s.distM<domain.min||s.distM>domain.max){started=false;return;}
    const x=xOf(s.distM),y=yOf(groundY(s));
    pathD+=(started?'L':'M')+x.toFixed(1)+','+y.toFixed(1);
    started=true;
  });
  const areaD=pathD+' L'+xOf(domain.max).toFixed(1)+','+(pT+h).toFixed(1)+' L'+xOf(domain.min).toFixed(1)+','+(pT+h).toFixed(1)+' Z';
  const losD='M'+xOf(domain.min).toFixed(1)+','+yOf(losY(domain.min)).toFixed(1)+' L'+xOf(domain.max).toFixed(1)+','+yOf(losY(domain.max)).toFixed(1);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none" style="display:block;cursor:crosshair;touch-action:none;">'+
    '<line x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(pT+h)+'" stroke="#3a4255" stroke-width="1"/>'+
    '<line x1="'+pL+'" y1="'+(pT+h)+'" x2="'+(pL+w)+'" y2="'+(pT+h)+'" stroke="#3a4255" stroke-width="1"/>'+
    '<path d="'+areaD+'" fill="#eef1f7" fill-opacity="0.1" stroke="none"/>'+
    '<path d="'+pathD+'" fill="none" stroke="#eef1f7" stroke-width="1.4"/>'+
    '<path d="'+losD+'" fill="none" stroke="#ff9e4a" stroke-width="1.6"/>'+
    '<text x="2" y="'+(pT+8)+'" font-size="9" fill="#8891a5">'+Math.round(maxE)+'m</text>'+
    '<text x="2" y="'+(pT+h)+'" font-size="9" fill="#8891a5">'+Math.round(minE)+'m</text>'+
    '<text x="'+pL+'" y="'+(H-3)+'" font-size="9" fill="#8891a5">'+fmtDist(domain.min)+'</text>'+
    '<text x="'+(pL+w)+'" y="'+(H-3)+'" font-size="9" fill="#8891a5" text-anchor="end">'+fmtDist(domain.max)+' max</text>'+
    '<line class="hz-hover-line" x1="0" y1="'+pT+'" x2="0" y2="'+(pT+h)+'" stroke="#eef1f7" stroke-width="1" stroke-dasharray="3 2" opacity="0" pointer-events="none"/>'+
    '<circle class="hz-hover-dot" r="5" fill="#e0a83f" stroke="#0d1117" stroke-width="2" opacity="0" pointer-events="none"/>'+
    '</svg>'+
    '<div class="elev-hover-stat hz-profile-stat">&nbsp;</div>';
}
function hzWireProfileHover(wrapEl,samples,eyeAbs,slope,W,H,domain){
  const svg=wrapEl.querySelector('svg'); if (!svg) return;
  const valid=samples.filter(s=>s.elevM!==null&&s.distM>=domain.min&&s.distM<=domain.max);
  if (valid.length<2) return;
  const geo=hzProfileGeo(samples,eyeAbs,slope,W,H,domain);
  const {pL,w,groundY,xOf,yOf}=geo;
  const hl=svg.querySelector('.hz-hover-line'),hd=svg.querySelector('.hz-hover-dot');
  const stat=wrapEl.querySelector('.hz-profile-stat');
  function update(clientX){
    const rect=svg.getBoundingClientRect(); if (!rect.width) return;
    const xPx=(clientX-rect.left)*(W/rect.width);
    const frac=Math.min(1,Math.max(0,(xPx-pL)/w));
    const tgt=domain.min+frac*(domain.max-domain.min);
    let best=null,bestD=Infinity;
    valid.forEach(s=>{const d=Math.abs(s.distM-tgt);if(d<bestD){bestD=d;best=s;}});
    if (!best){hide();return;}
    const x=xOf(best.distM),y=yOf(groundY(best));
    hl.setAttribute('x1',x);hl.setAttribute('x2',x);hl.setAttribute('opacity','0.6');
    hd.setAttribute('cx',x);hd.setAttribute('cy',y);hd.setAttribute('opacity','1');
    stat.innerHTML=fmtDist(best.distM)+' <b style="color:#3254AD;">'+Math.round(best.elevM)+'m</b>';
    hzShowMapMarker(best.latlng);
  }
  function hide(){hl.setAttribute('opacity','0');hd.setAttribute('opacity','0');stat.innerHTML='&nbsp;';hzHideMapMarker();}
  hzWireZoomPan(svg,()=>hzProfileDomain,(mn,mx)=>{hzProfileDomain={min:mn,max:mx};},
    hzProfileSamples?hzProfileSamples[hzProfileSamples.length-1].distM:domain.max,
    ()=>hzRenderProfileChart());
  svg.addEventListener('pointermove',(e)=>update(e.clientX));
  svg.addEventListener('pointerleave',hide);
}
function hzRenderProfileChart(){
  const entry=hzCurrentEntry; if (!entry) return;
  const idx=hzSelectedIdx, a=entry.horizonAngles[idx];
  const label=a?hzFmtBearing(a.bearing):'';
  const w=document.getElementById('hzProfileWrap');
  if (!hzProfileSamples||!hzProfileSamples.length){
    w.innerHTML='<div class="hz-micro">Profile — '+label+'</div><div style="font-size:11px;color:#8891a5;padding:6px 0;">Not enough terrain data.</div>';
    return;
  }
  const eyeAbs=Math.max((entry.groundElev||0)+HZ_EYE_M,0);
  const slope=a&&a.angleDeg!==null?Math.tan(a.angleDeg*Math.PI/180):0;
  w.innerHTML='<div class="hz-micro">Profile — '+label+' · scroll to zoom, drag to pan</div>'+
    hzBuildProfileSvg(hzProfileSamples,eyeAbs,slope,420,110,hzProfileDomain);
  hzWireProfileHover(w,hzProfileSamples,eyeAbs,slope,420,110,hzProfileDomain);
}
async function hzRenderProfile(entry,idx){
  const myId=++hzProfileReqId;
  const a=entry.horizonAngles[idx], label=a?hzFmtBearing(a.bearing):'';
  document.getElementById('hzProfileWrap').innerHTML='<div class="hz-micro">Profile — '+label+'</div><div style="font-size:11px;color:#8891a5;padding:6px 0;">Loading profile…</div>';
  const samples=await hzFetchDenseProfile(entry,idx);
  if (myId!==hzProfileReqId) return;
  hzProfileSamples=samples;
  if (!hzProfileDomain) hzProfileDomain={min:0,max:entry.maxRangeM};
  hzRenderProfileChart();
}
function hzSelectBearing(entry,idx,mapClickLatLng){
  hzSelectedIdx=idx;
  hzWirePanoHover(document.getElementById('hzPanoWrap'),entry,420,96,hzPanoDomain||{min:0,max:360});
  hzRenderProfile(entry,idx);
  if (mapClickLatLng) hzShowMapMarker(mapClickLatLng);
}

// ── Visibility raster overlay ──
let hzRasterUrl=null;
function hzBuildRaster(entry){
  const visible=entry.raySamples.flatMap(s=>s.filter(p=>p.visible));
  if (!visible.length) return null;
  const {point,maxRangeM,numBearings}=entry;
  const refLat=point.lat*Math.PI/180;
  const mLat=111320, mLng=111320*Math.cos(refLat);
  const dimM=maxRangeM*2, pxPerM=HZ_RASTER_DIM/dimM;
  const canvas=document.createElement('canvas');
  canvas.width=canvas.height=HZ_RASTER_DIM;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ff9e4a';
  const angSpc=(2*Math.PI)/numBearings;
  const radStep=maxRangeM/(entry.raySamples[0]?entry.raySamples[0].length:1);
  visible.forEach(p=>{
    const dx=(p.latlng.lng-point.lng)*mLng, dy=(p.latlng.lat-point.lat)*mLat;
    const x=HZ_RASTER_DIM/2+dx*pxPerM, y=HZ_RASTER_DIM/2-dy*pxPerM;
    const angGapM=p.distM*angSpc;
    const rM=Math.max(10,Math.max(angGapM,radStep)*0.62);
    const rPx=Math.max(1.2,rM*pxPerM);
    ctx.beginPath(); ctx.arc(x,y,rPx,0,Math.PI*2); ctx.fill();
  });
  const bounds=L.latLngBounds(
    L.latLng(point.lat-(dimM/2)/mLat, point.lng-(dimM/2)/mLng),
    L.latLng(point.lat+(dimM/2)/mLat, point.lng+(dimM/2)/mLng));
  return {canvas,bounds};
}
function hzShowRaster(entry){
  const built=hzBuildRaster(entry); if (!built) return;
  built.canvas.toBlob(blob=>{
    if (!blob||hzCurrentEntry!==entry) return;
    if (hzRasterUrl) URL.revokeObjectURL(hzRasterUrl);
    const url=URL.createObjectURL(blob); hzRasterUrl=url;
    if (hzShape) map.removeLayer(hzShape);
    hzShape=L.imageOverlay(url,built.bounds,{opacity:0.75,interactive:false}).addTo(map);
  },'image/webp',0.85);
}

// ── Core computation ──
let hzMarker=null, hzShape=null, hzPoint=null, hzCurrentEntry=null;
let hzSelectedIdx=0, hzReqId=0;

async function hzCalcAt(latlng){
  hzPoint=latlng;
  await hzCompute();
}
async function hzCompute(){
  if (!hzPoint) return;
  const reqId=++hzReqId;
  const pt=document.getElementById('hzProgressTrack'), pf=document.getElementById('hzProgressFill');
  pt.style.display='block'; pf.style.width='0%';
  const groundElev=await hzFetchElevAt(hzPoint);
  if (reqId!==hzReqId) return;
  const eyeAbs=Math.max((groundElev||0)+HZ_EYE_M,0);
  const maxRangeM=Math.min(HZ_MAX_RANGE_CAP_M,Math.max(500,4120*Math.sqrt(eyeAbs)));
  const rayDists=[];
  for (let i=1;i<=HZ_SAMPLES_PER_RAY;i++) rayDists.push(maxRangeM*(i/HZ_SAMPLES_PER_RAY));
  const rays=[];
  for (let b=0;b<HZ_NUM_BEARINGS;b++){
    const bearing=(360/HZ_NUM_BEARINGS)*b;
    rays.push({bearing,latlngs:rayDists.map(d=>hzDest(hzPoint,bearing,d))});
  }
  const allPts=rays.flatMap(r=>r.latlngs);
  let completed=0,lastPct=-1;
  const allElevs=await Promise.all(allPts.map(p=>hzFetchElevAt(p,HZ_ELEV_ZOOM).then(v=>{
    completed++;
    const pct=Math.floor((completed/allPts.length)*100);
    if (pct!==lastPct&&reqId===hzReqId){lastPct=pct;pf.style.width=pct+'%';}
    return v;
  })));
  if (reqId!==hzReqId) return;
  let idx=0;
  const frontier=[], horizonAngles=[], raySamples=[];
  let minDist=Infinity, maxDist=0;
  for (const ray of rays){
    let runMax=-Infinity, lastLL=hzPoint;
    let lastDist=0;
    const samples=[];
    for (let i=0;i<rayDists.length;i++){
      const e=allElevs[idx++], d=rayDists[i];
      if (e===null||e===undefined){samples.push({distM:d,elevM:null,latlng:ray.latlngs[i],visible:false});continue;}
      const angle=(e-(d*d)/(2*HZ_EARTH_R_EFF)-eyeAbs)/d;
      const visible=angle>=runMax;
      samples.push({distM:d,elevM:e,latlng:ray.latlngs[i],visible});
      if (visible){runMax=angle;lastDist=d;lastLL=ray.latlngs[i];}
    }
    frontier.push(lastLL);
    horizonAngles.push({bearing:ray.bearing,angleDeg:runMax===-Infinity?null:Math.atan(runMax)*180/Math.PI});
    raySamples.push(samples);
    if (lastDist>0){minDist=Math.min(minDist,lastDist);maxDist=Math.max(maxDist,lastDist);}
  }
  const entry={
    point:hzPoint,frontier,horizonAngles,raySamples,groundElev,
    minDist:minDist===Infinity?0:minDist,maxDist,maxRangeM,numBearings:HZ_NUM_BEARINGS
  };
  hzAddHistory(entry);
  hzDrawResult(entry);
}

// ── Draw result ──
function hzDrawResult(entry){
  hzPoint=entry.point; hzCurrentEntry=entry; hzSelectedIdx=0;
  hzPanoDomain=null; hzProfileDomain=null; hzProfileSamples=null;
  if (hzMarker) map.removeLayer(hzMarker);
  if (hzShape){map.removeLayer(hzShape);hzShape=null;}
  hzMarker=L.circleMarker(entry.point,{radius:5,color:'#ff9e4a',weight:2,fillOpacity:1,fillColor:'#12151a',interactive:false}).addTo(map);
  if (entry.raySamples&&entry.raySamples.length) hzShowRaster(entry);
  document.getElementById('hzProgressTrack').style.display='none';
  if (entry.horizonAngles&&entry.horizonAngles.length){
    hzRenderPano(entry);
    hzRenderProfile(entry,hzSelectedIdx);
  }
}

// ── History ──
let hzHistory=[], hzHistoryId=1, hzActiveHistId=null;
const HZ_HIST_MAX=20, HZ_HIST_KEY='vpi1HorizonHistory_v1';
const hzHistLayerGroup=L.layerGroup();
function hzAddHistory(entry){
  entry.id=hzHistoryId++;
  entry.dotMarker=L.circleMarker(entry.point,{radius:4,color:'#ff9e4a',weight:1.5,fillOpacity:0.6,fillColor:'#ff9e4a'})
    .addTo(hzHistLayerGroup)
    .on('click',(e)=>{L.DomEvent.stopPropagation(e);hzShowHistEntry(entry.id);});
  hzHistory.unshift(entry); hzActiveHistId=entry.id;
  if (hzHistory.length>HZ_HIST_MAX){const r=hzHistory.pop();hzHistLayerGroup.removeLayer(r.dotMarker);}
  hzRenderHistList(); hzSaveHistory();
}
function hzSaveHistory(){
  try{
    const plain=hzHistory.map(h=>({
      id:h.id,groundElev:h.groundElev,minDist:h.minDist,maxDist:h.maxDist,
      point:{lat:h.point.lat,lng:h.point.lng},
      frontier:h.frontier.map(p=>({lat:p.lat,lng:p.lng})),
      horizonAngles:h.horizonAngles||[],
      maxRangeM:h.maxRangeM,numBearings:h.numBearings
    }));
    localStorage.setItem(HZ_HIST_KEY,JSON.stringify(plain));
  }catch(e){}
}
function hzLoadHistory(){
  let stored;
  try{stored=JSON.parse(localStorage.getItem(HZ_HIST_KEY)||'[]');}catch(e){return;}
  if (!Array.isArray(stored)||!stored.length) return;
  let maxId=0;
  hzHistory=stored.slice(0,HZ_HIST_MAX).map(h=>{
    maxId=Math.max(maxId,h.id||0);
    const entry={
      id:h.id,groundElev:h.groundElev,minDist:h.minDist,maxDist:h.maxDist,
      point:L.latLng(h.point.lat,h.point.lng),
      frontier:h.frontier.map(p=>L.latLng(p.lat,p.lng)),
      horizonAngles:h.horizonAngles||[],
      maxRangeM:h.maxRangeM,numBearings:h.numBearings,raySamples:[]
    };
    entry.dotMarker=L.circleMarker(entry.point,{radius:4,color:'#ff9e4a',weight:1.5,fillOpacity:0.6,fillColor:'#ff9e4a'})
      .addTo(hzHistLayerGroup)
      .on('click',(e)=>{L.DomEvent.stopPropagation(e);hzShowHistEntry(entry.id);});
    return entry;
  });
  hzHistoryId=maxId+1;
  hzRenderHistList();
}
hzLoadHistory();
function hzShowHistEntry(id){
  const entry=hzHistory.find(h=>h.id===id); if (!entry) return;
  hzReqId++; hzActiveHistId=id; hzDrawResult(entry); hzRenderHistList();
}
function hzRenderHistList(){
  const el=document.getElementById('hzHistoryList'); if (!el) return;
  if (!hzHistory.length){el.innerHTML='';return;}
  el.innerHTML=hzHistory.map(h=>
    '<button class="hz-history-item'+(h.id===hzActiveHistId?' hz-active':'')+'" data-hid="'+h.id+'" title="'+fmtDist(h.minDist)+'–'+fmtDist(h.maxDist)+' range">'+fmtDist(h.maxDist)+' max</button>'
  ).join('');
  el.querySelectorAll('.hz-history-item').forEach(btn=>btn.addEventListener('click',()=>hzShowHistEntry(+btn.dataset.hid)));
}

// ── Clear ──
function hzClear(){
  hzPoint=null; hzCurrentEntry=null; hzSelectedIdx=0;
  hzPanoDomain=null; hzProfileDomain=null; hzProfileSamples=null;
  hzProfileReqId++; hzReqId++;
  hzActiveHistId=null;
  if (hzMarker){map.removeLayer(hzMarker);hzMarker=null;}
  if (hzShape){map.removeLayer(hzShape);hzShape=null;}
  if (hzRasterUrl){URL.revokeObjectURL(hzRasterUrl);hzRasterUrl=null;}
  document.getElementById('hzProgressTrack').style.display='none';
  document.getElementById('hzPanoWrap').innerHTML='';
  document.getElementById('hzProfileWrap').innerHTML='';
  hzHideMapMarker();
  hzHistory.forEach(h=>hzHistLayerGroup.removeLayer(h.dotMarker));
  hzHistory=[]; hzHistoryId=1;
  hzRenderHistList(); hzSaveHistory();
}

// ── Toolbar toggle ──
let hzMode=false;
function toggleHorizonMode(){
  hzMode=!hzMode;
  document.getElementById('hz-btn').classList.toggle('ruler-on',hzMode);
  const panel=document.getElementById('hzPanel');
  panel.classList.toggle('hz-open',hzMode);
  if (hzMode){
    hzHistLayerGroup.addTo(map);
    setStatus('Horizon: click anywhere on the map to compute line of sight · Esc to close');
  } else {
    map.removeLayer(hzHistLayerGroup);
  }
}

// ── Map click handler ──
map.on('click',(e)=>{
  if (!hzMode) return;
  if (hzCurrentEntry&&e.latlng.distanceTo(hzCurrentEntry.point)<=hzCurrentEntry.maxRangeM){
    const bearing=hzBearing(hzCurrentEntry.point,e.latlng);
    hzSelectBearing(hzCurrentEntry,hzNearestRay(hzCurrentEntry,bearing),e.latlng);
  } else {
    hzCalcAt(e.latlng);
  }
});


// ═══════════════════════════════════════════════════════════════════════════
// RELAY ANTENNA & RADIO SIGNAL SYSTEM
// Physics: range = sqrt(2 * (4/3 * 6371000) * h_ant) + sqrt(2 * R * h_drone)
// Antenna established on top of building (7m), tree (15m) or tripod (2m)
// based on Overpass API terrain query at the unit's position.
// ═══════════════════════════════════════════════════════════════════════════

const _SIG_R_EFF = 6371000 * 4 / 3; // 4/3-Earth effective radius

/** Radio horizon contribution from a single height above ground */
function sigHorizon(h) { return Math.sqrt(2 * _SIG_R_EFF * Math.max(0, h)); }

/**
 * Total signal range for a drone unit.
 * Base = practical hardware limit (FPV_RADIO_HORIZON_M / MAVIC_CTRL_HORIZON_M).
 * With antenna: add the physics bonus vs ground-level operator (1.8m).
 */
function droneSignalRangeM(m) {
  const base = m._role === 'mavic' ? MAVIC_CTRL_HORIZON_M : FPV_RADIO_HORIZON_M;
  if (!m._antennaHeightM) return base;
  const bonus = sigHorizon(m._antennaHeightM) - sigHorizon(1.8);
  return Math.round(base + Math.max(0, bonus));
}

const droneAntennas = [];       // [{latlng, heightM, terrain, marker, side, unit}]
const pendingAntennaTimers = new Map(); // unit marker → timeoutId

/** Overpass API query to detect building or forest within 50m */
async function droneDetectTerrain(latlng) {
  try {
    const q = '[out:json][timeout:8];('
      + `way["building"](around:50,${latlng.lat},${latlng.lng});`
      + `node["building"](around:50,${latlng.lat},${latlng.lng});`
      + `way["landuse"~"^(forest|orchard)$"](around:50,${latlng.lat},${latlng.lng});`
      + `way["natural"="wood"](around:50,${latlng.lat},${latlng.lng});`
      + ');out tags;';
    const resp = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q));
    if (!resp.ok) return 'field';
    const data = await resp.json();
    if (data.elements.some(e => e.tags?.building)) return 'urban';
    if (data.elements.some(e =>
      e.tags?.landuse === 'forest' || e.tags?.natural === 'wood' || e.tags?.landuse === 'orchard'
    )) return 'forest';
    return 'field';
  } catch(e) { return 'field'; }
}

async function droneStartAntenna(m) {
  if (movingMarkers.has(m)) { showToast('Stop the unit before establishing an antenna.', '#ff9800'); return; }
  showToast('Scanning terrain…', '#8891a5');
  const latlng = m.getLatLng();
  const terrain = await droneDetectTerrain(latlng);
  // Height: Ukrainian village house roofline ≈ 6–7m; tree ≈ 15m; open field tripod ≈ 2m
  if (terrain === 'field') {
    showToast('No building or treeline here — cannot establish antenna in open field.', '#ef5350');
    m._antennaPending = null;
    if (activePanel === m) renderPanel();
    return;
  }
  const heightM = terrain === 'urban' ? 7 : 15;
  const terrainLabel = { urban: 'residential building (7 m)', forest: 'tree (15 m)' }[terrain];
  const durSec = terrain === 'urban' ? 90 : 60;
  m._antennaPending = { heightM, startAt: Date.now(), duration: durSec * 1000, terrain };
  if (activePanel === m) renderPanel();
  showToast(`Establishing antenna on ${terrainLabel} — ${durSec} s`, '#ffa726');
  const tid = setTimeout(() => {
    pendingAntennaTimers.delete(m);
    m._antennaPending = null;
    dronePlaceAntenna(m, heightM, terrain);
  }, durSec * 1000);
  pendingAntennaTimers.set(m, tid);
}

function dronePlaceAntenna(m, heightM, terrain) {
  droneRemoveAntenna(m, true);
  m._antennaHeightM = heightM;
  m._antennaPos = m.getLatLng();
  m._outOfSignal = false;
  const icons = { urban: '🏠', forest: '🌲', field: '⚑' };
  const antMarker = L.marker(m.getLatLng(), {
    icon: L.divIcon({
      className: '',
      html: '<div style="font-size:20px;line-height:1;filter:drop-shadow(0 1px 3px #000b);user-select:none;">'
          + icons[terrain] + '<span style="font-size:10px;vertical-align:super;">📡</span></div>',
      iconAnchor: [10, 20]
    }),
    interactive: false, zIndexOffset: 600
  }).addTo(map);
  const entry = { latlng: m.getLatLng(), heightM, terrain, marker: antMarker, side: m._side, unit: m };
  droneAntennas.push(entry);
  m._antennaEntry = entry;
  const rangeKm = (droneSignalRangeM(m) / 1000).toFixed(0);
  const terrainLabel = { urban: 'building', forest: 'tree', field: 'tripod' }[terrain];
  showToast(`Antenna on ${terrainLabel} (${heightM} m) · signal range ~${rangeKm} km`, '#66bb6a');
  if (activePanel === m) { showPanelRange(m); renderPanel(); }
}

function droneCancelAntenna(m) {
  const tid = pendingAntennaTimers.get(m);
  if (tid) clearTimeout(tid);
  pendingAntennaTimers.delete(m);
  m._antennaPending = null;
  if (activePanel === m) renderPanel();
  showToast('Antenna setup cancelled.', '#888');
}

function droneRemoveAntenna(m, silent) {
  if (m._antennaEntry) {
    try { map.removeLayer(m._antennaEntry.marker); } catch(e) {}
    const idx = droneAntennas.indexOf(m._antennaEntry);
    if (idx !== -1) droneAntennas.splice(idx, 1);
    m._antennaEntry = null;
  }
  m._antennaHeightM = null;
  m._antennaPos     = null;
  m._outOfSignal    = false;
  if (!silent) {
    showToast('Antenna removed.', '#888');
    if (activePanel === m) { showPanelRange(m); renderPanel(); }
  }
}

// ── Signal enforcement loop ───────────────────────────────────────────────
// Every 4 s: check if any friendly drone with an established antenna has
// drifted outside its signal range.  If so, stop it and warn the player.
setInterval(() => {
  if (!userSide) return;
  const now = Date.now();
  for (const m of allMarkers) {
    if (!m._antennaPos) continue;
    if (m._side !== userSide) continue;
    if (!['fpv', 'mavic'].includes(m._role)) continue;
    const dist = segMeters(markerPos(m), m._antennaPos);
    const sigR = droneSignalRangeM(m);
    if (dist > sigR * 1.02) {
      if (!m._outOfSignal) {
        m._outOfSignal = true;
        const label = ROLES[m._role]?.label ?? m._role;
        showToast(`${label} — signal lost! Stopping unit.`, '#ef5350');
        if (movingMarkers.has(m)) clearRoute(m);
      }
    } else {
      if (m._outOfSignal) {
        m._outOfSignal = false;
        showToast(`${ROLES[m._role]?.label ?? m._role} — signal restored.`, '#66bb6a');
      }
    }
  }
}, 4000);

// 2-D segment intersection helper (open endpoints — returns false on collinear/parallel)
function _seg2x(ax,ay,bx,by,cx,cy,dx,dy) {
  const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx);
  if(Math.abs(d)<1e-10) return false;
  const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d;
  const u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d;
  return t>0&&t<1&&u>0&&u<1;
}
// Returns true when the straight-line path from→to crosses any dragon's-teeth segment.
// Call before committing vehicle/armour movement: if(isBlockedByTeeth(from,to)) return;
function isBlockedByTeeth(fromLL, toLL) {
  const ax=fromLL.lng, ay=fromLL.lat, bx=toLL.lng, by=toLL.lat;
  for(const seg of _TEETH_SEGS)
    for(let i=0;i<seg.length-1;i++)
      if(_seg2x(ax,ay,bx,by,seg[i][1],seg[i][0],seg[i+1][1],seg[i+1][0])) return true;
  return false;
}

// ── Obstacle speed multipliers ─────────────────────────────────────────────────
// Ditches: ~3-4 m wide, ~2 m deep + earth parapet — extremely hard to cross
// Dragon's teeth: concrete pyramids — negligible for infantry, impassable for artillery
// Barbed wire: 2 rows concertina at ~1.8 m — significant infantry slowdown
function obstacleSpeedMult(obstType, role) {
  if (!obstType || role === 'mavic') return 1.0;
  if (obstType === 'ditches') {
    if (role === 'artillery') return 0.0;  // can't cross AT ditch
    if (role === 'mortar')    return 0.12; // crew-carried weapon, hardest
    if (role === 'fpv')       return 0.22; // individual, somewhat easier
    return 0.18;                           // infantry
  }
  if (obstType === 'teeth') {
    if (role === 'artillery') return 0.0;  // completely blocked
    if (role === 'mortar')    return 0.75; // can squeeze through on foot
    return 0.82;                           // infantry, fpv — minor slowdown
  }
  if (obstType === 'wire') {
    if (role === 'artillery') return 0.0;  // wire entangles tracks/wheels
    if (role === 'mortar')    return 0.30; // carrying equipment, harder
    if (role === 'fpv')       return 0.42; // individual
    return 0.38;                           // infantry
  }
  return 1.0;
}

// Check the current route segment [seg → seg+1] for any fortification crossing
function _curSegObstacle(route, seg) {
  const a = route[seg], b = route[seg+1];
  if (!a || !b) return null;
  const ax=a[1],ay=a[0],bx=b[1],by=b[0];
  for(const s of _DITCH_SEGS) for(let i=0;i<s.length-1;i++) if(_seg2x(ax,ay,bx,by,s[i][1],s[i][0],s[i+1][1],s[i+1][0])) return 'ditches';
  for(const s of _TEETH_SEGS) for(let i=0;i<s.length-1;i++) if(_seg2x(ax,ay,bx,by,s[i][1],s[i][0],s[i+1][1],s[i+1][0])) return 'teeth';
  for(const s of _WIRE_SEGS)  for(let i=0;i<s.length-1;i++) if(_seg2x(ax,ay,bx,by,s[i][1],s[i][0],s[i+1][1],s[i+1][0])) return 'wire';
  return null;
}

// Check all segments of a drawn route for any fortification crossing
function routeObstacleCrossing(points, role) {
  if (role === 'mavic') return null;
  for (let i = 0; i < points.length - 1; i++) {
    const ax=points[i][1],ay=points[i][0],bx=points[i+1][1],by=points[i+1][0];
    for(const s of _DITCH_SEGS) for(let j=0;j<s.length-1;j++) if(_seg2x(ax,ay,bx,by,s[j][1],s[j][0],s[j+1][1],s[j+1][0])) return 'ditches';
    for(const s of _TEETH_SEGS) for(let j=0;j<s.length-1;j++) if(_seg2x(ax,ay,bx,by,s[j][1],s[j][0],s[j+1][1],s[j+1][0])) return 'teeth';
    for(const s of _WIRE_SEGS)  for(let j=0;j<s.length-1;j++) if(_seg2x(ax,ay,bx,by,s[j][1],s[j][0],s[j+1][1],s[j+1][0])) return 'wire';
  }
  return null;
}

function _fortBlockMsg(obstType, role) {
  if (obstType === 'ditches') return role === 'artillery'
    ? 'Route blocked — artillery cannot cross anti-tank ditch!'
    : 'Route crosses anti-tank ditch — too deep to pass!';
  if (obstType === 'teeth') return "Route blocked — dragon’s teeth stop vehicle movement!";
  if (obstType === 'wire')  return role === 'artillery'
    ? 'Route blocked — artillery entangled in concertina wire!'
    : 'Route crosses barbed wire — too dense to pass!';
  return 'Route blocked by fortification!';
}
function _fortWarnMsg(obstType, role) {
  if (obstType === 'ditches') return 'Route crosses anti-tank ditch — movement severely slowed (~5×)';
  if (obstType === 'teeth')   return "Route crosses dragon’s teeth — movement slightly slowed";
  if (obstType === 'wire')    return 'Route crosses barbed wire — movement significantly slowed (~2.5×)';
  return 'Route crosses fortification — movement slowed';
}

function buildTerrainView() {
  terrainViewLayer.clearLayers();
  if (typeof terrainMaskLayer !== 'undefined') terrainMaskLayer.clearLayers();
  const svgR = L.svg({ pane: 'terrainViewPane' });
  // Pane-level opacity makes overlapping same-type polygons non-compounding
  map.getPane('terrainViewPane').style.opacity = '0.72';

  // Pass 1: forest (rendered below urban)
  for (const { ring, holes, urban } of terrainPolys) {
    if (urban) continue;
    const rings = holes?.length ? [ring, ...holes] : ring;
    L.polygon(rings, {
      renderer: svgR, interactive: false, pane: 'terrainViewPane',
      color: '#1a5c2a', weight: 1, opacity: 1,
      fillColor: '#2e7d3a', fillOpacity: 1
    }).addTo(terrainViewLayer);
  }
  // Pass 2: urban (rendered on top → urban wins on overlap)
  for (const { ring, holes, urban } of terrainPolys) {
    if (!urban) continue;
    const rings = holes?.length ? [ring, ...holes] : ring;
    L.polygon(rings, {
      renderer: svgR, interactive: false, pane: 'terrainViewPane',
      color: '#7a3a10', weight: 1, opacity: 1,
      fillColor: '#d4702a', fillOpacity: 1
    }).addTo(terrainViewLayer);
  }
  // Water bodies
  for (const { ring } of waterPolys) {
    L.polygon(ring, {
      renderer: svgR, interactive: false, pane: 'terrainViewPane',
      color: '#1a5cb5', weight: 1, opacity: 1,
      fillColor: '#4da6f5', fillOpacity: 1
    }).addTo(terrainViewLayer);
  }
  // Rivers/streams ({ pts, major })
  for (const { pts, major } of riverLines) {
    L.polyline(pts, {
      renderer: svgR, interactive: false, pane: 'terrainViewPane',
      color: '#4da6f5', weight: major ? 2.5 : 1.5, opacity: 1
    }).addTo(terrainViewLayer);
  }

  // Boundary mask — everything outside game area gets a grey overlay
  if (typeof terrainMaskLayer !== 'undefined' && _BOUNDARY_SEGS?.[0]?.length) {
    const worldBox = [[-89,-179],[89,-179],[89,179],[-89,179]];
    const svgMask = L.svg({ pane: 'terrainMaskPane' });
    L.polygon([worldBox, _BOUNDARY_SEGS[0]], {
      renderer: svgMask, interactive: false, pane: 'terrainMaskPane',
      stroke: false, fill: true, fillColor: '#c2cdd6', fillOpacity: 0.88
    }).addTo(terrainMaskLayer);
    if (mapMode === 'terrain' && !map.hasLayer(terrainMaskLayer))
      terrainMaskLayer.addTo(map);
  }
}

// ── Wikimapia urban areas (replaces OSM urban on success) ─────────────────────
async function _initWikimapiaUrban() {
  try {
    const bnd = _BOUNDARY_SEGS[0];
    const lats = bnd.map(p=>p[0]), lngs = bnd.map(p=>p[1]);
    const lat_min = Math.min(...lats), lat_max = Math.max(...lats);
    const lon_min = Math.min(...lngs), lon_max = Math.max(...lngs);
    const url = `https://wikimapia.org/api/?function=box&key=example`
      + `&lat_min=${lat_min}&lat_max=${lat_max}&lon_min=${lon_min}&lon_max=${lon_max}`
      + `&format=json&count=100&page=1&language=en`;
    const r = await fetch(url);
    if (!r.ok) return;
    const data = await r.json();
    const places = data.folder ?? [];
    const wikiUrban = [];
    for (const place of places) {
      const poly = place.polygon ?? place.geometry?.coordinates;
      if (!poly?.length) continue;
      // Convert {x:lon, y:lat} → [lat,lng]
      const ring = poly.map(p => typeof p.y !== 'undefined'
        ? [parseFloat(p.y), parseFloat(p.x)]
        : [parseFloat(p[1]), parseFloat(p[0])]);
      if (ring.length < 3) continue;
      // Filter: skip tiny objects (< 0.0001 deg² bounding box — roughly 1 ha)
      const latSpan = Math.max(...ring.map(p=>p[0])) - Math.min(...ring.map(p=>p[0]));
      const lngSpan = Math.max(...ring.map(p=>p[1])) - Math.min(...ring.map(p=>p[1]));
      if (latSpan * lngSpan < 0.0001) continue;
      wikiUrban.push({ ring, holes: null, urban: true });
    }
    if (wikiUrban.length > 0) {
      const forest = terrainPolys.filter(p => !p.urban);
      terrainPolys.splice(0, terrainPolys.length, ...forest, ...wikiUrban);
      spawnPolys = terrainPolys;
      buildTerrainView();
      console.log(`Wikimapia: loaded ${wikiUrban.length} urban polygons`);
    }
  } catch (e) {
    // Silently fall back to OSM urban data already in terrainPolys
    console.warn('Wikimapia unavailable, using OSM urban data:', e.message);
  }
}

let terrainInfoMode = false;

  terrainInfoMode = !terrainInfoMode;

function _fortNearPt(lat, lng) {
  const pt = [lat, lng];
  const thr = (25 / 111320) ** 2; // 25 m threshold (degrees²)
  for (const seg of _TEETH_SEGS)
    for (let i=0;i<seg.length-1;i++)
      if (pointNearSegment(pt, seg[i], seg[i+1], thr)) return 'teeth';
  for (const seg of _DITCH_SEGS)
    for (let i=0;i<seg.length-1;i++)
      if (pointNearSegment(pt, seg[i], seg[i+1], thr)) return 'ditches';
  for (const seg of _WIRE_SEGS)
    for (let i=0;i<seg.length-1;i++)
      if (pointNearSegment(pt, seg[i], seg[i+1], thr)) return 'wire';
  return null;
}

function _multLabel(m) {
  if (m === 0) return '<span style="color:#ef5350">BLOCKED</span>';
  if (m >= 1.0) return '<span style="color:#81c784">1× (clear)</span>';
  return `<span style="color:#ffb74d">${(1/m).toFixed(1)}× slower</span>`;
}

map.on('click', function(e) {
  if (!terrainInfoMode) return;
  const { lat, lng } = e.latlng;
  const pt = [lat, lng];
  const terrain = terrainAt(pt);
  const water   = waterAt(pt);
  const fort    = _fortNearPt(lat, lng);

  // Spotting factors (fraction of open-field detection rate)
  const spotDrone  = terrainSpotFactor(pt);
  const spotVisual = terrainVisualFactor(pt);
  const spotDronePct  = Math.round(spotDrone  * 100);
  const spotVisualPct = Math.round(spotVisual * 100);

  function _spotColor(pct) {
    if (pct <= 25) return '#81c784';   // green — very hidden
    if (pct <= 50) return '#ffb74d';   // amber — partial cover
    return '#ef5350';                  // red   — exposed
  }

  const ROLES_INFO = [
    { key:'infantry', sym:'⊕', label:'Infantry' },
    { key:'mortar',   sym:'⬡', label:'Mortar' },
    { key:'fpv',      sym:'▲', label:'FPV pilot' },
    { key:'mavic',    sym:'◈', label:'Mavic' },
    { key:'artillery',sym:'★', label:'Artillery' },
  ];

  const terrainIcon = { forest:'🌿', urban:'🏚', field:'◌' };
  const waterIcon   = { water:'🌊', river:'〰', stream:'⌇' };
  const fortLabel   = { ditches:'AT ditch', teeth:"Dragon's teeth", wire:'Barbed wire' };

  function _multLabel(m) {
    if (m === 0) return '<span style="color:#ef5350">BLOCKED</span>';
    if (m >= 1.0) return '<span style="color:#81c784">1× (clear)</span>';
    return `<span style="color:#ffb74d">${(1/m).toFixed(1)}× slower</span>`;
  }

  let moveRows = '';
  for (const { key, sym, label } of ROLES_INFO) {
    const wm = waterSpeedMult(water, key);
    const om = obstacleSpeedMult(fort, key);
    const total = Math.min(wm, om);
    moveRows += `<tr><td style="padding:1px 6px 1px 0;white-space:nowrap">${sym} ${label}</td>`
              + `<td>${_multLabel(total)}</td></tr>`;
  }

  const html = `<div style="font:12px/1.5 'Consolas',monospace;min-width:250px;color:#e0e0e0">
    <b style="font-size:13px;color:#ffffff">Terrain Analysis</b>
    <div style="color:#8899bb;font-size:10px;margin-bottom:4px">${lat.toFixed(5)}, ${lng.toFixed(5)}</div>

    <table style="width:100%;border-top:1px solid #334;padding-top:4px;margin-top:2px;border-collapse:collapse">
      <tr><td style="color:#8899bb;padding-right:8px">Terrain</td>
          <td>${terrainIcon[terrain]??'◌'} ${terrain}</td></tr>
      <tr><td style="color:#8899bb;padding-right:8px">Water</td>
          <td>${waterIcon[water] ?? '— none'}</td></tr>
      <tr><td style="color:#8899bb;padding-right:8px">Obstacle</td>
          <td>${fort ? (fortLabel[fort]??fort)+' (within 25m)' : '— none'}</td></tr>
    </table>

    <div style="margin-top:6px;border-top:1px solid #334;padding-top:4px">
      <div style="color:#8899bb;margin-bottom:3px">Detection risk vs open field:</div>
      <table style="width:100%;border-collapse:collapse">
        <tr>
          <td style="padding:1px 6px 1px 0">🚁 Drone/mavic</td>
          <td><span style="color:${_spotColor(spotDronePct)};font-weight:bold">${spotDronePct}%</span></td>
          <td style="color:#8899bb;font-size:10px;padding-left:4px">${spotDronePct<100?'(−'+(100-spotDronePct)+'%)':''}</td>
        </tr>
        <tr>
          <td style="padding:1px 6px 1px 0">👁 Visual/infantry</td>
          <td><span style="color:${_spotColor(spotVisualPct)};font-weight:bold">${spotVisualPct}%</span></td>
          <td style="color:#8899bb;font-size:10px;padding-left:4px">${spotVisualPct<100?'(−'+(100-spotVisualPct)+'%)':''}</td>
        </tr>
      </table>
    </div>

    <div style="margin-top:6px;border-top:1px solid #334;padding-top:4px">
      <div style="color:#8899bb;margin-bottom:2px">Movement modifiers:</div>
      <table style="width:100%;border-collapse:collapse">${moveRows}</table>
    </div>
  </div>`;

  L.popup({ maxWidth: 320, className: 'terrain-info-popup' })
    .setLatLng(e.latlng).setContent(html).openOn(map);
}));

// Wrap setMapMode to toggle the legend when entering/leaving terrain mode
(function() {
  const _orig = setMapMode;
  setMapMode = function(mode) {
    _orig(mode);
    const leg = document.getElementById('terrain-legend');
    if (leg) leg.style.display = mode === 'terrain' ? 'block' : 'none';
  };
  // Show immediately if already in terrain mode
  if (typeof mapMode !== 'undefined' && mapMode === 'terrain') {
    const leg = document.getElementById('terrain-legend');
    if (leg) leg.style.display = 'block';
  }
})();
