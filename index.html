<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ВПИ – Калькулятор боя</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px;
}
h1 { color: #7dd3fc; }
section {
    border: 1px solid #333;
    padding: 15px;
    margin-bottom: 20px;
}
label {
    display: block;
    margin-top: 8px;
}
input, select {
    width: 100%;
    padding: 4px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
}
button {
    margin-top: 20px;
    padding: 10px;
    width: 100%;
    background: #2563eb;
    color: white;
    border: none;
    font-size: 16px;
}
.result {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>
<body>

<h1>Военно-Политическая Игра — Бой</h1>

<section>
<h2>Общие параметры</h2>
<label>Местность обороны</label>
<select id="terrain">
    <option value="1.0">Равнина</option>
    <option value="1.2">Лес</option>
    <option value="1.3">Город</option>
    <option value="1.4">Горы</option>
</select>
</section>

<section>
<h2>Атакующая сторона</h2>
<label>Количество солдат</label>
<input id="a_soldiers" type="number" value="10000">

<label>Технологии (0.6–1.4)</label>
<input id="a_tech" type="number" step="0.1" value="1.0">

<label>Управление (0.5–1.3)</label>
<input id="a_cmd" type="number" step="0.1" value="1.0">

<label>Логистика (0.4–1.2)</label>
<input id="a_log" type="number" step="0.1" value="1.0">

<label>Мораль солдат (0.3–1.4)</label>
<input id="a_mor" type="number" step="0.1" value="1.0">
</section>

<section>
<h2>Обороняющаяся сторона</h2>
<label>Количество солдат</label>
<input id="d_soldiers" type="number" value="8000">

<label>Инженерная подготовка (0.8–1.4)</label>
<input id="d_eng" type="number" step="0.1" value="1.0">

<label>ПВО (0.7–1.3)</label>
<input id="d_aa" type="number" step="0.1" value="1.0">

<label>Логистика (0.6–1.2)</label>
<input id="d_log" type="number" step="0.1" value="1.0">

<label>Мораль солдат (0.4–1.3)</label>
<input id="d_mor" type="number" step="0.1" value="1.0">
</section>

<button onclick="calculate()">Рассчитать бой</button>

<div class="result" id="output"></div>

<script>
function calculate() {

    const terrain = parseFloat(document.getElementById("terrain").value);

    const aSold = parseFloat(document.getElementById("a_soldiers").value);
    const dSold = parseFloat(document.getElementById("d_soldiers").value);

    const aNum = Math.min(1.3, aSold / dSold);
    const dNum = Math.min(1.3, dSold / aSold);

    const KA =
        1.0 *
        parseFloat(aNum) *
        parseFloat(a_tech.value) *
        parseFloat(a_cmd.value) *
        parseFloat(a_log.value) *
        parseFloat(a_mor.value);

    const KD =
        1.0 *
        terrain *
        parseFloat(dNum) *
        parseFloat(d_eng.value) *
        parseFloat(d_aa.value) *
        parseFloat(d_log.value) *
        parseFloat(d_mor.value);

    const ratio = KA / KD;

    let text = "";
    if (ratio < 0.8) text = "Атака захлёбывается";
    else if (ratio < 1.1) text = "Позиционная мясорубка";
    else if (ratio < 1.4) text = "Медленный прорыв";
    else if (ratio < 1.8) text = "Оперативный прорыв";
    else text = "Коллапс обороны";

    document.getElementById("output").innerHTML =
        "Коэффициент атаки: " + KA.toFixed(2) + "<br>" +
        "Коэффициент защиты: " + KD.toFixed(2) + "<br>" +
        "<b>Итог: " + text + "</b>";
}
</script>

</body>
</html>
