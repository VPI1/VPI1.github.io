// ── Artillery / Mortar ────────────────────────────────────────
function enterArtilleryFire(unit) {
  if (unit._artPending) return;
  const isMortar = unit._role === 'mortar';
  const baseRangeKm = isMortar ? 3 : 25;
  // Fetch elevation for this unit to compute range modifier
  const pos = markerPos(unit);
  fetchElevation(pos[0], pos[1]).then(atkElev => {
    unit._artElev = atkElev;
  });
  enterCombatMode('artillery', unit, baseRangeKm, '#ff9500');
  setStatus(`${isMortar ? 'Mortar' : 'Fire'} Mission: click map to aim — Esc to cancel`);
  closePanel();
}

// Aim point selected → prep starts, then shell flies
function startArtilleryPrep(unit, latlng) {
  if (unit._artPending) return;
  unit._ammo = Math.max(0, unit._ammo - 1);
  const isMortar = unit._role === 'mortar';
  const prepMs    = (isMortar ? 10000 : 20000) / TIME_SCALE;
  const shellSpd  = isMortar ? 130   : 600;   // m/s
  const blastR    = isMortar ? 150   : 280;
  const dispMax   = isMortar ? 100   : 140;
  const distM = segMeters(markerPos(unit), [latlng.lat, latlng.lng]);
  // Elevation modifier: shooting downhill extends range/speed, uphill reduces it
  const elevMod = (() => {
    const atkE = unit._artElev ?? 0;
    const tgtE = elevCache.get(latlng.lat.toFixed(4)+','+latlng.lng.toFixed(4)) ?? 0;
    return Math.max(0.80, Math.min(1.20, 1 + (atkE - tgtE) / 1000));
  })();
  const flightMs  = Math.round((distM / (shellSpd * elevMod)) * 1000 / TIME_SCALE);
  const prepEndsAt = Date.now() + prepMs;
  const fireAt     = prepEndsAt + flightMs;
  const aimCircle = L.circle(latlng, {
    radius: isMortar ? 60 : 120, color: '#ff9500', fill: false, weight: 2, dashArray: '5 4', opacity: 0.9
  }).addTo(map);
  unit._artPending = { targetLatlng: latlng, aimCircle, prepEndsAt, fireAt, blastR, dispMax, flightMs };
  // Queue remaining repeat missions (99 = fire until empty)
  if (unit._taskQueue.length === 0 && unit._missionRepeat > 1) {
    const reps = unit._missionRepeat === 99 ? Math.max(0, (unit._ammo)) : unit._missionRepeat - 1;
    unit._taskQueue = Array.from({ length: reps }, () => ({ latlng }));
  }
  const queueNote = unit._taskQueue.length > 0 ? ` (+${unit._taskQueue.length} queued)` : '';
  const msg = `${isMortar?'Mortar':'Artillery'}: ${Math.round(prepMs/1000)}s prep + ${Math.round(flightMs/1000)}s flight${queueNote}`;
  unitLog(unit, `${isMortar?'Mortar':'Artillery'} mission started — ${fmtDist(distM)} · prep ${Math.round(prepMs/1000)}s${queueNote}`);
  showToast(msg, '#ffa726');
  if (activePanel === unit) renderPanel();
}

// Impact with dispersion using params stored at aim time
function applyArtilleryImpact(unit, pending) {
  const { targetLatlng, blastR, dispMax } = pending;
  const label = unit._role === 'mortar' ? 'Mortar' : 'Artillery';
  if (Math.random() < 0.15) {
    const missDir = ['long','short','left','right'][Math.floor(Math.random()*4)];
    unitLog(unit, `${label} — miss`);
    if (activePanel && allMarkers.includes(activePanel)) renderPanel();
    return;
  }
  const dispM = 20 + Math.random() * dispMax;
  const angle = Math.random() * 2 * Math.PI;
  const dLat = (dispM * Math.cos(angle)) / 111320;
  const dLng = (dispM * Math.sin(angle)) / (111320 * Math.cos(targetLatlng.lat * Math.PI / 180));
  const impact = L.latLng(targetLatlng.lat + dLat, targetLatlng.lng + dLng);
  const impactPt = [impact.lat, impact.lng];
  const finalR = blastR + Math.floor(Math.random() * 60 - 30);
  const blastCircle = L.circle(impact, { radius: finalR, color: '#ff9500', fillOpacity: 0.22, weight: 2 }).addTo(map);
  setTimeout(() => map.removeLayer(blastCircle), 4000);
  let hits = 0, destroyed = 0;
  [...allMarkers].forEach(m => {
    if (segMeters(markerPos(m), impactPt) <= finalR) {
      const distToUnit = segMeters(markerPos(m), impactPt);
      const shellType = unit._role === 'mortar' ? 'mortar' : 'arty';
      // Structural damage to the position regardless of personnel casualties
      if (m._fortLevel > 0) damageFortification(m, distToUnit, finalR, shellType);
      const artCover = FORT_COVER.artillery[m._fortLevel ?? 0] ?? 0;
      if (Math.random() < artCover) {
        unitLog(m, `Shell nearby — cover held (${FORT_LABELS[m._fortLevel ?? 0] || 'none'})`);
        return;
      }
      const cas = 1 + Math.floor(Math.random() * 2);
      const wasDestroyed = damageUnit(m, cas);
      unitLog(m, `Hit by ${label.toLowerCase()} shell −${cas}${wasDestroyed?' (destroyed)':''}`);
      if (wasDestroyed) destroyed++; else hits++;
    }
  });
  const total = hits + destroyed;
  const resultText = total === 0
    ? `${label} — miss · no casualties`
    : (() => {
        const hitDesc = [...allMarkers].filter(m => segMeters(markerPos(m), impactPt) <= finalR)
          .map(m => ROLES[m._role]?.label ?? m._role).join(', ');
        return `${label} — HIT · ${total} casualt${total===1?'y':'ies'}${destroyed?` · ${destroyed} destroyed`:''} · ${hitDesc}`;
      })();
  // Result only confirmed with recon on the impact area
  confirmOrQueue(unit._side, impactPt[0], impactPt[1],
    [{ marker: unit, text: resultText }],
    resultText);
  if (activePanel && allMarkers.includes(activePanel)) renderPanel();
  if (unit._taskQueue?.length > 0 && unit._ammo > 0) {
    const next = unit._taskQueue.shift();
    setTimeout(() => startArtilleryPrep(unit, next.latlng), 2000 / TIME_SCALE);
  }
}

// 100ms interval — drone flight animations
setInterval(() => {
  // ── Mavic flight ──
  const now_m = Date.now();
  for (const m of allMarkers) {
    const mis = m._mavicMission;
    if (!mis) continue;
    const step = MAVIC_SPD * 0.1;
    if (mis.phase === 'outbound' || mis.phase === 'returning') {
      const dist = segMeters([mis.lat, mis.lng], [mis.dstLat, mis.dstLng]);
      if (dist <= step) {
        if (mis.phase === 'outbound') {
          // Arrived at scan area — save target NOW (before returning home overwrites dstLat/dstLng)
          m._lastScanTarget = { lat: mis.dstLat, lng: mis.dstLng };
          mis.lat = mis.dstLat; mis.lng = mis.dstLng;
          mis.phase = 'scanning';
          // Use battery-derived hover time
          const hoverSec = mis.hoverSec ?? 5;
          mis.scanEndsAt = now_m + hoverSec * 1000;
          mis.scanCircle = L.circle([mis.dstLat, mis.dstLng], {
            radius: MAVIC_GND_RADIUS, color: '#26c6da', fill: true, fillOpacity: 0.07, weight: 1.5, dashArray: '6 4'
          }).addTo(map);
          mis.droneMarker.setTooltipContent(`Scanning ${hoverSec.toFixed(1)}s`);
          if (activePanel === m) renderPanel();
        } else {
          // Returned home — deduct return battery
          map.removeLayer(mis.droneMarker);
          if (mis.scanCircle) map.removeLayer(mis.scanCircle);
          m._mavicBattery = Math.max(0, m._mavicBattery - (mis.returnBatt ?? 0));
          if (m._autoBatterySwap) { m._mavicBattery = 100; } // instant swap
          m._mavicCooldownUntil = now_m + (m._autoBatterySwap ? 5000 : 60000) / TIME_SCALE;
          // _lastScanTarget was saved when scanning started — do NOT overwrite with home position here
          if (m._continuousRecon) m._nextReconAt = now_m + (m._autoBatterySwap ? 8000 : 65000) / TIME_SCALE;
          m._mavicMission = null;
          unitLog(m, `Mavic returned — battery ${Math.round(m._mavicBattery)}%${m._autoBatterySwap?' (swapped→100%)':''}`);
          showToast(`Mavic returned — ${Math.round(m._mavicBattery)}% battery left`, '#26c6da');
          if (activePanel === m) renderPanel();
        }
      } else {
        const r = step / dist;
        mis.lat += (mis.dstLat - mis.lat) * r;
        mis.lng += (mis.dstLng - mis.lng) * r;
        mis.droneMarker.setLatLng([mis.lat, mis.lng]);
        const etaS = Math.ceil(segMeters([mis.lat, mis.lng], [mis.dstLat, mis.dstLng]) / MAVIC_SPD);
        mis.droneMarker.setTooltipContent(`ETA ${fmtETA(etaS)}`);
      }
    } else if (mis.phase === 'scanning') {
      // Drain hover battery in real time
      m._mavicBattery = Math.max(0, m._mavicBattery - MAVIC_HOVER_BATT_PER_SEC * 0.1);
      const remSec = Math.max(0, (mis.scanEndsAt - now_m) / 1000);
      mis.droneMarker.setTooltipContent(`Scanning ${remSec.toFixed(1)}s`);
      // Continuous detection — every tick (100ms real) the operator has a chance to spot each target.
      // Probability per tick is derived from FOV position + terrain cover; spotted units stay flagged ~3s game time.
      const cPos = [mis.dstLat, mis.dstLng];
      const spotDur = 3000; // real ms the spot persists after each successful detection
      allMarkers.forEach(e => {
        if (e._side === m._side) return;
        const p = mavicSpotProb(cPos, markerPos(e));
        if (p > 0 && Math.random() < p * 0.1) { // scale: p is per-second; tick is 0.1s
          const wasSpotted = (e._spottedUntil ?? 0) > now_m;
          e._spottedUntil = Math.max(e._spottedUntil ?? 0, now_m + spotDur);
          // Alert artillery on first detection of each unit (not re-detections)
          if (!wasSpotted && m._conds?.alertArt && m._side === userSide) {
            m._pendingArtAlert = markerPos(e);
          }
        }
      });
      checkPendingStrikeConfirms();
      if (now_m >= mis.scanEndsAt) {
        if (mis.scanCircle) { map.removeLayer(mis.scanCircle); mis.scanCircle = null; }
        // Patrol: advance to next waypoint if available
        if (mis.type === 'patrol') {
          mis.currentWP = (mis.currentWP ?? 1) + 1;
          if (mis.currentWP < mis.waypoints.length) {
            mis.phase = 'outbound';
            mis.dstLat = mis.waypoints[mis.currentWP][0];
            mis.dstLng = mis.waypoints[mis.currentWP][1];
            mis.hoverSec = mis.hoverPerWP;
            mis.droneMarker.setTooltipContent(`WP ${mis.currentWP}/${mis.waypoints.length-1}…`);
          } else {
            mis.phase = 'returning';
            mis.dstLat = mis.homeLat; mis.dstLng = mis.homeLng;
            mis.droneMarker.setTooltipContent('Returning…');
            if (mis.routeLine) { map.removeLayer(mis.routeLine); mis.routeLine = null; }
          }
        } else {
          // Single-scan: head home
          const spotsNow = allMarkers.filter(e => e._side !== m._side && (e._spottedUntil??0) > now_m).length;
          if (spotsNow) unitLog(m, `Scan complete — ${spotsNow} enemy unit${spotsNow!==1?'s':''} spotted`);
          else unitLog(m, 'Scan complete — no enemies detected');
          mis.phase = 'returning';
          mis.dstLat = mis.homeLat; mis.dstLng = mis.homeLng;
          mis.droneMarker.setTooltipContent('Returning…');
        }
      }
    }
  }

  const FPV_SPD = 55 * TIME_SCALE;
  for (let i = flyingFPVs.length - 1; i >= 0; i--) {
    const d = flyingFPVs[i];
    const step = FPV_SPD * 0.1;
    const dist = segMeters([d.lat, d.lng], [d.dstLat, d.dstLng]);

    // Infantry intercept check — once per second (every 10 ticks)
    d._ticks = (d._ticks || 0) + 1;
    if (d._ticks % 10 === 0) {
      const dronePos = [d.lat, d.lng];
      const interceptors = allMarkers.filter(m =>
        m._side === d.target._side &&
        m._role === 'infantry' &&
        segMeters(markerPos(m), dronePos) <= 100
      );
      if (interceptors.length > 0 && Math.random() < 0.25) {
        map.removeLayer(d.droneMarker);
        flyingFPVs.splice(i, 1);
        if (!d.remote) applyFPVImpact(d.pilot, d.target, true);
        else showToast('FPV drone shot down!', '#ffa726');
        continue;
      }
    }

    if (dist <= step) {
      map.removeLayer(d.droneMarker);
      flyingFPVs.splice(i, 1);
      if (d.remote) {
        showExplosion(L.latLng(d.dstLat, d.dstLng), 70);
        showCrater(L.latLng(d.dstLat, d.dstLng), 'fpv');
      } else {
        applyFPVImpact(d.pilot, d.target, false);
      }
    } else {
      const r = step / dist;
      d.lat += (d.dstLat - d.lat) * r;
      d.lng += (d.dstLng - d.lng) * r;
      const bearing = bearingDeg([d.lat, d.lng], [d.dstLat, d.dstLng]);
      d.droneMarker.setLatLng([d.lat, d.lng]);
      d.droneMarker.setIcon(fpvDroneIcon(bearing));
      // Update ETA label on drone marker tooltip
      const etaSec = Math.ceil(segMeters([d.lat, d.lng], [d.dstLat, d.dstLng]) / FPV_SPD);
      d.droneMarker.setTooltipContent(`ETA ${fmtETA(etaSec)}`);
    }
  }

  // ── Flying shells ──
  for (let i = flyingShells.length - 1; i >= 0; i--) {
    const s = flyingShells[i];
    const step = s.speed * 0.1;
    const dist = segMeters([s.lat, s.lng], [s.dstLat, s.dstLng]);
    if (dist <= step) {
      map.removeLayer(s.marker);
      flyingShells.splice(i, 1);
      const isMortar = s.unit._role === 'mortar';
      const impactLatlng = L.latLng(s.dstLat, s.dstLng);
      showExplosion(impactLatlng, isMortar ? 55 : 90);
      showCrater(impactLatlng, isMortar ? 'mortar' : 'shell');
    } else {
      const r = step / dist;
      s.lat += (s.dstLat - s.lat) * r;
      s.lng += (s.dstLng - s.lng) * r;
      s.marker.setLatLng([s.lat, s.lng]);
    }
  }

  // ── Bullet tracers ──
  const now_b = Date.now();
  for (let i = flyingBullets.length - 1; i >= 0; i--) {
    const b = flyingBullets[i];
    const age = now_b - b.born;
    if (age > 1500) { map.removeLayer(b.marker); flyingBullets.splice(i, 1); continue; }
    const progress = age / 1500;
    const lat = b.lat + (b.dstLat - b.lat) * progress;
    const lng = b.lng + (b.dstLng - b.lng) * progress;
    b.marker.setLatLng([lat, lng]);
  }
}, 100);

// ── vertex/split handles ──────────────────────────────────────
const VERTEX_ICON = L.divIcon({
  className: '',
  html: '<div style="width:11px;height:11px;background:#ffcc00;border:2px solid rgba(0,0,0,0.55);border-radius:50%;cursor:grab;box-shadow:0 1px 5px rgba(0,0,0,0.7)"></div>',
  iconSize: [11,11], iconAnchor: [5.5,5.5]
});
const SPLIT_ICON = L.divIcon({
  className: '',
  html: '<div style="width:8px;height:8px;background:rgba(255,200,0,0.35);border:1.5px solid rgba(255,200,0,0.65);border-radius:50%;cursor:pointer"></div>',
  iconSize: [8,8], iconAnchor: [4,4]
});

function rebuildLine(state) {
  const ll = state.marker.getLatLng();
  const pts = [[ll.lat, ll.lng], ...state.route.slice(state.seg + 1)];
  if (state.line) { state.line.setLatLngs(pts); }
  else {
    const _rlOp = (state.marker._side !== userSide && !_adminAuthed && !(state.marker._spottedUntil > Date.now())) ? 0 : 0.95;
    state.line = L.polyline(pts, { color: '#ff9500', weight: 3, dashArray: '10 6', opacity: _rlOp }).addTo(map);
  }
}

function rebuildSplits(state) {
  state.splits?.forEach(h => map.removeLayer(h)); state.splits = [];
  const base = state.seg + 1;
  const future = state.route.slice(base);
  for (let i = 0; i < future.length - 1; i++) {
    const a = future[i], b = future[i+1];
    const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    const insertAt = base + i + 1;
    const h = L.marker(mid, { icon: SPLIT_ICON, zIndexOffset: -600 }).addTo(map);
    h.on('mousedown', L.DomEvent.stopPropagation);
    h.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      state.route.splice(insertAt, 0, [...mid]);
      rebuildHandles(state); rebuildLine(state);
    });
    state.splits.push(h);
  }
}

function rebuildHandles(state) {
  state.vertices?.forEach(v => map.removeLayer(v));
  state.splits?.forEach(h => map.removeLayer(h));
  state.vertices = []; state.splits = [];
  const base = state.seg + 1;
  state.route.slice(base).forEach((pt, i) => {
    const routeIdx = base + i;
    const v = L.marker(pt, { icon: VERTEX_ICON, draggable: true, zIndexOffset: -500 }).addTo(map);
    state.vertices.push(v);
    v.on('drag', () => {
      const ll = v.getLatLng();
      state.route[routeIdx] = [ll.lat, ll.lng];
      rebuildLine(state); rebuildSplits(state);
      const etaEl = document.getElementById('panel-eta');
      if (etaEl) etaEl.textContent = formatETA(etaSeconds(state));
    });
  });
  rebuildSplits(state);
}

function clearRoute(marker) {
  if (!movingMarkers.has(marker)) return;
  const s = movingMarkers.get(marker);
  if (s.line) map.removeLayer(s.line);
  s.vertices?.forEach(v => map.removeLayer(v));
  s.splits?.forEach(h => map.removeLayer(h));
  movingMarkers.delete(marker);
  if (marker._side === userSide) marker.dragging.enable();
  if (activePanel === marker) closePanel();
  fbSyncUnit(marker); // broadcast final resting position
}

function assignRoute(marker, route) {
  // Leaving a fortified position — leave a persistent marker at the old location
  if ((marker._fortLevel ?? 0) > 0 || marker._fortifying) {
    if ((marker._fortLevel ?? 0) > 0) leaveFortPosition(marker);
    marker._fortLevel = 0; marker._fortifying = false; marker._fortStartAt = 0;
    updateFortBadge(marker);
    unitLog(marker, 'Left fortified position — marker left behind');
  }
  // Water crossing check (runs whenever map data is loaded)
  if (waterPolys.length > 0 || riverLines.length > 0) {
    const crossing = routeWaterCrossing(route, marker._role);
    if (crossing === 'water') {
      if (marker._role === 'infantry') {
        showToast('Route crosses water — infantry will move very slowly (12× slower)', '#ffa726');
      } else {
        showToast('Route blocked — non-infantry cannot cross water bodies!', '#ef5350');
        cancelDraw(); return;
      }
    } else if (crossing === 'river') {
      if (marker._role === 'artillery') {
        showToast('Route blocked — artillery cannot cross rivers!', '#ef5350');
        cancelDraw(); return;
      }
      showToast('Route crosses river — movement significantly slowed', '#ffa726');
    } else if (crossing === 'stream') {
      showToast('Route crosses stream — movement slowed', '#ffd54f');
    }
  }
  // Fortification obstacle crossing check
  { const _oc = routeObstacleCrossing(route, marker._role);
    if (_oc !== null) { const _om = obstacleSpeedMult(_oc, marker._role);
      if (_om === 0) { showToast(_fortBlockMsg(_oc, marker._role), '#ef5350'); cancelDraw(); return; }
      showToast(_fortWarnMsg(_oc, marker._role), '#ffa726'); } }
  const count = pendingSplitCount ?? marker._count;
  let movingMarker = marker;
  if (count < marker._count) {
    marker._count -= count;
    marker.setIcon(soldierIcon(marker._side, marker._count, marker._role));
    const pos = marker.getLatLng();
    movingMarker = createMarker([pos.lat, pos.lng], marker._side, count, marker._role);
    movingMarker._splitAt = Date.now(); // suppress auto-merge for 30s after split
    marker._splitAt = Date.now();
  }
  clearRoute(movingMarker);
  const line = L.polyline(route, { color: '#ff9500', weight: 3, dashArray: '10 6', opacity: 0.95 }).addTo(map);
  const state = { marker: movingMarker, route, seg: 0, t: 0, line, vertices: [], splits: [] };
  movingMarkers.set(movingMarker, state);
  const totalDist = route.reduce((s,p,i) => i ? s + segMeters(route[i-1], p) : 0, 0);
  unitLog(movingMarker, `Route assigned — ${fmtDist(totalDist)} · ${route.length-1} waypoint${route.length>2?'s':''}`);
  rebuildHandles(state);
  movingMarker.dragging.disable();
  fbSyncUnit(movingMarker);
}

function cancelDraw() {
  if (activeMarker) activeMarker.getElement()?.querySelector('.soldier-marker')?.classList.remove('selected');
  drawMode = false; activeMarker = null; drawPoints = [];
  clearTimeout(clickTimer); clickTimer = null;
  if (drawLine)    { map.removeLayer(drawLine);    drawLine    = null; }
  if (previewLine) { map.removeLayer(previewLine); previewLine = null; }
  map.getContainer().style.cursor = '';
  map.dragging.enable();
  setStatus('');
}

function selectForRoute(marker) {
  // Re-clicking the same unit while drawing → cancel draw but keep panel open
  if (activePanel === marker && drawMode) { cancelDraw(); renderPanel(); return; }
  cancelDraw(); exitCombatMode();
  activePanel = marker;
  activeMarker = marker; // track for map-click-to-draw
  pendingSplitCount = marker._count;
  showPanelRange(marker);
  renderPanel();
  if (movingMarkers.has(marker)) {
    setStatus('Click map to redraw route · or use Redraw button');
  } else {
    setStatus('Unit selected · click map to draw route · Esc to close');
  }
}

// Called when user clicks map while a unit is selected but drawMode not yet active
function beginDrawForSelected(firstLatlng) {
  if (!activeMarker || !activePanel) return false;
  if (!pointInBoundary(firstLatlng.lat, firstLatlng.lng)) {
    showToast('Outside game boundary', '#ef5350'); return false;
  }
  if (movingMarkers.has(activeMarker)) clearRoute(activeMarker);
  activePanel = activeMarker;
  drawMode = true;
  const ll = activeMarker.getLatLng();
  drawPoints = [[ll.lat, ll.lng], [firstLatlng.lat, firstLatlng.lng]];
  activeMarker.getElement()?.querySelector('.soldier-marker')?.classList.add('selected');
  drawLine = L.polyline(drawPoints, { color: '#ff9500', weight: 2.5, dashArray: '10 6', opacity: 0.9 }).addTo(map);
  map.getContainer().style.cursor = 'crosshair';
  map.dragging.disable();
  document.getElementById('unit-panel').style.display = 'none';
  setStatus('Click waypoints · dblclick or Enter to confirm · Esc to cancel');
  return true;
}

map.on('click', (e) => {
  if (_adminPlacing)  { _adminPlaceUnit(e.latlng); return; }
  if (rulerMode)      { rulerClick(e.latlng); return; }
  if (searchAreaMode) { searchAreaClick(e.latlng); return; }
  if (annotateMode)   { annotateClick(e.latlng); return; }
  if (patrolMode)     { patrolClick(e.latlng); return; }
  if (_placingDeployPoint) {
    if (!pointInBoundary(e.latlng.lat, e.latlng.lng)) {
      showToast('Outside game boundary — cannot place here', '#ef5350'); return;
    }
    createDeploymentPoint(e.latlng, userSide, _pendingDeployRole);
    _placingDeployPoint = false;
    document.getElementById('dep-btn').classList.remove('ruler-on');
    setStatus('');
    saveState();
    return;
  }
  if (_drawingDeployRoute) {
    const { dp, points, previewLine } = _drawingDeployRoute;
    points.push([e.latlng.lat, e.latlng.lng]);
    const pos = dp.marker.getLatLng();
    previewLine.setLatLngs([[pos.lat, pos.lng], ...points]);
    return;
  }
  if (_settingFallback) {
    const unit = _settingFallback; _settingFallback = null;
    if (!unit._conds) unit._conds = {};
    unit._conds.fallbackPos = [e.latlng.lat, e.latlng.lng];
    // Show a small marker for the fallback point
    if (unit._fallbackMarker) map.removeLayer(unit._fallbackMarker);
    unit._fallbackMarker = L.marker([e.latlng.lat, e.latlng.lng], {
      icon: L.divIcon({ className:'', html:`<div style="width:10px;height:10px;background:#ef5350;border:2px solid #fff;border-radius:50%;opacity:0.85"></div>`, iconSize:[10,10], iconAnchor:[5,5] }),
      interactive: false, zIndexOffset: -200
    }).addTo(map).bindTooltip('Fallback point', { direction:'top', className:'fpv-eta-tip' });
    unitLog(unit, 'Fallback point set');
    showToast('Fallback point set!', '#66bb6a');
    activePanel = unit; renderPanel();
    setStatus('');
    return;
  }
  if (combatMode === 'artillery') {
    const isMortar = combatActor._role === 'mortar';
    const maxRangeKm = isMortar ? 3 : 25;
    const distKm = segMeters(markerPos(combatActor), [e.latlng.lat, e.latlng.lng]) / 1000;
    if (distKm > maxRangeKm) {
      showToast(`Out of range! Max ${maxRangeKm} km (target is ${distKm.toFixed(2)} km)`, '#ef5350');
      return;
    }
    startArtilleryPrep(combatActor, e.latlng); exitCombatMode(); return;
  }
  if (combatMode === 'mavic-scan')    { launchMavicScan(combatActor, e.latlng);    exitCombatMode(); return; }
  if (combatMode === 'grenade')       { executeGrenade(combatActor, e.latlng);      exitCombatMode(); return; }
  if (combatMode === 'area-suppress') { executeAreaSuppress(combatActor, e.latlng); return; }
  if (!drawMode) {
    // Guard: if click originated from a marker (within last 200ms), don't steal focus
    if (Date.now() - _markerClickAt < 200) return;
    // If a unit is selected and user clicks the map, start drawing its route
    if (activeMarker && activePanel) { beginDrawForSelected(e.latlng); return; }
    closePanel(); return;
  }
  if (!pointInBoundary(e.latlng.lat, e.latlng.lng)) {
    showToast('Outside game boundary', '#ef5350'); return;
  }
  drawPoints.push([e.latlng.lat, e.latlng.lng]);
  if (drawLine) { drawLine.setLatLngs(drawPoints); }
  else { drawLine = L.polyline(drawPoints, { color: '#ff9500', weight: 2.5, dashArray: '10 6', opacity: 0.9 }).addTo(map); }
});

map.on('dblclick', (e) => {
  if (rulerMode) { clearRuler(); return; }
  if (searchAreaMode) { L.DomEvent.stop(e); finishSearchArea(); return; }
  if (annotateMode) { finishAnnotateLine(); return; }
  if (_drawingDeployRoute) { L.DomEvent.stop(e); finishDeployRoute(); return; }
  if (patrolMode) { L.DomEvent.stop(e); confirmPatrol(); return; }
  if (!drawMode) return;
  if (drawPoints.length > 1) drawPoints.pop();
  if (drawPoints.length >= 2) assignRoute(activeMarker, [...drawPoints]);
  cancelDraw();
  closePanel();
});

map.on('mousemove', (e) => {
  // Freehand annotation — add points continuously on drag
  if (annotateMode && annotateSubMode === 'free' && e.originalEvent.buttons === 1) {
    annotatePoints.push([e.latlng.lat, e.latlng.lng]);
    if (annotateCurLine) annotateCurLine.setLatLngs(annotatePoints);
    else annotateCurLine = L.polyline(annotatePoints, { color: annotateColor(), weight: annWeight(), opacity: 0.85 }).addTo(map);
    return;
  }
  if (!drawMode || !drawPoints.length) return;
  const pts = [drawPoints[drawPoints.length-1], [e.latlng.lat, e.latlng.lng]];
  if (previewLine) { previewLine.setLatLngs(pts); }
  else { previewLine = L.polyline(pts, { color: '#ff9500', weight: 1.5, dashArray: '4 4', opacity: 0.55 }).addTo(map); }
});

document.getElementById('ruler-btn').addEventListener('click', toggleRuler);
document.getElementById('annotate-btn').addEventListener('click', toggleAnnotate);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    clearTimeout(clickTimer); clickTimer = null;
    if (patrolMode) { cancelPatrol(); return; }
    if (_placingDeployPoint) { _placingDeployPoint = false; document.getElementById('dep-btn').classList.remove('ruler-on'); setStatus(''); return; }
    if (_drawingDeployRoute) { const {previewLine} = _drawingDeployRoute; map.removeLayer(previewLine); _drawingDeployRoute = null; setStatus(''); return; }
    if (_settingFallback) { _settingFallback = null; setStatus(''); return; }
    if (boundingState) { cancelBoundingOverwatch(); return; }
    if (rulerMode) { clearRuler(); return; }
    if (searchAreaMode) {
      if (searchAreaPreview) { map.removeLayer(searchAreaPreview); searchAreaPreview = null; }
      searchAreaMode = false; searchAreaPoints = [];
      const m = searchAreaActor; searchAreaActor = null;
      setStatus(''); if (m) { activePanel = m; renderPanel(); }
      return;
    }
    if (annotateMode) { toggleAnnotate(); return; }
    if (combatMode) { exitCombatMode(); return; }
    if (drawMode) { cancelDraw(); return; }
    // ESC clears the selected unit's route if it has one
    if (activePanel && movingMarkers.has(activePanel)) { clearRoute(activePanel); return; }
    closePanel();
  }
  if (e.key === 'Enter') {
    if (patrolMode && patrolPoints.length >= 2) { confirmPatrol(); return; }
    if (_drawingDeployRoute && _drawingDeployRoute.points.length >= 1) { finishDeployRoute(); return; }
    if (searchAreaMode && searchAreaPoints.length >= 3) { finishSearchArea(); return; }
    if (drawMode && drawPoints.length >= 2) {
      clearTimeout(clickTimer); clickTimer = null;
      assignRoute(activeMarker, [...drawPoints]);
      cancelDraw(); closePanel();
    }
  }
});

setInterval(() => {
  // ── fort position fog-of-war visibility ──
  updateFortPositionVisibility();

  // ── pending strike confirmations ──
  checkPendingStrikeConfirms();

  // ── conditional orders ──
  processConditions();

  // ── unit movement ──
  for (const [marker, state] of movingMarkers) {
    const { route } = state;
    const prevSeg = state.seg;
    const suppressed = marker._suppressedUntil > Date.now();
    // holdPos condition blocks movement
    if (marker._conds?.holdPos) { clearRoute(marker); continue; }
    // Water speed: sample current position for water terrain
    const curPt = state.seg < route.length-1
      ? [route[state.seg][0]+(route[state.seg+1][0]-route[state.seg][0])*state.t,
         route[state.seg][1]+(route[state.seg+1][1]-route[state.seg][1])*state.t]
      : route[state.seg];
    const wt = waterAt(curPt);
    const wMult = waterSpeedMult(wt, marker._role);
    if (wMult === 0) { clearRoute(marker); showToast('Unit blocked — impassable water obstacle!', '#ef5350'); continue; }
    const _ot = _curSegObstacle(route, state.seg); const oMult = obstacleSpeedMult(_ot, marker._role);
    if (oMult === 0) { clearRoute(marker); showToast(_fortBlockMsg(_ot, marker._role), '#ef5350'); continue; }
    let budget = (suppressed ? WALK_MS * 0.4 : WALK_MS) * wMult * oMult;
    while (budget > 0 && state.seg < route.length - 1) {
      const d = segMeters(route[state.seg], route[state.seg+1]);
      const left = d * (1 - state.t);
      if (budget >= left) { budget -= left; state.seg++; state.t = 0; }
      else                { state.t += budget / d; budget = 0; }
    }
    if (state.seg >= route.length - 1) {
      marker.setLatLng(route[route.length-1]);
      unitLog(marker, 'Arrived at destination');
      clearRoute(marker);
      checkOccupyFortPosition(marker);
    } else {
      const a = route[state.seg], b = route[state.seg+1];
      marker.setLatLng([a[0]+(b[0]-a[0])*state.t, a[1]+(b[1]-a[1])*state.t]);
      rebuildLine(state);
      if (state.seg !== prevSeg) rebuildHandles(state);
    }
  }
  // keep range circle centred on selected unit as it moves
  updatePanelRange();

  // ── TDP auto-spawn ──
  const now = Date.now();
  for (const dp of deploymentPoints) {
    if (!dp._nextSpawnAt || dp._nextSpawnAt > now) continue;
    tdpSpawn(dp, now);
    dp._nextSpawnAt = now + dp._spawnIntervalMs;
    saveState();
  }

  // ── per-marker timers + fog of war ──
  for (const m of [...allMarkers]) {
    // FPV prep
    if (m._fpvReadyAt > 0 && now >= m._fpvReadyAt) {
      m._fpvReadyAt = 0;
      if (m._drones > 0) enterFPVTargetMode(m);
    }
    // Artillery/mortar shell launch + impact
    if (m._artPending) {
      const inFlight = now >= m._artPending.prepEndsAt;
      if (inFlight && !m._artPending._wasInFlight) {
        m._artPending._wasInFlight = true;
        launchShell(m, m._artPending);
      }
      if (now >= m._artPending.fireAt) {
        const pending = m._artPending;
        map.removeLayer(pending.aimCircle);
        m._artPending = null;
        applyArtilleryImpact(m, pending);
      }
    }
    // Area suppression zones — apply to any unit moving into them
    for (const zone of suppressedZones) {
      if (zone.expiresAt > now && segMeters(markerPos(m), [zone.circle.getLatLng().lat, zone.circle.getLatLng().lng]) <= zone.circle.getRadius()) {
        if (m._suppressedUntil < now + 2000 / TIME_SCALE) {
          m._suppressedUntil = now + 2000 / TIME_SCALE;
          showSuppressedRing(m);
        }
      }
    }
    // Suppression expiry — remove ring when timer runs out
    if (m._suppressedUntil > 0 && now >= m._suppressedUntil) {
      m._suppressedUntil = 0;
      removeSuppressedRing(m);
      if (activePanel === m) renderPanel();
    }
    // Supply convoy movement + arrival
    if (m._supply) {
      const s = m._supply;
      if (now >= s.arrivesAt) {
        applySupply(m);
      } else if (s.convoyMarker) {
        const totalMs = segMeters([s.fromLat, s.fromLng], [s.toLat, s.toLng]) / 1000 * SUPPLY_MS_PER_KM;
        const elapsed = totalMs - (s.arrivesAt - now);
        const t = Math.min(1, elapsed / totalMs);
        const lat = s.fromLat + (s.toLat - s.fromLat) * t;
        const lng = s.fromLng + (s.toLng - s.fromLng) * t;
        s.convoyMarker.setLatLng([lat, lng]);
      }
    }
    // Mavic battery recharge (slow, ~1%/6s when idle)
    if (m._role === 'mavic' && !m._mavicMission && m._mavicBattery < 100) {
      m._mavicBattery = Math.min(100, Math.round((m._mavicBattery + (TIME_SCALE/6)) * 10) / 10);
    }
    // Continuous mavic recon
    if (m._role === 'mavic' && m._side === userSide && m._continuousRecon && !m._mavicMission && m._nextReconAt > 0 && now >= m._nextReconAt && m._mavicBattery >= 5 && m._mavicCooldownUntil <= now) {
      m._nextReconAt = 0;
      doReconScan(m);
    }
    // ── Fog of war: enemy visibility ──
    if (m._side === userSide) {
      // Friendly infantry spots nearby enemies; range and chance reduced by weather
      if (m._role === 'infantry') {
        const visRange = 300 * groundVisibilityFactor; // fog shrinks visual range
        for (const e of allMarkers) {
          if (e._side === userSide) continue;
          const dist = segMeters(markerPos(m), markerPos(e));
          if (dist > visRange) continue;
          const alreadySpotted = (e._spottedUntil ?? 0) > now;
          const factor = (dist <= 50 ? 1.0 : terrainVisualFactor(markerPos(e))) * groundVisibilityFactor;
          if (alreadySpotted || Math.random() < factor) {
            e._spottedUntil = now + 3000;
          }
        }
      }
      continue; // own units always visible, skip display logic
    }
    // Enemy unit visibility — admin sees all (body.admin-mode CSS handles display)
    if (_adminAuthed) { removeGhost(m); continue; }
    const spotted = m._spottedUntil > now;
    const wasSpotted = m._wasSpotted || false;
    m._wasSpotted = spotted;
    const el = m.getElement();
    if (el) el.style.display = spotted ? '' : 'none';
    // Also hide/show route line so enemy movement intent stays hidden
    const _mvSt = movingMarkers.get(m);

      showGhost(m); // just became unspotted — freeze ghost at last known pos

  // ── auto-save ──
  saveState();

  // ── panel live updates ──
  if (activePanel) {
    const pa = activePanel;
    // ETA for moving markers
    if (movingMarkers.has(pa)) {
      const el = document.getElementById('panel-eta');
      if (el) el.textContent = formatETA(etaSeconds(movingMarkers.get(pa)));
    }
    // FPV prep countdown

    if (fpvEl && pa._fpvReadyAt > 0) fpvEl.textContent = Math.ceil((pa._fpvReadyAt - now) / 1000) + 's';
    // FPV cooldown countdown

    if (cdEl && pa._fpvCooldownUntil > now) cdEl.textContent = Math.ceil((pa._fpvCooldownUntil - now) / 1000) + 's';
    // Artillery/mortar countdown — re-render panel on phase transition
    if (pa._artPending) {

      if (inFlight !== pa._artPending._panelWasInFlight) {
        pa._artPending._panelWasInFlight = inFlight;

      } else {
        const artEl = document.getElementById('art-timer');

        if (artEl) artEl.textContent = Math.ceil((ref - now) / 1000) + 's';

    if (pa._supply) {
      const supplyEl = document.getElementById('supply-eta');
      if (supplyEl) {
        const remSec = Math.ceil(Math.max(0, pa._supply.arrivesAt - now) / 1000);
        supplyEl.textContent = remSec >= 60 ? `${Math.floor(remSec/60)}m ${remSec%60}s` : `${remSec}s`;
      }
    }
    // ── live battery display ──
    if (pa._role === 'mavic') {
    const bp = Math.round(pa._mavicBattery);
    const col = bp>50?'#66bb6a':bp>20?'#ffa726':'#ef5350';

    }
  }
  // ── fortification progress ──
  processFortifications(now);
  // ── drone cam auto-close when mission ends ──
}, 1000);

// ── fortification system ────────────────────────────────────
const FORT_LABELS = ['', 'Scraped', 'Position', 'Trench', 'Reinforced', 'Bunker', 'Hardened'];
// Per-threat protection fractions [lvl 0 … 6]
// smallArms: levels 1-2 give big firefight protection; higher levels plateau
// artillery/fpv: levels 1-2 provide very little; levels 3-6 scale up significantly
const FORT_COVER = {
  smallArms: [0, 0.55, 0.72, 0.80, 0.84, 0.88, 0.92],
  artillery:  [0, 0.00, 0.04, 0.22, 0.45, 0.65, 0.82],
  fpv:        [0, 0.00, 0.04, 0.18, 0.32, 0.50, 0.68],
  detection:  [0, 0.05, 0.12, 0.22, 0.38, 0.55, 0.72],
};
// Thresholds in game-seconds for each level (real ms = game_s * 1000 / TIME_SCALE)
const FORT_GAME_S = [0, 30, 180, 600, 1800, 5400, 14400];
const FORT_MAX = FORT_LABELS.length - 1;

function processFortifications(now) {
  for (const m of allMarkers) {
    if (!m._fortifying || m._role !== 'infantry') continue;
    if (m._fortLevel >= FORT_MAX) { m._fortifying = false; continue; }
    const workerFrac = m._fortWorkerFrac ?? 1.0;
    const gameElapsed = (now - m._fortStartAt) * TIME_SCALE / 1000 * workerFrac; // scaled by worker count
    const next = FORT_LABELS.findIndex((_, i) => i > m._fortLevel && gameElapsed >= FORT_GAME_S[i]);
    if (next > m._fortLevel) {
      m._fortLevel = next;
      unitLog(m, `Fortification upgraded to ${FORT_LABELS[m._fortLevel]}`);
      showToast(`Unit fortified: ${FORT_LABELS[m._fortLevel]}`, '#ffd54f');
      updateFortBadge(m);
      if (m._fortLevel >= FORT_MAX) { m._fortifying = false; showToast('Max fortification reached!', '#66bb6a'); }
      if (activePanel === m) renderPanel();
    }
  }
}
function updateFortBadge(m) {
  const el = m.getElement(); if (!el) return;
  let badge = el.querySelector('.fort-badge');
  if (m._fortLevel === 0) { badge?.remove(); return; }
  if (!badge) { badge = document.createElement('div'); badge.className = 'fort-badge'; el.style.position = 'relative'; el.appendChild(badge); }
  badge.textContent = FORT_LABELS[m._fortLevel];
}
// Apply structural damage to a fortified position from a nearby explosion.
// distM = distance from shell center to unit position; blastR = blast radius; shellType = 'arty'|'mortar'|'fpv'
function damageFortification(m, distM, blastR, shellType) {
  if (!m._fortLevel) return; // nothing to damage at level 0
  // Base damage: 100 at center, falls to ~5 at blast radius edge
  const proximity = Math.max(0, 1 - distM / blastR);
  const baseDmg = { arty: 80, mortar: 55, fpv: 40 }[shellType] ?? 60;
  const rawDmg = baseDmg * (0.1 + 0.9 * proximity * proximity);
  // Hardened positions are more resistant (each level reduces structural damage)
  const resistance = 0.85 ** m._fortLevel; // 0 → 1.0, 6 → 0.38
  const dmg = Math.round(rawDmg * resistance);
  m._fortDamage = (m._fortDamage ?? 0) + dmg;
  if (m._fortDamage >= 100) {
    m._fortDamage = 0;
    m._fortLevel = Math.max(0, m._fortLevel - 1);
    m._fortifying = false;
    updateFortBadge(m);
    const newName = m._fortLevel > 0 ? FORT_LABELS[m._fortLevel] : 'destroyed';
    unitLog(m, `⚠ Position degraded → ${newName} (structural damage from ${shellType})`);
    showToast(`Position degraded! Now: ${newName}`, '#ef5350');
    if (activePanel === m) renderPanel();
  }
}

function startFortify(m, workerIds) {
  if (m._fortLevel >= FORT_MAX) { showToast('Already at max fortification.', '#ffd54f'); return; }
  const total = aliveSoldiers(m).length || 1;
  const workers = workerIds ? workerIds.size : total;
  m._fortWorkerFrac = Math.max(0.05, workers / total);
  m._fortifying = true; m._fortStartAt = Date.now() - (m._fortLevel > 0 ? FORT_GAME_S[m._fortLevel] * 1000 / TIME_SCALE : 0);
  const etaSec = Math.round(FORT_GAME_S[m._fortLevel+1] / m._fortWorkerFrac);
  const workerNote = workerIds ? ` (${workers}/${total} soldiers)` : '';
  showToast(`Digging in${workerNote} — ${FORT_LABELS[m._fortLevel+1]} in ~${etaSec}s game time`, '#ffd54f');
  unitLog(m, `Started digging in${workerNote}`);
  renderPanel();
}
function stopFortify(m) {
  m._fortifying = false;
  showToast('Stopped digging.', '#ffd54f');
  renderPanel();
}

// ── artillery elevation ───────────────────────────────────────
const elevCache = new Map(); // 'lat,lng' → elevation_m

async function fetchElevation(lat, lng) {
  const key = lat.toFixed(4) + ',' + lng.toFixed(4);
  if (elevCache.has(key)) return elevCache.get(key);
  try {
    const r = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lng}`);
    const d = await r.json();
    const elev = d.results?.[0]?.elevation ?? 0;
    elevCache.set(key, elev);
    return elev;
  } catch { elevCache.set(key, 0); return 0; }
}

// Call this before firing artillery to get range modifier
async function getElevationModifier(atkPos, tgtPos) {
  const [atkElev, tgtElev] = await Promise.all([
    fetchElevation(atkPos[0], atkPos[1]),
    fetchElevation(tgtPos[0], tgtPos[1])
  ]);
  // +1% per 10m elevation drop, -1% per 10m elevation gain, capped ±20%
  const delta = atkElev - tgtElev; // positive = shooting downhill (extended range)
  return Math.max(0.80, Math.min(1.20, 1 + delta / 1000));
}

  if (role === 'infantry') {
    m._soldiers = randomComposition(count);

  }
  else if (role === 'mortar')    { m._maxAmmo = 8; m._ammo = 5 + Math.floor(Math.random() * 4); }
  else if (role === 'fpv')       { m._drones = 3 + Math.floor(Math.random() * 3); m._maxDrones = FPV_MAX_DRONES; }

  }
  if (side === userSide) {
    m.dragging.enable();
    m.on('dragend', () => { saveState(); fbSyncUnit(m); });
    m.on('click', (e) => { e.originalEvent?.stopPropagation(); _markerClickAt = Date.now(); selectForRoute(m); });
  }
  return m;
}

var _fbPushTimer = null;
function fbPushMySide() {
  if (!_fbDb || !userSide) return;
  clearTimeout(_fbPushTimer);
  _fbPushTimer = setTimeout(function() {
    if (!_fbDb) return;
    var updates = {};
    for (var m of allMarkers) {
      if (m._side !== userSide || !m._uid) continue;
      var pos = m.getLatLng();
      var state = movingMarkers.get(m);
      var route = state ? [[pos.lat, pos.lng]].concat(state.route.slice(state.seg + 1)) : null;
      updates[m._uid] = {
        uid: m._uid, lat: pos.lat, lng: pos.lng,
        side: m._side, role: m._role, count: m._count,
        route: route, updatedAt: Date.now(),
        clientId: _fbClientId,
        fortLevel: m._fortLevel != null ? m._fortLevel : 0,
        ammo: m._ammo != null ? m._ammo : null,
        hp: m._hp != null ? m._hp : null,
      };
    }
    var n = Object.keys(updates).length;
    _fbDb.ref('units_' + userSide).set(updates).then(function() {
      _syncLog('pushed ' + userSide + ': ' + n + ' units');
    }).catch(function(e) {
      _syncLog('push ERR: ' + e.message);
      console.warn('FB push error:', e);
    });
  }, 80);
}

function fbSyncUnit(m) {

// Push any unit (including enemy side) to Firebase immediately after damage.

function fbSyncAnyUnit(m) {
  if (!_fbDb || !m._uid) return;

    fortLevel: m._fortLevel != null ? m._fortLevel : 0,
    ammo: m._ammo != null ? m._ammo : null,
    hp: m._hp != null ? m._hp : null,
  }).catch(function() {});
}

function fbRemoveUnit(m) {

function fbApplySideSnapshot(side, all) {
  if (!userSide && !_adminAuthed) return;
  for (var uid in all) {
    var d = all[uid];
    if (!d || !d.uid) continue;
    if (!_adminAuthed && d.clientId === _fbClientId) continue;
    if (d.updatedAt && d.updatedAt < GLOBAL_RESET_TS) continue;
    fbApplyUnit(d);

function fbApplyUnit(d) {
  var existing = allMarkers.find(function(m) { return m._uid === d.uid; });
  if (existing) {
    if (d.route && d.route.length >= 2) {
      if (movingMarkers.has(existing)) {
        var old = movingMarkers.get(existing);
        if (old.line) map.removeLayer(old.line);
        (old.vertices || []).forEach(function(v) { map.removeLayer(v); });
        (old.splits || []).forEach(function(s) { map.removeLayer(s); });
        movingMarkers.delete(existing);
      }
      existing.setLatLng(d.route[0]);
      var _rLineOp = (existing._side !== userSide && !_adminAuthed && !(existing._spottedUntil > Date.now())) ? 0 : 0.95;
      var rLine = L.polyline(d.route, {color:'#ff9500',weight:3,dashArray:'10 6',opacity:_rLineOp}).addTo(map);
      movingMarkers.set(existing, {marker:existing, route:d.route, seg:0, t:0, line:rLine, vertices:[], splits:[]});
      existing.dragging.disable();
    } else {
      if (movingMarkers.has(existing)) {
        var old2 = movingMarkers.get(existing);
        if (old2.line) map.removeLayer(old2.line);
        (old2.vertices || []).forEach(function(v) { map.removeLayer(v); });
        movingMarkers.delete(existing);
        try { existing.dragging.enable(); } catch(e2) {}
      }
      existing.setLatLng([d.lat, d.lng]);
    }
    if (d.count != null && d.count !== existing._count) {
      existing._count = d.count;
      if (d.count === 0) { removeUnit(existing); return; }  // unit destroyed on other client
      existing.setIcon(soldierIcon(existing._side, d.count, existing._role));
    }
    if (d.fortLevel != null) { existing._fortLevel = d.fortLevel; updateFortBadge(existing); }
    if (d.ammo != null) existing._ammo = (existing._maxAmmo != null) ? Math.min(d.ammo, existing._maxAmmo) : d.ammo;
    if (d.hp != null) existing._hp = d.hp;
  } else if (d.uid && d.side && d.role && d.lat != null && d.lng != null) {
    var m2 = createMarker([d.lat, d.lng], d.side, d.count || 1, d.role);
    m2._uid = d.uid;
    m2._clientId = d.clientId;
    if (d.fortLevel) { m2._fortLevel = d.fortLevel; setTimeout(function() { updateFortBadge(m2); }, 50); }
    if (d.ammo != null) m2._ammo = d.ammo;
    if (d.hp != null) m2._hp = d.hp;
    if (d.route && d.route.length >= 2) {
      var _rLine2Op = (m2._side !== userSide && !_adminAuthed && !(m2._spottedUntil > Date.now())) ? 0 : 0.95;
      var rLine2 = L.polyline(d.route, {color:'#ff9500',weight:3,dashArray:'10 6',opacity:_rLine2Op}).addTo(map);
      movingMarkers.set(m2, {marker:m2, route:d.route, seg:0, t:0, line:rLine2, vertices:[], splits:[]});
      m2.dragging.disable();
    }
  }
}

// Update TIME_SCALE and restart all active fight intervals immediately
function setGameSpeed(x) {
  TIME_SCALE = Math.max(1, Math.min(100, x));
  // Restart fight intervals so they respect the new speed
  for (const [attacker, fight] of activeFights) {
    clearInterval(fight.intervalId);
    fight.intervalId = setInterval(() => fightTick(attacker, fight.defender), 8000 / TIME_SCALE);
  }
  const lbl = document.getElementById('adm-speed-lbl');
  if (lbl) lbl.textContent = TIME_SCALE + 'x';
}

function adminRemoveUnit(uid) {
  const m = allMarkers.find(x => x._uid === uid);
  if (!m) return;
  clearRoute(m);
  if (_fbDb) _fbDb.ref(`units_${m._side}/${uid}`).remove();
  map.removeLayer(m);
  allMarkers.splice(allMarkers.indexOf(m), 1);
  movingMarkers.delete(m);
  saveState();
  _renderAdminUnitList();
}

function _adminPlaceUnit(latlng) {
  if (!pointInBoundary(latlng.lat, latlng.lng)) { showToast('Outside game boundary', '#ef5350'); return; }
  const side  = document.getElementById('adm-side')?.value  || 'blue';
  const role  = document.getElementById('adm-role')?.value  || 'infantry';
  const count = Math.max(1, Math.min(9, parseInt(document.getElementById('adm-count')?.value || '3')));
  const m = createMarker([latlng.lat, latlng.lng], side, count, role);
  // Push to Firebase regardless of which side — admin bypasses the userSide guard
  if (_fbDb) {
    const pos = m.getLatLng();
    _fbDb.ref(`units_${side}/${m._uid}`).set({
      uid: m._uid, lat: pos.lat, lng: pos.lng,
      side, role, count, remainingRoute: null,
      updatedAt: Date.now(), clientId: _fbClientId,
    }).catch(() => {});
  }
  saveState();
  _renderAdminUnitList();
}

function getGHConfig() {

async function loadFromGitHub() {
  const { repo } = getGHConfig();
  if (!repo) return null;
  try {
    const url = `https://raw.githubusercontent.com/${repo}/${GH_BRANCH}/${GH_FILE}?t=${Date.now()}`;
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) return null;
    return r.json();
  } catch { return null; }
}

let _ghSaveSha = null;   // cached SHA so we can update without a prefetch every time
let _ghSavePending = false;

async function saveToGitHub(payload) {
  const { repo, pat } = getGHConfig();
  if (!repo || !pat) return;
  if (_ghSavePending) return; // rate-limit: one in-flight write at a time
  _ghSavePending = true;
  try {
    const base   = `https://api.github.com/repos/${repo}/contents/${GH_FILE}`;
    const headers = { Authorization: `Bearer ${pat}`, 'Content-Type': 'application/json' };
    // Fetch current SHA if we don't have it
    if (!_ghSaveSha) {
      const meta = await fetch(base, { headers }).then(r => r.ok ? r.json() : null);
      _ghSaveSha = meta?.sha ?? null;
    }
    const body = { message: `Game tick ${new Date().toISOString()}`, content: btoa(unescape(encodeURIComponent(JSON.stringify(payload)))), branch: GH_BRANCH };
    if (_ghSaveSha) body.sha = _ghSaveSha;
    const resp = await fetch(base, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (resp.ok) {
      const data = await resp.json();
      _ghSaveSha = data?.content?.sha ?? null;
    } else if (resp.status === 409) {
      // SHA conflict — clear cache, will refetch next save
      _ghSaveSha = null;
    }
  } catch {}
  _ghSavePending = false;
}

function tdpSpawn(dp, now) {
  const dpPos = [dp.marker.getLatLng().lat, dp.marker.getLatLng().lng];
  // Don't spawn outside the game boundary
  if (!pointInBoundary(dpPos[0], dpPos[1])) return;
  const spawnCount = TDP_SPAWN_COUNT[dp.role] ?? 1;

  // Look for an idle unit of same side+role sitting at the TDP (within 80m, not yet moving on a route)
  const atTDP = allMarkers.find(m =>
    m._side === dp.side && m._role === dp.role &&
    !movingMarkers.has(m) &&
    segMeters(markerPos(m), dpPos) <= 80
  );

  if (atTDP) {
    // Merge new spawn into existing unit
    atTDP._count += spawnCount;
    if (atTDP._soldiers) {
      const newSols = randomComposition(spawnCount);
      atTDP._soldiers.push(...newSols);
      atTDP._soldiers = atTDP._soldiers.map((s, i) => ({ ...s, id: i })); // keep IDs unique
      atTDP._maxAmmo += newSols.reduce((s, sol) => s + SOLDIER_ROLES[sol.role].ammo, 0);
      atTDP._ammo    = Math.min(atTDP._ammo + newSols.reduce((s, sol) => s + sol.ammo, 0), atTDP._maxAmmo);
    } else {
      atTDP._ammo    = Math.min((atTDP._ammo ?? 0) + spawnCount * 8, atTDP._maxAmmo ?? 999);
    }
    atTDP.setIcon(soldierIcon(atTDP._side, atTDP._count, atTDP._role));
    // If route set and unit hasn't left yet, assign route
    if (dp.moveRoute?.length >= 2) assignRoute(atTDP, dp.moveRoute);
    unitLog(atTDP, `+${spawnCount} reinforcement${spawnCount > 1 ? 's' : ''} from TDP`);
    showToast(`TDP: +${spawnCount} ${dp.role} joined (now ${atTDP._count})`, '#66bb6a');
  } else {
    // Spawn a fresh unit at TDP position
    const m = createMarker(dpPos, dp.side, spawnCount, dp.role);
    if (dp.moveRoute?.length >= 2) {
      assignRoute(m, dp.moveRoute);
    }
    showToast(`TDP: new ${dp.role} unit spawned (${spawnCount})`, '#66bb6a');
  }
}

function mergeUnits(a, b) {
  if (['artillery','mavic','fpv'].includes(a._role)) {
    showToast(`${ROLES[a._role]?.label ?? a._role} crews cannot merge — specialised units`, '#ef5350'); return;
  }
  const newCount = a._count + b._count;
  const keepPos  = markerPos(a);
  // Remove both, create merged unit
  clearRoute(a); clearRoute(b);
  if (activePanel === a || activePanel === b) closePanel();
  map.removeLayer(a); allMarkers.splice(allMarkers.indexOf(a), 1);
  map.removeLayer(b); allMarkers.splice(allMarkers.indexOf(b), 1);
  fbRemoveUnit(a); fbRemoveUnit(b);
  const merged = createMarker(keepPos, a._side, newCount, a._role);
  // Combine ammo
  merged._maxAmmo = (a._maxAmmo ?? 0) + (b._maxAmmo ?? 0);
  merged._ammo    = Math.min((a._ammo ?? 0) + (b._ammo ?? 0), merged._maxAmmo || 999);
  if (a._soldiers && b._soldiers) {
    merged._soldiers = [...a._soldiers, ...b._soldiers].map((s, i) => ({ ...s, id: i }));
  }
  selectForRoute(merged);
  fbSyncUnit(merged);
  saveState();
  showToast(`Merged into ${newCount} ${a._role}`, '#66bb6a');
}

function resetMap() {
  if (!confirm('Reset map? All units, routes, TDPs and drawings will be wiped for both sides.')) return;

  // 1. Remove all units from map
  for (const m of [...allMarkers]) { clearRoute(m); map.removeLayer(m); }
  allMarkers.length = 0;
  movingMarkers.clear();

  // 2. Remove all deployment points
  for (const dp of [...deploymentPoints]) {
    if (dp.routeLine) map.removeLayer(dp.routeLine);
    map.removeLayer(dp.marker);
  }
  deploymentPoints.length = 0;

  // 3. Clear annotations
  for (const a of annotationLayers) { map.removeLayer(a.layer); if (a.head) map.removeLayer(a.head); }
  annotationLayers.length = 0;

  // 4. Clear localStorage
  localStorage.removeItem(SAVE_KEY);
  localStorage.removeItem('annotations_blue');
  localStorage.removeItem('annotations_red');

  // 5. Clear Service Worker state
  if (navigator.serviceWorker?.controller)
    navigator.serviceWorker.controller.postMessage({ type: 'SAVE_STATE', state: { units: [], depPoints: [], savedAt: 0, _pendingEvents: [] } });

  // 6. Clear Firebase + GitHub, then reload
  const empty = { units: [], depPoints: [], savedAt: 0, _pendingEvents: [] };
  // RESET_KEY in localStorage tells ALL tabs (shared storage) to discard stale state
  localStorage.setItem(RESET_KEY, Date.now().toString());
  saveToGitHub(empty); // fire-and-forget — RESET_KEY is the authoritative cross-tab signal
  const doReload = () => location.reload();
  if (_fbDb) {
    // Give Firebase up to 3 s; reload regardless so the button never hangs
    const fbTimeout = setTimeout(doReload, 3000);
    Promise.all([_fbDb.ref('units_blue').remove(), _fbDb.ref('units_red').remove(), _fbDb.ref('fort_positions').remove(), _fbDb.ref('game_meta/spawn').remove()])
      .then(() => { clearTimeout(fbTimeout); doReload(); })
      .catch(() => { clearTimeout(fbTimeout); doReload(); });
  } else {
    doReload();
  }
}

  }
  const savedAt = Date.now();
  const depPoints = deploymentPoints.map(dp => {
    const ll = dp.marker.getLatLng();
    return { lat: ll.lat, lng: ll.lng, side: dp.side, role: dp.role ?? 'infantry', moveRoute: dp.moveRoute ?? null, nextReinfAt: dp._nextReinfAt ?? 0, nextSpawnAt: dp._nextSpawnAt ?? 0 };
  });
  const payload = { units, depPoints, savedAt };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(payload)); } catch(e) {}
  swSend({ type: 'SAVE_STATE', state: payload });

  clearTimeout(saveState._ghTimer);

}

// Advance game state by deltaMs of real elapsed time (page was closed)
function fastForward(deltaMs) {
  const deltaSec = deltaMs / 1000;

  // 1 ─ Advance moving units along their routes
  for (const [marker, state] of movingMarkers) {
    const { route } = state;
    let budget = WALK_MS * deltaSec;
    while (budget > 0 && state.seg < route.length - 1) {
      const d = segMeters(route[state.seg], route[state.seg + 1]);
      const left = d * (1 - state.t);
      if (budget >= left) { budget -= left; state.seg++; state.t = 0; }
      else { state.t += budget / d; budget = 0; }
    }
    if (state.seg >= route.length - 1) {
      marker.setLatLng(route[route.length - 1]);
      unitLog(marker, `Arrived at destination (while offline)`);
      clearRoute(marker);
    } else {
      const a = route[state.seg], b = route[state.seg + 1];
      marker.setLatLng([a[0] + (b[0] - a[0]) * state.t, a[1] + (b[1] - a[1]) * state.t]);
      rebuildLine(state);
    }
  }

  // 2 ─ Fully simulate mavic missions through all phase transitions
  for (const m of allMarkers) {
    if (!m._mavicMission) continue;
    fastForwardMavic(m, deltaMs);
    // After simulation, if a continuous recon cycle is due, let the 1s tick pick it up
    // by setting _nextReconAt to now so it fires immediately
    if (m._continuousRecon && m._nextReconAt && m._nextReconAt <= Date.now()) {
      m._nextReconAt = 0; // fire immediately on next tick
    }
  }

  // 3 ─ Supply convoys / artillery / fortification: all use absolute timestamps,
  //     so the next 1s tick handles them naturally if their time has passed.
  const elapsed = deltaSec >= 3600 ? `${Math.floor(deltaSec/3600)}h ${Math.round((deltaSec%3600)/60)}m`
                : deltaSec >= 60   ? `${Math.round(deltaSec/60)}m ${Math.round(deltaSec%60)}s`
                : `${Math.round(deltaSec)}s`;
  showToast(`Game resumed (${elapsed} offline)`, '#42a5f5');
}

// Simulate a mavic mission through all its phases for the given elapsed real-time (ms)
function fastForwardMavic(m, deltaMs) {
  const now = Date.now();
  let budget = deltaMs; // real ms remaining to consume
  let cycles = 0;

  while (budget > 0 && cycles < 50) { // cap at 50 transitions to avoid infinite loops
    cycles++;
    const mis = m._mavicMission;
    if (!mis) break;

    if (mis.phase === 'outbound' || mis.phase === 'returning') {
      const dist = segMeters([mis.lat, mis.lng], [mis.dstLat, mis.dstLng]);
      const msNeeded = dist > 0 ? (dist / MAVIC_SPD) * 1000 : 0;

      if (budget >= msNeeded) {
        budget -= msNeeded;
        mis.lat = mis.dstLat; mis.lng = mis.dstLng;

        if (mis.phase === 'outbound') {
          m._lastScanTarget = { lat: mis.dstLat, lng: mis.dstLng };
          const hoverSec = (mis.hoverSec ?? 5) / TIME_SCALE;
          mis.scanEndsAt = now + (budget > 0 ? 0 : hoverSec * 1000); // already in past if budget left
          if (budget >= hoverSec * 1000) {
            budget -= hoverSec * 1000;
            mis.phase = 'scanned'; // trigger return logic below
          } else {
            mis.phase = 'scanning';
            mis.scanEndsAt = now + (hoverSec * 1000 - budget);
            budget = 0;
          }
        } else {
          // Returned home — mission complete
          const batt = mis.returnBatt ?? 5;
          m._mavicBattery = Math.max(0, (m._mavicBattery ?? 100) - batt);
          if (m._autoBatterySwap) m._mavicBattery = 100;
          unitLog(m, `Recon mission completed (while offline)`);
          const swapMs = (m._autoBatterySwap ? 5000 : 60000) / TIME_SCALE;
          m._mavicCooldownUntil = now;
          if (m._continuousRecon) m._nextReconAt = now;

          // Remove mission layers
          try { map.removeLayer(mis.droneMarker); } catch(e) {}
          try { if (mis.routeLine) map.removeLayer(mis.routeLine); } catch(e) {}
          m._mavicMission = null;

          // If continuous recon and battery ok, launch the next mission
          if (m._continuousRecon && m._mavicBattery >= 10 && budget > swapMs) {
            budget -= swapMs;
            doReconScan(m);
            // doReconScan creates a new _mavicMission; loop continues
          } else {
            break;
          }
        }
      } else {
        // Partially travelled
        const r = budget / msNeeded;
        mis.lat += (mis.dstLat - mis.lat) * r;
        mis.lng += (mis.dstLng - mis.lng) * r;
        budget = 0;
      }
    } else if (mis.phase === 'scanning' || mis.phase === 'scanned') {
      if (mis.phase === 'scanned' || now >= mis.scanEndsAt) {
        // Scan done — transition: patrol moves to next WP, simple scan returns home
        if (mis.type === 'patrol' && mis.waypoints?.length) {
          const nextWP = (mis.currentWP ?? 1) + 1;
          if (nextWP < mis.waypoints.length) {
            mis.currentWP = nextWP;
            mis.dstLat = mis.waypoints[nextWP][0];
            mis.dstLng = mis.waypoints[nextWP][1];
            mis.hoverSec = mis.hoverPerWP ?? mis.hoverSec;
            mis.phase = 'outbound';
          } else {
            mis.dstLat = mis.homeLat; mis.dstLng = mis.homeLng;
            mis.phase = 'returning';
          }
        } else {
          mis.dstLat = mis.homeLat; mis.dstLng = mis.homeLng;
          mis.phase = 'returning';
        }
        if (mis.scanCircle) { try { map.removeLayer(mis.scanCircle); } catch(e) {} mis.scanCircle = null; }
      } else {
        // Still scanning
        budget = 0;
      }
    } else {
      break; // unknown phase
    }
  }

  // Update visual position
  if (m._mavicMission) {
    m._mavicMission.droneMarker.setLatLng([m._mavicMission.lat, m._mavicMission.lng]);
    const phase = m._mavicMission.phase;
    const label = phase === 'scanning' ? 'Scanning' : 'In flight';
    try { m._mavicMission.droneMarker.setTooltipContent(label); } catch(e) {}
  }
}

// ── Service Worker integration ────────────────────────────────────────────
let _swReg = null;
function swSend(msg) {
  if (_swReg?.active) _swReg.active.postMessage(msg);
}

async function initSW() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    _swReg = await navigator.serviceWorker.register('sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    _swReg = await navigator.serviceWorker.getRegistration('sw.js');
    return _swReg;
  } catch(e) { console.warn('SW registration failed:', e); return null; }
}

// Ask the SW for events it accumulated while the tab was closed, then apply them.
function applySWHandoff(events) {
  if (!events?.length) return;
  let artCount = 0, supplyCount = 0, movedCount = 0;
  for (const ev of events) {
    const m = allMarkers[ev.idx];
    if (!m) continue;
    if (ev.type === 'artillery_impact') {
      applyArtilleryImpact(m, L.latLng(ev.lat, ev.lng), ev.blastR, ev.dispMax ?? 20);
      artCount++;
    } else if (ev.type === 'supply_arrived') {
      if (m._supply) applySupply(m);
      supplyCount++;
    } else if (ev.type === 'unit_arrived') {
      m.setLatLng([ev.lat, ev.lng]);
      clearRoute(m);
      unitLog(m, 'Arrived at destination (while offline)');
      movedCount++;
    } else if (ev.type === 'mavic_returned') {
      if (m._mavicMission) {
        try { map.removeLayer(m._mavicMission.droneMarker); } catch(e) {}
        try { if (m._mavicMission.routeLine) map.removeLayer(m._mavicMission.routeLine); } catch(e) {}
        m._mavicMission = null;
      }
    }
  }
  const parts = [];
  if (artCount)   parts.push(`${artCount} artillery strike${artCount>1?'s':''}`);
  if (supplyCount)parts.push(`${supplyCount} supply deliver${supplyCount>1?'ies':'y'}`);
  if (movedCount) parts.push(`${movedCount} unit${movedCount>1?'s':''} arrived`);
  if (parts.length) showToast(`While offline: ${parts.join(', ')}`, '#42a5f5', 6000);
}

      const minDeg = kmToDeg(r.minKm);
      const maxDeg = kmToDeg(r.maxKm);
      for (let t = 0; t < 120; t++) {
        const pt = randomInAny(spawnPolys);
        if (!pt) continue;
        if (!pointInBoundary(pt[0], pt[1])) continue;
        if (isNorthOfLine(pt) !== northSide) continue;
        const d = distToLine(pt);
        if (d < minDeg || d > maxDeg) continue;
        if (occupied.some(o => dist2(pt, o) < MIN_DIST_SQ)) continue;
        return pt;
      }
      // fallback: keep side, relax distance band — still must be inside boundary
      for (let t = 0; t < 60; t++) {
        const pt = randomInAny(spawnPolys);
        if (pt && pointInBoundary(pt[0], pt[1]) && isNorthOfLine(pt) === northSide &&
            !occupied.some(o => dist2(pt, o) < MIN_DIST_SQ)) return pt;
      }
      return null;
    }

    function pickWeightedRole(pool) {
      const total = pool.reduce((s, e) => s + e.w, 0);
      let r = Math.random() * total;
      for (const e of pool) { r -= e.w; if (r <= 0) return e.role; }
      return pool[pool.length - 1].role;
    }

    function groupSize(role) {
      if (['fpv','mavic'].includes(role)) return 3 + Math.floor(Math.random() * 2); // 3-4
      if (role === 'artillery') return 3 + Math.floor(Math.random() * 3);           // 3-5
      if (role === 'mortar')    return 2 + Math.floor(Math.random() * 2);           // 2-3
      return 2 + Math.floor(Math.random() * 4); // 2-5
    }

    // per-role minimum separation (degrees) to avoid clustering
    const ROLE_SEP = { infantry: 0.006, mortar: 0.008, mavic: 0.014, fpv: 0.014, artillery: 0.018 };
    const roleOccupied = {}; // "role+side" → [pts]

    function markOccupied(pt, role, northSide) {
      occupied.push(pt);
      const key = role + (northSide ? 'N' : 'S');
      (roleOccupied[key] = roleOccupied[key] || []).push(pt);
    }

    // pick a spot within a custom km band (used for close-rear extras)
    function pickBand(northSide, minKm, maxKm, tries = 80) {
      const minD = kmToDeg(minKm), maxD = kmToDeg(maxKm);
      const sep = ROLE_SEP.infantry ** 2;
      const key = 'infantryN';
      const roleOcc = roleOccupied['infantry' + (northSide ? 'N' : 'S')] || [];
      for (let t = 0; t < tries; t++) {
        const pt = randomInAny(spawnPolys);
        if (!pt) continue;
        if (!pointInBoundary(pt[0], pt[1])) continue;
        if (isNorthOfLine(pt) !== northSide) continue;
        const d = distToLine(pt);
        if (d < minD || d > maxD) continue;
        if (occupied.some(o => dist2(pt, o) < MIN_DIST_SQ)) continue;
        if (roleOcc.some(o => dist2(pt, o) < sep)) continue;
        return pt;
      }
      return null;
    }

    // Support pools — infantry is spawned separately in explicit quantities;
    // FPVs are added last via ratio enforcement (1 crew per 3 infantry).
    const BLUE_SUPPORT = [
      { role: 'mortar', w: 4 },
      { role: 'mavic',  w: 7 },
    ];
    const RED_SUPPORT = [
      { role: 'mortar', w: 5 },
      { role: 'mavic',  w: 7 },
    ];

    // override pickSpotForRole to also enforce per-role separation
    const _origPickSpot = pickSpotForRole;
    function pickSpotSep(northSide, role) {
      const r = ROLES[role];
      const minDeg = kmToDeg(r.minKm), maxDeg = kmToDeg(r.maxKm);
      const sepSq = (ROLE_SEP[role] ?? 0.003) ** 2;
      const key = role + (northSide ? 'N' : 'S');
      const roleOcc = roleOccupied[key] || [];
      for (let t = 0; t < 150; t++) {
        const pt = randomInAny(spawnPolys);
        if (!pt) continue;
        if (!pointInBoundary(pt[0], pt[1])) continue;
        if (isNorthOfLine(pt) !== northSide) continue;
        const d = distToLine(pt);
        if (d < minDeg || d > maxDeg) continue;
        if (occupied.some(o => dist2(pt, o) < MIN_DIST_SQ)) continue;
        if (roleOcc.some(o => dist2(pt, o) < sepSq)) continue;
        return pt;
      }
      // fallback: relax role separation
      return pickSpotForRole(northSide, role);
    }

    _ltxt('Placing units… +' + _ts());
    await new Promise(r => requestAnimationFrame(r));
    // Guarantee at least 2 artillery per side before random pool
    for (let i = 0; i < 2; i++) {
      for (const [northSide, side] of [[true,'blue'],[false,'red']]) {
        const pt = pickSpotSep(northSide, 'artillery');
        if (pt) { markOccupied(pt, 'artillery', northSide); createMarker(pt, side, groupSize('artillery'), 'artillery'); }
      }
    }

    _ltxt('Blue forces… +' + _ts());
    await new Promise(r => requestAnimationFrame(r));
    // ── Blue infantry core (10-13 units) ──
    const numBlueInf = 10 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numBlueInf; i++) {

      if (!pt) continue;

    }
    // ── Blue mortars (3-4 units) ──

      const pt = pickSpotSep(false, 'mortar');
      if (!pt) continue;
      markOccupied(pt, 'mortar', false);

    }
    // ── Red mavics (reduced) ──

      const pt = pickSpotSep(false, 'mavic');

    }

    // ── Extra infantry close to line (1-2.5 km band), 6 per side ──
    for (let i = 0; i < 6; i++) {
      const bPt = pickBand(true,  1.0, 2.5);
      if (bPt) { markOccupied(bPt, 'infantry', true);  createMarker(bPt, 'blue', groupSize('infantry'), 'infantry'); }
      const rPt = pickBand(false, 1.0, 2.5);
      if (rPt) { markOccupied(rPt, 'infantry', false); createMarker(rPt, 'red',  groupSize('infantry'), 'infantry'); }
    }

    _ltxt('FPV crews… +' + _ts());
    await new Promise(r => requestAnimationFrame(r));
    // ── FPV ratio: 1 crew per 3 infantry per side ──
    for (const northSide of [true, false]) {
      const side = northSide ? 'blue' : 'red';
      const infCount = allMarkers.filter(m => m._side === side && m._role === 'infantry').length;
      const fpvCount = allMarkers.filter(m => m._side === side && m._role === 'fpv').length;
      const needed   = Math.floor(infCount / 3) - fpvCount;
      for (let i = 0; i < needed; i++) {

      ));

    } else {
    // Fast cache path — create markers in batches of 10 so browser stays responsive
    _ltxt('Restoring units… +' + _ts());
    for (let _ci = 0; _ci < _scData.length; _ci++) {
      const _cu = _scData[_ci];
      createMarker(_cu.pos, _cu.side, _cu.count, _cu.role);

          'Restoring units… (' + (_ci + 1) + '/' + _scData.length + ')';
        await new Promise(r => requestAnimationFrame(r));
      }
    }
    } // end spawn cache if/else

    // Pre-hide all enemy markers before the loading overlay drops
    for (const _m of allMarkers) {
      if (_m._side !== userSide && !_adminAuthed) {
        const _el = _m.getElement(); if (_el) _el.style.display = 'none';
      }
    }
    document.getElementById('loading').style.display = 'none';
    loadAnnotations();
    fetchWeather();
    initFirebase();

  } catch (err) {
    showError(`Failed to load data: ${err.message}`);
    console.error(err);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// HORIZON TOOL — ported from playframap.github.io
// Computes the real line-of-sight boundary from a clicked point,
// accounting for Earth curvature + terrain (AWS Terrarium DEM tiles).
// ═══════════════════════════════════════════════════════════════════════

// ── Elevation tile cache (AWS Terrarium, same source as playframap) ──
const HZ_ELEV_ZOOM = 11;
const hzElevCache = new Map();
function hzFetchElevTile(z, x, y) {
  const key = z+':'+x+':'+y;
  if (hzElevCache.has(key)) return hzElevCache.get(key);
  const p = (async () => {
    try {
      const resp = await fetch('https://elevation-tiles-prod.s3.amazonaws.com/terrarium/'+z+'/'+x+'/'+y+'.png');
      if (!resp.ok) return null;
      const blob = await resp.blob();
      const bitmap = await createImageBitmap(blob);
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width; canvas.height = bitmap.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);
      const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const elev = new Float32Array(canvas.width * canvas.height);
      for (let i = 0, j = 0; i < d.length; i += 4, j++)
        elev[j] = (d[i] * 256 + d[i+1] + d[i+2] / 256) - 32768;
      return { elev, w: canvas.width, h: canvas.height };
    } catch(e) { return null; }
  })();
  hzElevCache.set(key, p);
  return p;
}
async function hzFetchElevAt(latlng, zoom) {
  const z = zoom || 14;
  const point = map.project(latlng, z);
  const tileX = Math.floor(point.x / 256), tileY = Math.floor(point.y / 256);
  const tile = await hzFetchElevTile(z, tileX, tileY);
  if (!tile) return null;
  const px = Math.floor(point.x - tileX * 256), py = Math.floor(point.y - tileY * 256);
  const v = tile.elev[py * tile.w + px];
  return v === undefined ? null : v;
}

// ── Constants ──
const HZ_EARTH_R_EFF = 6371000 * 4 / 3;
const HZ_EYE_M = 1.8;
const HZ_NUM_BEARINGS = 300;
const HZ_SAMPLES_PER_RAY = 90;
const HZ_MAX_RANGE_CAP_M = 80000;
const HZ_RASTER_DIM = 1500;

// ── Geo helpers ──
function hzDest(latlng, bearingDeg, distM) {
  const R = 6371000, brng = bearingDeg * Math.PI / 180;
  const lat1 = latlng.lat * Math.PI / 180, lng1 = latlng.lng * Math.PI / 180;
  const dR = distM / R;
  const lat2 = Math.asin(Math.sin(lat1)*Math.cos(dR)+Math.cos(lat1)*Math.sin(dR)*Math.cos(brng));
  const lng2 = lng1 + Math.atan2(Math.sin(brng)*Math.sin(dR)*Math.cos(lat1), Math.cos(dR)-Math.sin(lat1)*Math.sin(lat2));
  return L.latLng(lat2*180/Math.PI, ((lng2*180/Math.PI)+540)%360-180);
}
function hzBearing(from, to) {
  const lat1 = from.lat*Math.PI/180, lat2 = to.lat*Math.PI/180;
  const dL = (to.lng-from.lng)*Math.PI/180;
  const y = Math.sin(dL)*Math.cos(lat2);
  const x = Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dL);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function hzNearestRay(entry, bearing) {
  let best=0, bestD=Infinity;
  entry.horizonAngles.forEach((a,i) => {
    const d = Math.abs(((a.bearing-bearing+540)%360)-180);
    if (d < bestD) { bestD=d; best=i; }
  });
  return best;
}
function hzFmtBearing(deg) {
  const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg/22.5)%16]+' '+Math.round(deg)+'°';
}
function hzCurvDrop(distM) { return (distM*distM)/(2*HZ_EARTH_R_EFF); }

// ── Chart hover map marker (shared) ──
let hzChartMarker = null;
function hzShowMapMarker(latlng) {
  if (!latlng) return;
  if (hzChartMarker) hzChartMarker.setLatLng(latlng);
  else hzChartMarker = L.circleMarker(latlng, {radius:7,color:'#fff',weight:2,fillColor:'#e0a83f',fillOpacity:1}).addTo(map);
  hzChartMarker.bringToFront();
}
function hzHideMapMarker() {
  if (hzChartMarker) { map.removeLayer(hzChartMarker); hzChartMarker = null; }
}

// ── Zoom/pan for chart SVGs ──
function hzWireZoomPan(svg, getDomain, setDomain, domainMax, onChange) {
  const MIN_FRAC = 0.01;
  function clamp(min, max) {
    if (min < 0) { max -= min; min = 0; }
    if (max > domainMax) { min -= (max-domainMax); max = domainMax; }
    return [Math.max(0,min), Math.min(domainMax,max)];
  }
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return;
    const frac = Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
    const {min,max} = getDomain(), span = max-min;
    const cursorVal = min+frac*span;
    const factor = e.deltaY>0 ? 1.25 : 1/1.25;
    const newSpan = Math.min(domainMax,Math.max(domainMax*MIN_FRAC,span*factor));
    const [nm,nx] = clamp(cursorVal-frac*newSpan, cursorVal-frac*newSpan+newSpan);
    setDomain(nm,nx); onChange();
  }, {passive:false});
  let drag=false, dragMoved=false, dragX=0, dragMin=0, dragMax=0;
  svg.addEventListener('pointerdown', (e) => {
    drag=true; dragMoved=false;
    try{svg.setPointerCapture(e.pointerId);}catch(err){}
    const {min,max}=getDomain(); dragX=e.clientX; dragMin=min; dragMax=max;
  });
  svg.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return;
    if (Math.abs(e.clientX-dragX)>3) dragMoved=true;
    if (!dragMoved) return;
    const span=dragMax-dragMin, shift=-((e.clientX-dragX)/rect.width)*span;
    const [nm,nx]=clamp(dragMin+shift,dragMax+shift);
    setDomain(nm,nx); onChange();
  });
  function end(e){drag=false;try{svg.releasePointerCapture(e.pointerId);}catch(err){}}
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  return {wasDragged:()=>dragMoved};
}

// ── Panorama chart ──
const HZ_PANO_PAD = {L:26,R:8,T:8,B:16};
function hzPanoGeo(horizonAngles, W, H, domain) {
  const pool = horizonAngles.filter(a=>a.angleDeg!==null&&a.bearing>=domain.min&&a.bearing<=domain.max);
  const all  = horizonAngles.filter(a=>a.angleDeg!==null);
  const src  = pool.length?pool:all;
  const maxA = Math.max(...src.map(a=>a.angleDeg), 0.5);
  const {L:pL,R:pR,T:pT,B:pB} = HZ_PANO_PAD;
  const w=W-pL-pR, h=H-pT-pB;
  return {
    pL,pT,w,h,maxA,domain,
    xOf:(b)=>pL+((b-domain.min)/(domain.max-domain.min))*w,
    yOf:(a)=>pT+h-(Math.max(a,0)/Math.max(maxA,1))*h
  };
}
function hzBuildPanoSvg(horizonAngles, W, H, domain) {
  const valid = horizonAngles.filter(a=>a.angleDeg!==null);
  if (valid.length<2) return '<div style="font-size:11px;color:#8891a5;padding:6px 0;">Not enough terrain data.</div>';
  const geo = hzPanoGeo(horizonAngles, W, H, domain);
  const {pL,pT,w,h,maxA} = geo;
  let pathD='', started=false;
  horizonAngles.forEach(a=>{
    if (a.angleDeg===null||a.bearing<domain.min||a.bearing>domain.max){started=false;return;}
    const x=geo.xOf(a.bearing),y=geo.yOf(a.angleDeg);
    pathD+=(started?'L':'M')+x.toFixed(1)+','+y.toFixed(1);
    started=true;
  });
  const areaD = pathD?(pathD+' L'+(pL+w).toFixed(1)+','+(pT+h).toFixed(1)+' L'+pL.toFixed(1)+','+(pT+h).toFixed(1)+' Z'):'';
  const ticks=[{deg:0,l:'N'},{deg:45,l:'NE'},{deg:90,l:'E'},{deg:135,l:'SE'},
               {deg:180,l:'S'},{deg:225,l:'SW'},{deg:270,l:'W'},{deg:315,l:'NW'}]
    .filter(t=>t.deg>=domain.min&&t.deg<=domain.max);
  const ticksSvg=ticks.map(t=>{
    const x=geo.xOf(t.deg).toFixed(1), major=t.deg%90===0;
    return '<line x1="'+x+'" y1="'+pT+'" x2="'+x+'" y2="'+(pT+h)+'" stroke="#3a4255" stroke-width="1" stroke-dasharray="'+(major?'0':'2 3')+'" opacity="'+(major?'0.7':'0.35')+'"/>'+
      '<text x="'+x+'" y="'+(H-3)+'" font-size="9" fill="'+(major?'#eef1f7':'#8891a5')+'" text-anchor="middle">'+t.l+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none" style="display:block;cursor:crosshair;touch-action:none;">'+
    '<rect x="'+pL+'" y="'+pT+'" width="'+w+'" height="'+h+'" fill="#ff9e4a08"/>'+
    ticksSvg+
    '<path d="'+areaD+'" fill="#ff9e4a" fill-opacity="0.22" stroke="none"/>'+
    '<path d="'+pathD+'" fill="none" stroke="#ff9e4a" stroke-width="1.6"/>'+
    '<line x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(pT+h)+'" stroke="#3a4255" stroke-width="1"/>'+
    '<line x1="'+pL+'" y1="'+(pT+h)+'" x2="'+(pL+w)+'" y2="'+(pT+h)+'" stroke="#3a4255" stroke-width="1"/>'+
    '<text x="2" y="'+(pT+8)+'" font-size="9" fill="#8891a5">+'+maxA.toFixed(1)+'°</text>'+
    '<text x="2" y="'+(pT+h)+'" font-size="9" fill="#8891a5">0.0°</text>'+
    '<line class="hz-hover-line" x1="0" y1="'+pT+'" x2="0" y2="'+(pT+h)+'" stroke="#eef1f7" stroke-width="1" stroke-dasharray="3 2" opacity="0" pointer-events="none"/>'+
    '<circle class="hz-hover-dot" r="4.5" fill="#ff9e4a" stroke="#0d1117" stroke-width="2" opacity="0" pointer-events="none"/>'+
    '</svg>'+
    '<div class="elev-hover-stat hz-pano-stat">&nbsp;</div>';
}
function hzWirePanoHover(wrapEl, entry, W, H, domain) {
  const svg=wrapEl.querySelector('svg'); if (!svg) return;
  const geo=hzPanoGeo(entry.horizonAngles,W,H,domain);
  const {pL,w}=geo;
  const hl=svg.querySelector('.hz-hover-line'), hd=svg.querySelector('.hz-hover-dot');
  const stat=wrapEl.querySelector('.hz-pano-stat');
  function idxFromX(clientX) {
    const rect=svg.getBoundingClientRect(); if (!rect.width) return null;
    const xPx=(clientX-rect.left)*(W/rect.width);
    const frac=Math.min(1,Math.max(0,(xPx-pL)/w));
    const bearing=domain.min+frac*(domain.max-domain.min);
    return hzNearestRay(entry,bearing);
  }

  }
  function revert(){
    if (!showAt(hzSelectedIdx)){hl.setAttribute('opacity','0');hd.setAttribute('opacity','0');stat.innerHTML='&nbsp;';hzHideMapMarker();}
  }
  const zp=hzWireZoomPan(svg,()=>hzPanoDomain,(mn,mx)=>{hzPanoDomain={min:mn,max:mx};},360,()=>hzRenderPano(entry));
  svg.addEventListener('pointermove',(e)=>{const i=idxFromX(e.clientX);if(i!==null)showAt(i);});
  svg.addEventListener('pointerleave',revert);

}
let hzPanoDomain=null;
function hzRenderPano(entry) {
  if (!hzPanoDomain) hzPanoDomain={min:0,max:360};
  const w=document.getElementById('hzPanoWrap');
  w.innerHTML='<div class="hz-micro">Horizon panorama — click a direction, on the map or here, to inspect it. Scroll to zoom, drag to pan.</div>'+
    hzBuildPanoSvg(entry.horizonAngles,420,96,hzPanoDomain);
