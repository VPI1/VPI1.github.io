  if (m._role === 'fpv') {
    h += `<div class="psec">Drones</div>`;
    const drones = m._drones ?? 0;
    h += _statusRow('🚀', 'FPV drones', `${drones} / ${FPV_MAX_DRONES}`, drones > 1 ? '#81c784' : '#ef5350');
  } else if (['artillery','mortar'].includes(m._role)) {
    h += `<div class="psec">Ammo</div>`;
    const ammo = m._ammo ?? 0;
    h += _statusRow('🔴', 'Rounds', `${ammo} / ${m._maxAmmo ?? 0}`, ammo > 2 ? '#81c784' : ammo > 0 ? '#ffa726' : '#ef5350');
  }

  // ── Pending recon ──────────────────────────────────────────
  const pending = pendingStrikeConfirms.filter(e => e.logs.some(l => l.marker === m));
  if (pending.length) {
    h += `<div class="psec">Awaiting Recon</div>`;
    h += _statusRow('🔎', 'Unconfirmed strikes', `${pending.length}`, '#ffa726');
    h += `<div class="pb-note" style="color:#888;font-size:9px">Send Mavic or infantry to impact area to confirm damage</div>`;
  }

  return h || '<div class="pb-note">No active effects.</div>';
}

function renderPanel() {
  const m = activePanel;
  if (!m) return;
  const panel = document.getElementById('unit-panel');
  const now = Date.now();
  const moving = movingMarkers.has(m);
  const ac = m._side === 'blue' ? '#42a5f5' : '#ef5350';
  const rl = ROLES[m._role]?.label ?? m._role;
  const tab = m._panelTab ?? 'act';
  const logCount = m._log?.length ?? 0;

  let content = '';
  if (tab === 'act') content = _buildActTab(m, now, moving);
  else if (tab === 'dec') content = _buildDecTab(m);
  else if (tab === 'sts') content = _buildStatusTab(m);
  else content = _buildLogTab(m);

  panel.innerHTML = `
    <div class="ph">
      <div>
        <div class="ph-title">${rl}</div>
        <div class="ph-meta" style="color:${ac}">${m._side.toUpperCase()} · ${m._count} ${m._count===1?'unit':'units'}</div>
      </div>
      <button class="ph-x" onclick="closePanel()">✕</button>
    </div>
    ${_buildStats(m, now)}
    <div class="ptabs">
      <div class="ptab${tab==='act'?' on':''}" onclick="_tab('act')">Actions</div>
      <div class="ptab${tab==='dec'?' on':''}" onclick="_tab('dec')">Rules</div>
      <div class="ptab${tab==='sts'?' on':''}" onclick="_tab('sts')">Status</div>
      <div class="ptab${tab==='log'?' on':''}" onclick="_tab('log')">Log${logCount?` (${logCount})`:''}</div>
    </div>
    <div class="pc">${content}</div>`;
  panel.style.display = 'flex';
  showPanelRange(m);
  if ((m._role === 'fpv' || m._role === 'mavic') && !combatMode &&
      m._fpvReadyAt === 0 && (m._fpvCooldownUntil ?? 0) <= now) showFPVHorizon(m);
}

window._tab = function(name) { if (activePanel) { activePanel._panelTab = name; renderPanel(); } };

window._pa = function(action) {
  const m = activePanel;
  if (!m) return;
  if (action === 'adj-1') {
    pendingSplitCount = Math.max(1, (pendingSplitCount ?? m._count) - 1);
    renderPanel();
  } else if (action === 'adj+1') {
    pendingSplitCount = Math.min(m._count, (pendingSplitCount ?? m._count) + 1);
    renderPanel();
  } else if (action === 'merge') {
    const target = allMarkers.find(other =>
      other !== m && other._side === m._side && other._role === m._role &&
      !movingMarkers.has(other) && segMeters(markerPos(m), markerPos(other)) <= MERGE_DIST_M
    );
    if (target) mergeUnits(m, target);
  } else if (action === 'disband') {
    if (confirm(`Disband this ${m._role} unit (${m._count} soldiers)?`)) {
      clearRoute(m);
      closePanel();
      fbRemoveUnit(m);
      map.removeLayer(m);
      allMarkers.splice(allMarkers.indexOf(m), 1);
      saveState();
      showToast('Unit disbanded', '#888');
    }
  } else if (action === 'cancel-draw') {
    cancelDraw(); closePanel();
  } else if (action === 'redraw') {
    const savedPanel = m;
    if (movingMarkers.has(m)) clearRoute(m);
    activePanel = savedPanel;
    activeMarker = m; drawMode = true;
    const ll = m.getLatLng(); drawPoints = [[ll.lat, ll.lng]];
    pendingSplitCount = m._count;
    m.getElement()?.querySelector('.soldier-marker')?.classList.add('selected');
    map.getContainer().style.cursor = 'crosshair';
    map.dragging.disable();
    document.getElementById('unit-panel').style.display = 'none';
    setStatus('Redrawing route · click waypoints, dblclick or Enter to confirm');
  } else if (action === 'cancel-route') {
    clearRoute(m); closePanel();
  } else if (action === 'attack')    { cancelDraw(); doInfantryAttack(m); }
  else if (action === 'suppress')      { cancelDraw(); enterSuppressMode(m); }
  else if (action === 'area-suppress') { cancelDraw(); enterAreaSuppressMode(m); }
  else if (action === 'grenade')     { cancelDraw(); doGrenade(m); }
  else if (action === 'move-sel')    { cancelDraw(); moveSoldierSubset(m); }
  else if (action === 'disengage') {
    // Attacker voluntarily stops the fight
    endFight(m);
    showToast('Ceased fire.', '#90caf9');
  }
  else if (action === 'disengage-def') {
    // Defender breaks off — end the fight that's targeting this unit
    const _inc = [...activeFights.entries()].find(([,f]) => f.defender === m);
    if (_inc) { endFight(_inc[0]); showToast('Broke off engagement.', '#90caf9'); }
  }
  else if (action === 'calc-horizon') {
    if (!hzMode) toggleHorizonMode();
    hzCalcAt(m.getLatLng());
    closePanel();
  }
  else if (action === 'establish-antenna') { droneStartAntenna(m); }
  else if (action === 'cancel-antenna')    { droneCancelAntenna(m); }
  else if (action === 'remove-antenna')    { droneRemoveAntenna(m); }
  else if (action === 'attack-sel') {
    cancelDraw();
    m._engagedSoldierIds = new Set(m._selectedSoldierIds);
    unitLog(m, `Attacking with ${m._engagedSoldierIds.size}/${aliveSoldiers(m).length} selected soldiers`);
    doInfantryAttack(m);
  }
  else if (action === 'suppress-sel') {
    cancelDraw();
    m._engagedSoldierIds = new Set(m._selectedSoldierIds);
    unitLog(m, `Suppressing with ${m._engagedSoldierIds.size}/${aliveSoldiers(m).length} selected soldiers`);
    enterSuppressMode(m);
  }
  else if (action === 'fort-sel') { startFortify(m, m._selectedSoldierIds); }
  else if (action.startsWith('sel-')) {
    const id = parseInt(action.slice(4));
    if (m._selectedSoldierIds.has(id)) m._selectedSoldierIds.delete(id);
    else m._selectedSoldierIds.add(id);
    renderPanel();
  }
  else if (action.startsWith('trench-clear-')) { cancelDraw(); executeTrenchClear(m, action.slice(13)); }
  else if (action === 'bounding')    { cancelDraw(); enterBoundingOverwatch(m); }
  else if (action === 'hold-toggle') {
    if (!m._conds) m._conds = {};
    m._conds.holdPos = !m._conds.holdPos;
    if (m._conds.holdPos && movingMarkers.has(m)) clearRoute(m);
    unitLog(m, m._conds.holdPos ? 'Holding position' : 'Resuming normal orders');
    renderPanel();
  }
  else if (action === 'fort-start')   { startFortify(m); }
  else if (action === 'fort-stop')    { stopFortify(m); }
  else if (action === 'fort-breach')  { startWallBreach(m); }
  else if (action === 'set-fallback')  { cancelDraw(); enterSetFallback(m); }
  else if (action === 'clear-fallback'){ if (m._conds) { m._conds.fallbackPos = null; } renderPanel(); }
  else if (action === 'fpv-strike')  { cancelDraw(); enterFPVStrike(m); }
  else if (action === 'scan')        { cancelDraw(); enterMavicScan(m); }
  else if (action === 'patrol')      { cancelDraw(); enterPatrolDraw(m); }
  else if (action === 'relaunch-patrol') {
    cancelDraw();
    if (m._patrolRoute?.length >= 2) launchMavicPatrol(m, m._patrolRoute);
  }
  else if (action === 'abort-mavic') {
    if (m._mavicMission) {
      map.removeLayer(m._mavicMission.droneMarker);
      if (m._mavicMission.scanCircle) map.removeLayer(m._mavicMission.scanCircle);
      m._mavicMission = null;
      m._mavicCooldownUntil = Date.now() + 30000 / TIME_SCALE;
    }
    renderPanel();
  }
  else if (action === 'toggle-recon') {
    m._continuousRecon = !m._continuousRecon;
    if (!m._continuousRecon) m._nextReconAt = 0;
    renderPanel();
  }
  else if (action === 'toggle-auto-batt') {
    m._autoBatterySwap = !m._autoBatterySwap;
    if (m._autoBatterySwap) m._mavicBattery = 100;
    unitLog(m, m._autoBatterySwap ? 'Auto battery swap enabled — battery always ready' : 'Auto battery swap disabled');
    renderPanel();
  }
  else if (action === 'artillery')   { cancelDraw(); enterArtilleryFire(m); }
  else if (action === 'art-cancel') {
    if (m._artPending) {
      map.removeLayer(m._artPending.aimCircle);
      m._artPending = null;
    }
    m._taskQueue = [];
    m._ammo = Math.min(m._ammo + 1, m._maxAmmo ?? m._ammo + 1); // refund the prepared shell
    unitLog(m, 'Fire mission cancelled');
    renderPanel();
  }
  else if (action === 'art-fire-all') {
    m._taskQueue = []; // clear any stale queue so startArtilleryPrep rebuilds it from full ammo
    m._missionRepeat = 99;
    enterArtilleryFire(m);
  }
  else if (action === 'rep-1') {
    if (m._missionRepeat === 99) m._missionRepeat = 10;
    else m._missionRepeat = Math.max(1, m._missionRepeat - 1);
    renderPanel();
  }
  else if (action === 'rep+1') {
    m._missionRepeat = m._missionRepeat >= 10 ? 99 : m._missionRepeat + 1;
    renderPanel();
  }
  else if (action === 'supply-ammo')    { requestSupply(m, 'ammo'); }
  else if (action === 'supply-drones')  { requestSupply(m, 'drones'); }
  else if (action === 'supply-reinf')   { requestSupply(m, 'reinf'); }
  else if (action === 'supply-battery') { requestSupply(m, 'battery'); }
  else if (action === 'supply-cancel') {
    if (m._supply?.convoyMarker) map.removeLayer(m._supply.convoyMarker);
    m._supply = null;
    unitLog(m, 'Supply request cancelled');
    renderPanel();
  }
};

// Condition toggle handler — called inline from checkbox onchange
window._paC = function(key, val) {
  const m = activePanel;
  if (!m) return;
  if (!m._conds) m._conds = {};
  m._conds[key] = val;
  renderPanel();
};

// ── supply & logistics ────────────────────────────────────────
function supplyDepotPos(side) {
  return side === 'blue' ? SUPPLY_DEPOT_BLUE : SUPPLY_DEPOT_RED;
}

function requestSupply(unit, type) {
  if (unit._supply) return; // convoy already in transit
  const depot = supplyDepotPos(unit._side);
  const unitPos = markerPos(unit);
  const distKm = segMeters(depot, unitPos) / 1000;
  const transitMs = distKm * SUPPLY_MS_PER_KM;
  const arrivesAt = Date.now() + transitMs;

  // Animated convoy marker (truck icon) that moves from depot to unit
  const convoyIcon = L.divIcon({
    className: '',
    html: `<div style="font-size:16px;filter:drop-shadow(0 1px 3px #000);opacity:0.85">${unit._side === 'blue' ? '🚛' : '🚚'}</div>`,
    iconSize: [20, 20], iconAnchor: [10, 10],
  });
  const convoyMarker = L.marker(depot, { icon: convoyIcon, interactive: false, zIndexOffset: 300 }).addTo(map);

  unit._supply = { type, arrivesAt, convoyMarker, fromLat: depot[0], fromLng: depot[1], toLat: unitPos[0], toLng: unitPos[1] };
  // Tag the matching deployment point so its panel can show the ETA
  if (type === 'reinf') {
    const dp = nearestDepPoint(unit._side, unit._role, unitPos);
    if (dp) dp._nextReinfAt = arrivesAt;
  }
  const etaSec = Math.round(transitMs / 1000);
  const etaStr = etaSec >= 60 ? `${Math.floor(etaSec/60)}m ${etaSec%60}s` : `${etaSec}s`;
  unitLog(unit, `Supply requested: ${SUPPLY_TYPES[type].label} · ETA ${etaStr}`);
  showToast(`Convoy en route · ETA ${etaStr}`, '#66bb6a');
  renderPanel();
}

function applySupply(unit) {
  const s = unit._supply;
  if (!s) return;
  if (s.convoyMarker) map.removeLayer(s.convoyMarker);
  unit._supply = null;
  if (s.type === 'ammo') {
    unit._ammo = unit._maxAmmo;
    unitLog(unit, `Ammo resupplied → ${unit._ammo} rnd`);
    showToast('Ammo resupplied!', '#66bb6a');
  } else if (s.type === 'drones') {
    const added = Math.min(3, (unit._maxDrones ?? FPV_MAX_DRONES) - unit._drones);
    unit._drones = Math.min((unit._maxDrones ?? FPV_MAX_DRONES), unit._drones + 3);
    unitLog(unit, `Drone resupply: +${added} drones (${unit._drones} total)`);
    showToast(`+${added} FPV drones delivered!`, '#66bb6a');
  } else if (s.type === 'reinf') {
    // Spawn a new unit of the same role at the matching deployment point
    const role = unit._role;
    const dp = nearestDepPoint(unit._side, role, markerPos(unit));
    if (dp) {
      const spawnPos = dp.marker.getLatLng();
      const spawnCount = (role === 'infantry') ? 4 : 1;
      const newUnit = createMarker([spawnPos.lat, spawnPos.lng], unit._side, spawnCount, role);
      const roleLabel = ROLES[role]?.label ?? role;
      unitLog(newUnit, `${roleLabel} unit spawned at ${dp.role === 'all' ? 'general' : dp.role} deployment point`);
      showToast(`New ${roleLabel} unit spawned at deployment point!`, '#66bb6a');
      if (dp.moveRoute?.length) {
        assignRoute(newUnit, [[spawnPos.lat, spawnPos.lng], ...dp.moveRoute]);
        unitLog(newUnit, `Advancing on pre-planned route (${dp.moveRoute.length} waypoints)`);
      }
    } else {
      // No matching deployment point — for infantry, add soldiers directly; for others, warn
      if (role === 'infantry') {
        const newSoldiers = randomComposition(4);
        const startId = (unit._soldiers?.length ?? 0);
        newSoldiers.forEach((sol, i) => { sol.id = startId + i; });
        unit._soldiers = [...(unit._soldiers || []), ...newSoldiers];
        unit._count = aliveSoldiers(unit).length;
        unit._ammo = aliveSoldiers(unit).reduce((t, sol) => t + sol.ammo, 0);
        unit._maxAmmo = unit._soldiers.reduce((t, sol) => t + SOLDIER_ROLES[sol.role].ammo, 0);
        unit.setIcon(soldierIcon(unit._side, unit._count, unit._role));
        unitLog(unit, `Reinforced: +4 soldiers (${unit._count} total) — no deployment point`);
        showToast(`+4 reinforcements arrived (place a deployment point for better control)`, '#ffd54f');
      } else {
        showToast(`No deployment point for ${ROLES[role]?.label ?? role}! Unit could not spawn.`, '#ef5350');
        unitLog(unit, `Reinforcement failed — no deployment point for ${role}`);
      }
    }
  } else if (s.type === 'battery') {
    unit._mavicBattery = 100;
    unitLog(unit, 'Battery swapped → 100%');
    showToast('Mavic battery swapped!', '#66bb6a');
  }
  if (activePanel === unit) renderPanel();
}

// ── firefight system ──────────────────────────────────────────
// Ongoing firefights: attacker → { defender, intervalId }
const activeFights = new Map();

// Deterministic seeded RNG — same seed → same sequence on every client.
// Used for combat so both players compute identical outcomes independently.
function _mkRng(seed) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return function() { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
}

function fightTick(attacker, defender) {
  if (!allMarkers.includes(attacker) || !allMarkers.includes(defender) ||
      attacker._ammo <= 0) {
    endFight(attacker);
    unitLog(attacker, 'Firefight ended (ammo/destroyed)');
    showToast('Firefight ended — ammo exhausted or unit destroyed.', '#ef9a9a');
    return;
  }

  const distM = segMeters(markerPos(attacker), markerPos(defender));
  const maxRange = Math.max(unitRangeM(attacker), unitRangeM(defender), 1);
  // accuracy 1.0 at ≤50m, falls to ~0.15 at max range; fog/rain reduce further
  const accuracy = Math.max(0.08, (1 - Math.pow(distM / maxRange, 0.7) * 0.85) * groundVisibilityFactor);
  // inconclusive chance: 15% at close range → 60% at max range
  const inconclusiveChance = 0.15 + (1 - accuracy) * 0.55;

  const now = Date.now();
  const fight = activeFights.get(attacker);
  if (fight) fight.tickSeed = (fight.tickSeed || 0) + 1;
  const _rng = _mkRng((attacker._uid||'?') + ':' + (defender._uid||'?') + ':' + (fight ? fight.startedAt + ':' + fight.tickSeed : '0'));
  const defResponding = !fight || now >= fight.respondAt;

  // Suppression penalty
  const atkSup = attacker._suppressedUntil > now;
  const defSup = defender._suppressedUntil > now && unitHasMG(defender);
  if (atkSup) showToast('Suppressed — reduced fire effectiveness!', '#ff5722');

  attacker._ammo = Math.max(0, attacker._ammo - 1);
  if (attacker._soldiers) {
    // If only selected soldiers are engaged, drain ammo from them first
    const engagedIds = attacker._engagedSoldierIds;
    const pool = engagedIds
      ? aliveSoldiers(attacker).filter(s => engagedIds.has(s.id))
      : aliveSoldiers(attacker);
    for (const s of pool) { if (s.ammo > 0) { s.ammo--; break; } }
  }

  let aCas = 0, dCas = 0;
  const engagedIds = attacker._engagedSoldierIds;
  const atkAlive = engagedIds
    ? aliveSoldiers(attacker).filter(s => engagedIds.has(s.id))
    : aliveSoldiers(attacker);
  const defAlive = aliveSoldiers(defender);
  const fortBonus = FORT_COVER.smallArms[defender._fortLevel ?? 0] ?? 0;
  // Symmetric base hit rates — attacker has no inherent advantage
  const atkHit = accuracy * (atkSup ? 0.4 : 1.0) * (1 - fortBonus);
  const defHit = accuracy * (defSup ? 0.28 : 1.0); // defender equally capable; fortBonus already reduces dCas

  if (atkAlive.length) {
    for (const s of atkAlive) { if (s.ammo > 0 && _rng() < atkHit * 0.20) dCas++; }
  } else {
    for (let i = 0; i < attacker._count; i++) if (_rng() < atkHit * 0.20) dCas++;
  }
  if (defResponding) {
    if (defAlive.length) {
      for (const s of defAlive) { if (s.ammo > 0 && _rng() < defHit * 0.20) aCas++; }
    } else {
      for (let i = 0; i < defender._count; i++) if (_rng() < defHit * 0.20) aCas++;
    }
  }

  spawnBullets(attacker, defender);

  if (_rng() < inconclusiveChance) {
    const distLabel = distM < 100 ? 'close range' : distM < 300 ? 'medium range' : 'long range';
    unitLog(attacker, `Exchange vs ${ROLES[defender._role]?.label ?? 'enemy'} (${distLabel}): inconclusive`);
    if (defResponding) unitLog(defender, `Exchange vs ${ROLES[attacker._role]?.label ?? 'enemy'} (${distLabel}): inconclusive`);
    showToast(`Firefight at ${Math.round(distM)}m — no effect`, '#888');
    if (activePanel === attacker || activePanel === defender) renderPanel();
    return;
  }

  // No guaranteed kill — both sides may score zero in a tick
  if (_rng() < 0.10) dCas++;
  if (defResponding && _rng() < 0.10) aCas++;
  const aDestroyed = aCas > 0 ? damageUnit(attacker, aCas) : false;
  const dDestroyed = damageUnit(defender, dCas);
  // Immediately push both units so all clients see this tick's outcome right away
  fbSyncAnyUnit(attacker);
  fbSyncAnyUnit(defender);
  const msg = `Firefight at ${Math.round(distM)}m! Enemy: −${dCas}${dDestroyed?' ✗':''}  Friendly: −${aCas}${aDestroyed?' ✗':''}`;
  unitLog(attacker, `Exchange vs ${ROLES[defender._role]?.label ?? 'enemy'} at ${Math.round(distM)}m: we −${aCas}${aDestroyed?' (destroyed)':''}, they −${dCas}${dDestroyed?' (destroyed)':''}`);
  unitLog(defender, `Exchange vs ${ROLES[attacker._role]?.label ?? 'enemy'} at ${Math.round(distM)}m: we −${dCas}${dDestroyed?' (destroyed)':''}, they −${aCas}${aDestroyed?' (destroyed)':''}`);
  showToast(msg, '#ef9a9a');
  if (aDestroyed || dDestroyed) { endFight(attacker); return; }
  if (activePanel === attacker || activePanel === defender) renderPanel();
}

function startFight(attacker, defender) {
  if (activeFights.has(attacker)) return;
  const distM = segMeters(markerPos(attacker), markerPos(defender));
  // Defender takes 1-3 real seconds to react depending on distance
  const reactionMs = (1000 + (distM / unitRangeM(defender)) * 2000);
  unitLog(attacker, `Firefight started vs ${ROLES[defender._role]?.label ?? 'enemy'} at ${Math.round(distM)}m`);
  unitLog(defender, `Taking fire from ${ROLES[attacker._role]?.label ?? 'enemy'} at ${Math.round(distM)}m — reacting…`);
  const intervalId = setInterval(() => fightTick(attacker, defender), 8000 / TIME_SCALE);
  activeFights.set(attacker, { defender, intervalId, respondAt: Date.now() + reactionMs, tickSeed: 0, startedAt: Math.floor(Date.now() / 1000) });
  fightTick(attacker, defender); // attacker fires first; defender not yet responding
  setTimeout(() => {
    unitLog(defender, `Returning fire on ${ROLES[attacker._role]?.label ?? 'enemy'}`);
    if (activePanel === defender) renderPanel();
  }, reactionMs);
  if (activePanel === attacker) renderPanel();
}

function endFight(attacker) {
  const f = activeFights.get(attacker);
  if (f) { clearInterval(f.intervalId); activeFights.delete(attacker); }
  attacker._engagedSoldierIds = null; // clear any partial engagement
  if (activePanel === attacker) renderPanel();
}

function doInfantryAttack(attacker) {
  if (activeFights.has(attacker)) { endFight(attacker); return; }
  const rangeKm = unitRangeM(attacker) / 1000;
  const enemies = findEnemiesInRange(attacker, rangeKm)
    .filter(e => e._spottedUntil > Date.now())
    .sort((a,b) => segMeters(markerPos(attacker), markerPos(a)) - segMeters(markerPos(attacker), markerPos(b)));
  if (!enemies.length || attacker._ammo <= 0) { showToast('No spotted enemies in range or no ammo.', '#888'); return; }
  if (enemies.length === 1) {
    startFight(attacker, enemies[0]);
    return;
  }
  // Multiple targets — enter click-to-pick mode (same pattern as suppress)
  enterCombatMode('attack-pick', attacker, rangeKm, '#ef5350');
  enemies.forEach(enemy => {
    const h = (e) => { L.DomEvent.stopPropagation(e); startFight(attacker, enemy); exitCombatMode(); };
    enemy.on('click', h); combatTargetHandlers.push({ m: enemy, h });
  });
  setStatus(`Attack: click target within ${Math.round(rangeKm*1000)}m (${enemies.length} spotted) — Esc to cancel`);
  closePanel();
}

// ── advanced tactics ─────────────────────────────────────────

// Overwatch: infantry auto-fires on first spotted enemy each second (processed in 1s interval)
// Hold position: unit refuses new movement orders
// Bounding overwatch: unit A suppresses while unit B advances, then swap

let boundingState = null; // { suppressor, step:'pick-mover'|'pick-dest' }

function executeTrenchClear(attacker, targetUid) {
  const target = allMarkers.find(m => m._uid === targetUid);
  if (!target || (target._fortLevel ?? 0) === 0) {
    showToast('Target no longer in fortified position', '#888'); return;
  }
  const distM = segMeters(markerPos(attacker), markerPos(target));
  if (distM > 25) { showToast('Too far — move within 20m of the position first', '#ef5350'); return; }

  // Defender awareness: their effective sight range vs distance to attacker
  const defRange   = unitRangeM(target);
  const defAware   = defRange >= distM;
  // Defender's side mavic covering the area?
  const defHasMav  = allMarkers.some(mk => {
    if (mk._side !== target._side || mk._role !== 'mavic') return false;
    const mis = mk._mavicMission;
    return mis?.phase === 'scanning' && segMeters([mis.dstLat, mis.dstLng], markerPos(target)) < 400;
  });
  const fullyAware = defAware || defHasMav;

  showExplosion(target.getLatLng(), 40);
  showExplosion(attacker.getLatLng(), 20);

  // Success chance: high if defender blind, much lower if aware
  const successChance = fullyAware ? 0.38 : 0.74;
  const success = Math.random() < successChance;

  if (success) {
    // Attacker wins — heavy casualties on defender, light on attacker
    const defCas  = 1 + Math.floor(Math.random() * (fullyAware ? 2 : 3)) + (fullyAware ? 0 : 1);
    const atkCas  = fullyAware ? 1 + Math.floor(Math.random() * 2) : Math.random() < 0.35 ? 1 : 0;
    const defDest = damageUnit(target, defCas);
    if (atkCas > 0) damageUnit(attacker, atkCas);
    updateFortBadge(target);
    const note = fullyAware ? ' (contested)' : ' (surprise)';
    unitLog(attacker, `Trench cleared${note} — defender −${defCas}${defDest?' · DESTROYED':''}${atkCas>0?`, we −${atkCas}`:''}`);
    unitLog(target,   `Position overrun — −${defCas}${defDest?' · DESTROYED':''} · fort degraded`);
    showToast(`Trench cleared! ${defDest?'Enemy destroyed':'Enemy heavily damaged'}`, '#81c784');
  } else {
    // Attacker repelled — heavier attacker casualties
    const atkCas = 1 + Math.floor(Math.random() * 3);
    const defCas = Math.random() < 0.5 ? 1 : 0;
    const atkDest = damageUnit(attacker, atkCas);
    if (defCas) damageUnit(target, defCas);
    unitLog(attacker, `Assault repelled — we −${atkCas}${atkDest?' · DESTROYED':''}${defCas?`, defender −${defCas}`:''}`);
    unitLog(target,   `Assault repelled — attackers suffered −${atkCas}${defCas?`, we −${defCas}`:''}`);
    showToast('Assault repelled — unit took casualties', '#ef5350');
  }

  if (_fbDb) {
    fbSyncUnit(attacker);
    if (allMarkers.includes(target)) { // target might be another side — push directly
      const pos = target.getLatLng();
      _fbDb.ref(`units_${target._side}/${target._uid}`).set({
        uid: target._uid, lat: pos.lat, lng: pos.lng, side: target._side,
        role: target._role, count: target._count, remainingRoute: null,
        updatedAt: Date.now(), clientId: _fbClientId,
      }).catch(() => {});
    }
  }
  saveState(); renderPanel();
}

function enterBoundingOverwatch(suppressor) {
  if (activeFights.has(suppressor)) { showToast('Already in a firefight.', '#888'); return; }
  if (suppressor._ammo <= 0) { showToast('No ammo for suppression.', '#888'); return; }
  boundingState = { suppressor, step: 'pick-mover' };
  exitCombatMode();
  closePanel();
  setStatus('Bounding overwatch: click the FRIENDLY unit that will advance while this unit suppresses — Esc to cancel');
  // Highlight friendly infantry as clickable targets
  allMarkers.filter(m => m._side === suppressor._side && m !== suppressor && m._role === 'infantry').forEach(m => {
    const h = (e) => {
      L.DomEvent.stopPropagation(e);
      if (!boundingState) return;
      boundingState.mover = m;
      boundingState.step = 'pick-enemy';
      setStatus('Bounding overwatch: click the ENEMY to suppress — Esc to cancel');
      // now pick enemy to suppress
      const now = Date.now();
      const enemies = findEnemiesInRange(suppressor, unitRangeM(suppressor)/1000).filter(e => e._spottedUntil > now);
      enemies.forEach(enemy => {
        const eh = (ev) => {
          L.DomEvent.stopPropagation(ev);
          if (!boundingState) return;
          // Start suppression of enemy, start mover in draw mode
          executeSuppression(suppressor, enemy);
          const mover = boundingState.mover;
          boundingState = null;
          setStatus('Bounding overwatch: now draw the advance route for the moving unit');
          activePanel = mover;
          selectForRoute(mover);
          unitLog(suppressor, `Bounding overwatch: suppressing, ${ROLES[mover._role]?.label ?? 'friendly'} advancing`);
          unitLog(mover, `Bounding overwatch: advancing under suppressive cover`);
        };
        enemy.on('click', eh); combatTargetHandlers.push({ m: enemy, h: eh });
      });
      if (!enemies.length) {
        showToast('No spotted enemies in range for suppression.', '#888');
        boundingState = null; setStatus('');
      }
    };
    m.on('click', h); combatTargetHandlers.push({ m, h });
  });
}

function cancelBoundingOverwatch() {
  boundingState = null;
  exitCombatMode();
}

// ── conditional orders ────────────────────────────────────────
// Stored on each unit as m._conds = { overwatchOn, holdPos, autoFallback, fallbackPos,
//   returnLowBatt(mavic), alertArt(mavic), autoFireMavic(art), autoLaunchFPV }

let _settingFallback = null; // unit being configured for fallback point

// ── Deployment points ────────────────────────────────────────────
// Each: { marker, side, role, moveRoute: [[lat,lng],...]|null, routeLine: polyline|null }
let deploymentPoints = [];
let _placingDeployPoint = false;
let _pendingDeployRole = 'infantry';
let _drawingDeployRoute = null; // { dp, points:[], previewLine:null }

const DEP_ROLE_COLORS = { infantry:'#66bb6a', fpv:'#ffa726', mavic:'#26c6da', artillery:'#ef5350', mortar:'#ab47bc', all:'#42a5f5' };
const DEP_ROLE_LABELS = { infantry:'Inf', fpv:'FPV', mavic:'Mav', artillery:'Art', mortar:'Mor', all:'All' };
const DEP_MAX_PER_TYPE = 2; // max TDPs per role per side

// Real-world ms between auto-spawns, and how many soldiers spawn each time
const TDP_SPAWN_INTERVAL_MS = { infantry: 2*60*1000, fpv: 5*60*1000, mavic: 5*60*1000, artillery: 10*60*1000, mortar: 7*60*1000 };
const TDP_SPAWN_COUNT       = { infantry: 2, fpv: 4, mavic: 1, artillery: 1, mortar: 1 };

function depPointIcon(side, role) {
  const col = DEP_ROLE_COLORS[role] ?? (side === 'blue' ? '#42a5f5' : '#ef5350');
  const lbl = DEP_ROLE_LABELS[role] ?? '⚑';
  return L.divIcon({
    className: '',
    html: `<div style="min-width:28px;height:22px;background:${col};border:2px solid #fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;box-shadow:0 1px 4px #000a;cursor:pointer;padding:0 3px" title="${role} Deployment Point">⚑${lbl}</div>`,
    iconSize: [32,22], iconAnchor: [16,11],
  });
}

function createDeploymentPoint(latlng, side, role) {
  role = role || _pendingDeployRole || 'infantry';
  const marker = L.marker([latlng.lat, latlng.lng], { icon: depPointIcon(side, role), draggable: true, zIndexOffset: 500 }).addTo(map);
  const intervalMs = TDP_SPAWN_INTERVAL_MS[role] ?? 5*60*1000;
  const dp = { marker, side, role, moveRoute: null, routeLine: null,
    _nextSpawnAt: Date.now() + intervalMs, _spawnIntervalMs: intervalMs };
  deploymentPoints.push(dp);
  marker.on('click', (e) => { e.originalEvent?.stopPropagation(); openDeployPanel(dp); });
  marker.on('dragend', () => {
    if (dp.routeLine && dp.moveRoute) redrawDepRoute(dp);
    saveState();
  });
  return dp;
}

function redrawDepRoute(dp) {
  if (dp.routeLine) { map.removeLayer(dp.routeLine); dp.routeLine = null; }
  if (!dp.moveRoute?.length) return;
  const pos = dp.marker.getLatLng();
  const pts = [[pos.lat, pos.lng], ...dp.moveRoute];
  const col = DEP_ROLE_COLORS[dp.role] ?? '#42a5f5';
  dp.routeLine = L.polyline(pts, { color: col, weight: 2, dashArray: '5 4', opacity: 0.75 }).addTo(map)
    .bindTooltip('Advance route', { className: 'fpv-eta-tip', direction: 'top' });
}

let _depPanelTimer = null;

function closeDeployPanel() {
  if (_depPanelTimer) { clearInterval(_depPanelTimer); _depPanelTimer = null; }
  document.getElementById('dep-panel')?.remove();
}

function openDeployPanel(dp) {
  closeDeployPanel();
  const idx = deploymentPoints.indexOf(dp);
  if (idx < 0) return;
  const pos  = dp.marker.getLatLng();
  const col  = DEP_ROLE_COLORS[dp.role] ?? '#42a5f5';
  const side = dp.side === 'blue' ? 'Blue' : 'Red';
  const role = ROLES[dp.role]?.label ?? (dp.role === 'all' ? 'All types' : dp.role);
  const routeStr = () => dp.moveRoute?.length ? `${dp.moveRoute.length} waypoint${dp.moveRoute.length > 1 ? 's' : ''}` : 'Not set';

  const panel = document.createElement('div');
  panel.id = 'dep-panel';
  panel.style.cssText = 'position:fixed;bottom:80px;right:16px;background:#1a1a2e;border:1px solid #444;border-radius:6px;padding:12px;font-family:monospace;font-size:11px;min-width:190px;z-index:9000;box-shadow:0 2px 14px #000c';
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <b style="color:${col}">⚑ ${side} · ${role}</b>
      <span id="dep-panel-close" style="cursor:pointer;color:#777;font-size:16px;line-height:1;padding:0 2px">✕</span>
    </div>
    <div style="color:#666;font-size:10px;margin-bottom:8px">${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}</div>
    <div id="dep-panel-reinf" style="color:#66bb6a;font-size:11px;margin-bottom:6px;min-height:14px"></div>
    <div style="margin-bottom:8px"><b>Advance route:</b> <span id="dep-panel-route" style="color:#bbb">${routeStr()}</span></div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button id="dep-draw-btn" style="background:#1e88e5;color:#fff;border:none;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:10px">Draw Route</button>
      <button id="dep-clear-btn" style="background:#444;color:#fff;border:none;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:10px">Clear Route</button>
      <button id="dep-remove-btn" style="background:#b71c1c;color:#fff;border:none;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:10px">Remove</button>
    </div>
  `;
  document.body.appendChild(panel);

  panel.querySelector('#dep-panel-close').onclick  = closeDeployPanel;
  panel.querySelector('#dep-draw-btn').onclick      = () => { startDrawDeployRoute(idx); closeDeployPanel(); };
  panel.querySelector('#dep-clear-btn').onclick     = () => { clearDepRoute(idx); panel.querySelector('#dep-panel-route').textContent = routeStr(); };
  panel.querySelector('#dep-remove-btn').onclick    = () => { removeDeployPoint(idx); closeDeployPanel(); };

  // Live spawn countdown
  function updateReinfEta() {
    const el = document.getElementById('dep-panel-reinf');
    if (!el) return;
    const ms = dp._nextSpawnAt ? Math.max(0, dp._nextSpawnAt - Date.now()) : 0;
    const spawnCount = TDP_SPAWN_COUNT[dp.role] ?? 1;
    if (ms > 0) {
      const s = Math.ceil(ms / 1000);
      const str = s >= 60 ? `${Math.floor(s/60)}m ${s%60}s` : `${s}s`;
      el.style.color = '#66bb6a';
      el.textContent = `Next spawn in: ${str} (+${spawnCount} ${dp.role})`;
    } else {
      el.style.color = '#ffa726';
      el.textContent = 'Spawning now…';
    }
  }
  updateReinfEta();
  _depPanelTimer = setInterval(updateReinfEta, 1000);

  // Close on outside click
  setTimeout(() => {
    const closer = (e) => { if (!panel.contains(e.target)) { closeDeployPanel(); map.off('click', closer); } };
    map.on('click', closer);
  }, 150);
}

function startDrawDeployRoute(idx) {
  const dp = deploymentPoints[idx];
  if (!dp) return;
  dp.marker.closePopup();
  const pos = dp.marker.getLatLng();
  const col = DEP_ROLE_COLORS[dp.role] ?? '#42a5f5';
  _drawingDeployRoute = { dp, points: [], previewLine: L.polyline([[pos.lat, pos.lng]], { color: col, weight: 2, dashArray: '4 3', opacity: 0.8 }).addTo(map) };
  setStatus('Click waypoints for advance route · Enter or dblclick to finish · Esc to cancel');
}

function finishDeployRoute() {
  if (!_drawingDeployRoute) return;
  const { dp, points, previewLine } = _drawingDeployRoute;
  map.removeLayer(previewLine);
  _drawingDeployRoute = null;
  if (points.length > 0) {
    dp.moveRoute = points;
    redrawDepRoute(dp);
    showToast(`Advance route set — ${points.length} waypoint${points.length>1?'s':''}`, '#66bb6a');
  }
  setStatus('');
  saveState();
}

function clearDepRoute(idx) {
  const dp = deploymentPoints[idx];
  if (!dp) return;
  dp.moveRoute = null;
  if (dp.routeLine) { map.removeLayer(dp.routeLine); dp.routeLine = null; }
  dp.marker.closePopup();
  saveState();
}

function removeDeployPoint(idx) {
  const dp = deploymentPoints[idx];
  if (!dp) return;
  map.removeLayer(dp.marker);
  if (dp.routeLine) map.removeLayer(dp.routeLine);
  deploymentPoints.splice(idx, 1);
  saveState();
}

function enterPlaceDeployPoint() {
  const picker = document.getElementById('dep-picker');
  const showing = picker.style.display === 'flex';
  if (showing) {
    picker.style.display = 'none';
    _placingDeployPoint = false;
    document.getElementById('dep-btn').classList.remove('ruler-on');
    setStatus('');
    return;
  }
  // Rebuild buttons with live counts
  const roles = ['infantry','fpv','mavic','artillery','mortar'];
  picker.innerHTML = '<div style="width:100%;color:#556;font-size:10px;padding-bottom:4px;letter-spacing:.4px">DEPLOY POINT FOR:</div>';
  for (const role of roles) {
    const cur = deploymentPoints.filter(d => d.side === userSide && d.role === role).length;
    const full = cur >= DEP_MAX_PER_TYPE;
    const btn = document.createElement('button');
    btn.className = 'dep-role-btn';
    btn.textContent = `${role[0].toUpperCase()+role.slice(1)} (${cur}/${DEP_MAX_PER_TYPE})`;
    btn.style.opacity = full ? '0.45' : '1';
    btn.onclick = () => selectDepRole(role);
    picker.appendChild(btn);
  }
  picker.style.display = 'flex';
}

function selectDepRole(role) {
  const existing = deploymentPoints.filter(d => d.side === userSide && d.role === role).length;
  if (existing >= DEP_MAX_PER_TYPE) {
    const label = role === 'all' ? 'all-units' : (ROLES[role]?.label ?? role);
    showToast(`Max ${DEP_MAX_PER_TYPE} deployment points per type (${label} is full)`, '#ef5350');
    document.getElementById('dep-picker').style.display = 'none';
    return;
  }
  _pendingDeployRole = role;
  _placingDeployPoint = true;
  document.getElementById('dep-picker').style.display = 'none';
  document.getElementById('dep-btn').classList.add('ruler-on');
  const label = role === 'all' ? 'all units' : (ROLES[role]?.label ?? role);
  setStatus(`Click map to place ${label} deployment point — Esc to cancel`);
}

// Find nearest deployment point for a side and role
function nearestDepPoint(side, role, pos) {
  const pts = deploymentPoints.filter(d => d.side === side && d.role === role);
  if (!pts.length) return null;
  if (pts.length === 1) return pts[0];
  let best = pts[0], bestD = segMeters(markerPos(best.marker), pos);
  for (const p of pts.slice(1)) {
    const d = segMeters(markerPos(p.marker), pos);
    if (d < bestD) { best = p; bestD = d; }
  }
  return best;
}

function enterSetFallback(unit) {
  _settingFallback = unit;
  exitCombatMode(); closePanel();
  setStatus('Set fallback point: click a safe position for auto-retreat — Esc to cancel');
}

function processConditions() {
  const now = Date.now();
  for (const m of allMarkers) {
    if (m._side !== userSide) continue;
    const c = m._conds;
    if (!c) continue;

    // Overwatch — auto-engage nearest spotted enemy each second
    if (c.overwatchOn && m._role === 'infantry' && !activeFights.has(m) && m._ammo > 0) {
      const en = findEnemiesInRange(m, unitRangeM(m)/1000).filter(e => e._spottedUntil > now);
      if (en.length > 0) {
        en.sort((a,b) => segMeters(markerPos(m), markerPos(a)) - segMeters(markerPos(m), markerPos(b)));
        startFight(m, en[0]);
        unitLog(m, `Overwatch: auto-engaging ${ROLES[en[0]._role]?.label ?? 'enemy'} at ${Math.round(segMeters(markerPos(m), markerPos(en[0])))}m`);
      }
    }

    // Auto-fallback when under fire
    if (c.autoFallback && c.fallbackPos && m._role === 'infantry' && !movingMarkers.has(m)) {
      const underFire = [...activeFights.values()].some(f => f.defender === m);
      if (underFire && !m._fallbackTriggered) {
        m._fallbackTriggered = true;
        endFight(m);
        assignRoute(m, [markerPos(m), c.fallbackPos]);
        unitLog(m, 'Auto-fallback triggered — retreating under fire');
        showToast(`${ROLES[m._role]?.label ?? 'Unit'} auto-retreating to fallback!`, '#ff5722');
        setTimeout(() => { m._fallbackTriggered = false; }, 30000 / TIME_SCALE);
      }
    }

    // Hold if suppressed — cancel movement when suppressed
    if (c.holdIfSuppressed && m._suppressedUntil > now && movingMarkers.has(m)) {
      clearRoute(m);
      unitLog(m, 'Suppression: holding position (condition active)');
    }

    // Mavic: return if battery < 20%
    if (c.returnLowBatt && m._role === 'mavic' && m._mavicBattery < 20 && m._mavicMission) {
      const mis = m._mavicMission;
      if (mis.phase !== 'returning') {
        mis.phase = 'returning';
        mis.dstLat = mis.homeLat; mis.dstLng = mis.homeLng;
        unitLog(m, 'Condition: low battery — aborting mission, returning home');
        showToast('Mavic: low battery abort triggered!', '#ffa726');
      }
    }

    // Mavic: alert nearest friendly artillery when enemy spotted this tick
    if (c.alertArt && m._role === 'mavic' && m._pendingArtAlert) {
      const target = m._pendingArtAlert;
      m._pendingArtAlert = null;
      const artUnits = allMarkers.filter(a =>
        a._side === userSide && (a._role === 'artillery' || a._role === 'mortar') &&
        !a._artPending && a._ammo > 0 &&
        a._conds?.autoFireMavic && // must have "auto-fire on mavic alert" enabled
        segMeters(markerPos(a), target) <= (a._role === 'artillery' ? 25000 : 3000)
      );
      if (artUnits.length > 0) {
        artUnits.sort((a,b) => segMeters(markerPos(a), target) - segMeters(markerPos(b), target));
        const art = artUnits[0];
        startArtilleryPrep(art, L.latLng(target[0], target[1]));
        unitLog(m, `Mavic alert → triggered ${ROLES[art._role]?.label ?? 'artillery'} fire on spotted target`);
        unitLog(art, `Auto-fire: mavic-directed mission`);
        showToast(`Mavic alert! ${ROLES[art._role]?.label ?? 'Artillery'} firing on spotted target`, '#ffa726');
      }
    }

    // Mavic: alert nearest friendly FPV when enemy spotted
    if (c.alertFPV && m._role === 'mavic' && m._pendingArtAlert) {
      const target = [m._pendingArtAlert[0], m._pendingArtAlert[1]];
      // find closest FPV crew with drones ready
      const fpvUnits = allMarkers.filter(a =>
        a._side === userSide && a._role === 'fpv' &&
        a._drones > 0 && a._fpvReadyAt === 0 && a._fpvCooldownUntil <= now &&
        segMeters(markerPos(a), target) <= FPV_RADIO_HORIZON_M
      );
      if (fpvUnits.length > 0) {
        fpvUnits.sort((a,b) => segMeters(markerPos(a), target) - segMeters(markerPos(b), target));
        enterFPVStrike(fpvUnits[0]);
        unitLog(m, `Mavic alert → FPV crew alerted, enemy ${fmtDist(segMeters(markerPos(fpvUnits[0]), target))} away`);
        unitLog(fpvUnits[0], 'Auto-prep: mavic-directed FPV alert');
        showToast('Mavic alert! FPV crew prepping strike', '#ef5350');
      }
    }

    // FPV: auto-launch when enemy spotted in range
    if (c.autoLaunchFPV && m._role === 'fpv' && m._fpvReadyAt === 0 && m._fpvCooldownUntil <= now && m._drones > 0) {
      const enemies = findEnemiesInRange(m, 10).filter(e => e._spottedUntil > now);
      if (enemies.length > 0) {
        enterFPVStrike(m);
        unitLog(m, `Auto-launch: FPV launched at spotted ${ROLES[enemies[0]._role]?.label ?? 'enemy'}`);
      }
    }
  }
}

// ── Strike confirmation system ────────────────────────────────
// Damage results are only revealed if a friendly Mavic is scanning within 400m
// of the impact, or a friendly infantry unit is within 200m.
// Otherwise the result is queued and revealed when recon reaches the area.
const pendingStrikeConfirms = [];

function canConfirmStrike(side, lat, lng) {
  const pt = [lat, lng];
  for (const mk of allMarkers) {
    if (mk._side !== side) continue;
    if (mk._role === 'mavic') {
      const mis = mk._mavicMission;
      if (mis?.phase === 'scanning' && segMeters([mis.dstLat, mis.dstLng], pt) < 400) return true;
    }
    if (mk._role === 'infantry' && segMeters(markerPos(mk), pt) < 200) return true;
  }
  return false;
}

// Deliver a confirmed strike result: log messages and optional toast
function _deliverStrikeResult(entry) {
  for (const { marker, text } of entry.logs) {
    if (allMarkers.includes(marker)) unitLog(marker, text);
  }
  if (entry.side === userSide && entry.toast) showToast(entry.toast, '#ffa726');
  if (entry.onConfirm) entry.onConfirm();
  if (activePanel && allMarkers.includes(activePanel)) renderPanel();
}

// Queue result if no recon available; deliver immediately otherwise
function confirmOrQueue(side, lat, lng, logs, toast, onConfirm) {
  if (canConfirmStrike(side, lat, lng)) {
    _deliverStrikeResult({ side, lat, lng, logs, toast, onConfirm });
  } else {
    pendingStrikeConfirms.push({ side, lat, lng, logs, toast, onConfirm, expiresAt: Date.now() + 120000 });
    if (side === userSide) showToast('Strike fired — send Mavic or infantry near impact for damage assessment', '#888');
  }
}

// Called from game tick and Mavic scan loop to flush confirmed strikes
function checkPendingStrikeConfirms() {
  const now = Date.now();
  for (let i = pendingStrikeConfirms.length - 1; i >= 0; i--) {
    const e = pendingStrikeConfirms[i];
    if (now > e.expiresAt) { pendingStrikeConfirms.splice(i, 1); continue; }
    if (canConfirmStrike(e.side, e.lat, e.lng)) {
      _deliverStrikeResult(e);
      pendingStrikeConfirms.splice(i, 1);
    }
  }
}

// ── FPV drone ─────────────────────────────────────────────────
const flyingFPVs = []; // { droneMarker, pilot, target, lat, lng, dstLat, dstLng }
const flyingShells = []; // { marker, lat, lng, dstLat, dstLng, speed, unit, pending }
const flyingBullets = []; // { marker, lat, lng, dstLat, dstLng, born }

function shellIcon(isMortar) {
  const col = isMortar ? '#b0bec5' : '#ffb74d';
  return L.divIcon({
    className: '',
    html: `<div style="width:6px;height:10px;background:${col};border-radius:3px 3px 1px 1px;transform:rotate(45deg);box-shadow:0 0 4px ${col}88"></div>`,
    iconSize: [10,10], iconAnchor: [5,5]
  });
}
function bulletIcon() {
  return L.divIcon({
    className: '',

function launchShell(unit, pending) {

  const from = markerPos(unit);
  const to = [pending.targetLatlng.lat, pending.targetLatlng.lng];
  // Derive animation speed so the shell visually arrives exactly when applyArtilleryImpact fires

  const marker = L.marker(from, { icon: shellIcon(isMortar), zIndexOffset: 400, interactive: false }).addTo(map);
  flyingShells.push({ marker, lat: from[0], lng: from[1], dstLat: to[0], dstLng: to[1], speed, unit, pending });

function spawnBullets(a, b) {
  const posA = markerPos(a), posB = markerPos(b);
  for (let i = 0; i < 3; i++) {
    const [fromLat, fromLng] = i % 2 === 0 ? posA : posB;
    const [toLat, toLng]     = i % 2 === 0 ? posB : posA;
    const jitter = () => (Math.random() - 0.5) * 0.0003;
    const marker = L.marker([fromLat + jitter(), fromLng + jitter()], { icon: bulletIcon(), zIndexOffset: 350, interactive: false }).addTo(map);
    flyingBullets.push({ marker, lat: fromLat, lng: fromLng, dstLat: toLat + jitter(), dstLng: toLng + jitter(), born: Date.now() });
  }
}

function bearingDeg(from, to) {
  const dy = to[0] - from[0];
  const dx = (to[1] - from[1]) * Math.cos(from[0] * Math.PI / 180);
  return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
}
function fpvDroneIcon(bearing) {

    html: `<div style="width:0;height:0;

    iconSize: [10,11], iconAnchor: [5,7]
  });
}

function enterFPVStrike(pilot) {

// Step 3: target selected → drone flies in real time
function executeFPVStrike(pilot, target) {
  const fromPos = markerPos(pilot);
  const toPos   = markerPos(target);
  const distM = segMeters(fromPos, toPos);
  const _maxM = droneSignalRangeM(pilot);
  if (distM > _maxM) {
    showToast(`Outside radio horizon — target ${fmtDist(distM)}, max ${fmtDist(_maxM)}`, '#ef5350');
    return;
  }
  if (!hzCheckLoS(fromPos, toPos)) {
    showToast('Line of sight blocked by terrain — use Horizon calculator to verify', '#ef5350');
    return;
  }
  exitCombatMode();
  pilot._drones = Math.max(0, pilot._drones - 1);
  pilot._fpvCooldownUntil = Date.now() + 45000 / TIME_SCALE;
  const bearing = bearingDeg(fromPos, toPos);
  const etaSec = Math.round(distM / (55 * TIME_SCALE));
  const droneMarker = L.marker(pilot.getLatLng(), { icon: fpvDroneIcon(bearing), zIndexOffset: 300 })
    .addTo(map).bindTooltip(`ETA ${fmtETA(etaSec)}`, { permanent: true, className: 'fpv-eta-tip', direction: 'right', offset: [8,0] });
  flyingFPVs.push({ droneMarker, pilot, target, lat: fromPos[0], lng: fromPos[1], dstLat: toPos[0], dstLng: toPos[1] });
  unitLog(pilot, `FPV launched → ${ROLES[target._role]?.label ?? 'target'} · ETA ${fmtETA(etaSec)} · ${fmtDist(distM)}`);
  showToast(`FPV drone launched! ETA ${fmtETA(etaSec)}`, '#ffa726');
  // Push FPV event so teammates/opponents see the drone flying in real-time
  if (_fbDb) {
    _fbDb.ref('fpv_events').push({
      clientId: _fbClientId,
      fromLat: fromPos[0], fromLng: fromPos[1],
      toLat: toPos[0], toLng: toPos[1],
      launchedAt: Date.now()
    }).catch(function() {});
  }
}

// Step 4: drone arrives → apply casualties
function applyFPVImpact(pilot, target, intercepted) {
  if (intercepted) {
    unitLog(pilot, 'FPV shot down by enemy infantry');
    showToast('FPV drone shot down before impact!', '#ffa726');

  showExplosion(impactLatlng, 70);
  showCrater(impactLatlng, 'fpv');

    unitLog(pilot, 'FPV missed — drone exploded near target, no casualties');

  // FPV always does structural damage even if crew is protected
  if (target._fortLevel > 0) damageFortification(target, 0, 15, 'fpv');

  if (Math.random() < fpvCover) {

  const cas = 1 + Math.floor(Math.random() * 3);

  const pilotRef = pilot; const _tgt = target;
  confirmOrQueue(pilot._side, impactPos[0], impactPos[1],
    [{ marker: pilotRef, text: `BDA: −${total} on ${ROLES[_tgt._role]?.label ?? 'unit'}` }],

    () => { if (!allMarkers.includes(_tgt)) return;

      const destroyed = damageUnit(_tgt, total);
      unitLog(_tgt, `FPV assessed — −${total}${destroyed?' · DESTROYED':''}`); });
  unitLog(pilot, `FPV direct hit — BDA pending`);
  if (allMarkers.includes(pilot)) renderPanel();
}

function enterMavicScan(unit) {
  if (unit._mavicMission) return;
  if (unit._mavicCooldownUntil > Date.now()) { showToast('Mavic still on cooldown.', '#888'); return; }
  if (unit._mavicBattery < 5) { showToast('Mavic battery too low.', '#888'); return; }

  setStatus('Mavic: click map to set scan area — Esc to cancel');

function mavicFlightBattCost(distM) {
  // % battery consumed flying distM metres
  return distM * MAVIC_BATT_PER_METER;
}

function launchMavicScan(unit, latlng) {
  exitCombatMode();
  const from = markerPos(unit);
  const to = [latlng.lat, latlng.lng];
  const distM = segMeters(from, to);
  const returnDistM = distM; // same distance back
  const outboundBatt = mavicFlightBattCost(distM);
  const returnBatt   = mavicFlightBattCost(returnDistM);
  const hoverBudget  = Math.max(0, unit._mavicBattery - outboundBatt - returnBatt - MAVIC_BATT_SAFETY);
  const hoverSec     = hoverBudget / MAVIC_HOVER_BATT_PER_SEC; // real seconds
  const flightSec    = distM / MAVIC_SPD;

  if (unit._mavicBattery < outboundBatt + returnBatt + MAVIC_BATT_SAFETY) {
    showToast('Not enough battery for a safe round trip!', '#ef5350');
    return;
  }

  const droneMarker = L.marker(unit.getLatLng(), { icon: mavicDroneIcon(), zIndexOffset: 300 })
    .addTo(map)
    .bindTooltip('ETA ' + fmtETA(Math.round(flightSec)), { permanent: true, className: 'fpv-eta-tip', direction: 'right', offset: [8,0] });

  unit._mavicMission = {
    droneMarker, scanCenter: to,
    lat: from[0], lng: from[1],
    homeLat: from[0], homeLng: from[1],
    dstLat: to[0], dstLng: to[1],
    phase: 'outbound', scanCircle: null,
    scanEndsAt: 0,
    outboundBatt, returnBatt, hoverSec
  };
  // Deduct outbound battery immediately
  unit._mavicBattery = Math.max(0, unit._mavicBattery - outboundBatt);
  unitLog(unit, `Mavic launched · ${fmtDist(distM)} · ETA ${fmtETA(Math.round(flightSec))} · hover budget ${hoverSec.toFixed(1)}s`);
  showToast(`Mavic launched — ETA ${fmtETA(Math.round(flightSec))} · ${hoverSec.toFixed(1)}s hover`, '#26c6da');
  if (activePanel === unit) renderPanel();
}

// ── Mavic scan ────────────────────────────────────────────────
function doReconScan(unit) {
  // If the unit has a saved patrol route, repeat the full patrol
  if (unit._patrolRoute?.length >= 2) {
    // Update the home waypoint to the unit's current position
    const route = [[...markerPos(unit)], ...unit._patrolRoute.slice(1)];
    launchMavicPatrol(unit, route);
    return;
  }
  // Single-point scan: fly back to the last scanned area
  const tgt = unit._lastScanTarget;
  const from = markerPos(unit);
  const latlng = tgt ? L.latLng(tgt.lat, tgt.lng) : L.latLng(from[0], from[1]);
  launchMavicScan(unit, latlng);
}

function moveSoldierSubset(m) {
  if (!m._soldiers) return;
  const selected = aliveSoldiers(m).filter(s => m._selectedSoldierIds.has(s.id));
  if (!selected.length) { showToast('Select soldiers first (click rows).', '#888'); return; }
  // Mark them as leaving the parent
  selected.forEach(s => { s.alive = false; });
  m._count = aliveSoldiers(m).length;
  m._ammo = aliveSoldiers(m).reduce((s, sol) => s + sol.ammo, 0);
  if (m._count === 0) { removeUnit(m); }
  else { m.setIcon(soldierIcon(m._side, m._count, m._role)); }

  const pos = markerPos(m);
  const newM = createMarker(pos, m._side, selected.length, 'infantry');
  newM._soldiers = selected.map((s, i) => ({ ...s, id: i, alive: true }));
  newM._ammo = selected.reduce((s, sol) => s + sol.ammo, 0);
  newM._maxAmmo = newM._ammo;
  newM._count = selected.length;
  newM.setIcon(soldierIcon(newM._side, newM._count, newM._role));
  if (m._count > 0) activePanel = m;
  selectForRoute(newM);
}
