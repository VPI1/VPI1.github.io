const MERGE_DIST_M = 50; // meters — units must be within this distance to merge

function checkMergeProposal(m) {
  if (m._side !== userSide) return;
  const pos = markerPos(m);
  const nearby = allMarkers.find(other =>
    other !== m &&
    other._side === m._side &&
    other._role === m._role &&
    !movingMarkers.has(other) &&
    segMeters(pos, markerPos(other)) <= MERGE_DIST_M
  );
  if (!nearby) return;
  const totalCount = m._count + nearby._count;
  // Show a non-blocking confirmation banner on the map
  const existing = document.getElementById('merge-banner');
  if (existing) existing.remove();
  const banner = document.createElement('div');
  banner.id = 'merge-banner';
  banner.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid #ffa726;border-radius:6px;padding:10px 16px;font-family:monospace;font-size:12px;color:#ffa726;z-index:9999;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px #000c';
  banner.innerHTML = `Merge these two ${nearby._role} units into one (${totalCount} soldiers)?
    <button id="merge-yes" style="background:#ffa726;color:#000;border:none;padding:3px 10px;border-radius:3px;cursor:pointer;font-weight:bold">Merge</button>
    <button id="merge-no" style="background:#444;color:#fff;border:none;padding:3px 10px;border-radius:3px;cursor:pointer">Cancel</button>`;
  document.body.appendChild(banner);
  banner.querySelector('#merge-yes').onclick = () => { mergeUnits(m, nearby); banner.remove(); };
  banner.querySelector('#merge-no').onclick  = () => banner.remove();
  // Auto-dismiss after 8s
  setTimeout(() => { if (document.getElementById('merge-banner') === banner) banner.remove(); }, 8000);
}

function mergeUnits(a, b) {
  const newCount = a._count + b._count;
  const keepPos  = markerPos(a);
  // Remove both, create merged unit
  clearRoute(a); clearRoute(b);
  if (activePanel === a || activePanel === b) closePanel();
  map.removeLayer(a); allMarkers.splice(allMarkers.indexOf(a), 1);
  map.removeLayer(b); allMarkers.splice(allMarkers.indexOf(b), 1);
  fbRemoveUnit(a); fbRemoveUnit(b);
  const merged = createMarker(keepPos, a._side, newCount, a._role);
  // Combine ammo
  merged._ammo    = (a._ammo ?? 0) + (b._ammo ?? 0);
  merged._maxAmmo = (a._maxAmmo ?? 0) + (b._maxAmmo ?? 0);
  if (a._soldiers && b._soldiers) merged._soldiers = [...a._soldiers, ...b._soldiers];
  selectForRoute(merged);
  fbSyncUnit(merged);
  saveState();
  showToast(`Merged into ${newCount} ${a._role}`, '#66bb6a');
}

function resetMap() {
  if (!confirm('Reset map? All units, routes and drawings will be cleared.')) return;
  // Clear Firebase for own side
  if (_fbDb) _fbDb.ref(`units_${userSide}`).remove();
  // Clear service worker state
  if (navigator.serviceWorker?.controller) navigator.serviceWorker.controller.postMessage({ type: 'SAVE_STATE', state: { units: [], depPoints: [], savedAt: 0, _pendingEvents: [] } });
  // Clear localStorage
  localStorage.removeItem(SAVE_KEY);
  localStorage.removeItem('annotations_blue');
  localStorage.removeItem('annotations_red');
  location.reload();
}

function saveState() {
  if (!allMarkers.length) return;
  const units = [];
  for (const m of allMarkers) {
    const ll = m.getLatLng();
    const u = {
      uid: m._uid,
      lat: ll.lat, lng: ll.lng,
      side: m._side, count: m._count, role: m._role,
      ammo: m._ammo, maxAmmo: m._maxAmmo, drones: m._drones,
      fpvCooldownUntil: m._fpvCooldownUntil || 0,
      fpvReadyAt: m._fpvReadyAt || 0,
      mavicBattery: Math.round(m._mavicBattery ?? 100),
      mavicCooldownUntil: m._mavicCooldownUntil || 0,
      artPending: m._artPending ? {
        lat: m._artPending.targetLatlng.lat, lng: m._artPending.targetLatlng.lng,
        fireAt: m._artPending.fireAt, blastR: m._artPending.blastR, dispMax: m._artPending.dispMax,
      } : null,
      soldiers: m._soldiers ? m._soldiers.map(s => ({ ...s })) : null,
      lastKnownPos: m._lastKnownPos ?? null,
      missionRepeat: m._missionRepeat,
      continuousRecon: m._continuousRecon,
      taskQueue: m._taskQueue?.map(t => ({ latlng: { lat: t.latlng.lat ?? t.latlng[0], lng: t.latlng.lng ?? t.latlng[1] } })) ?? [],
      conds: m._conds ? { ...m._conds } : {},
      patrolRoute: m._patrolRoute ?? null,
      fortLevel: m._fortLevel ?? 0,
      fortDamage: m._fortDamage ?? 0,
      supplyType: m._supply?.type ?? null,
      supplyArrivesAt: m._supply?.arrivesAt ?? null,
      supplyFrom: m._supply ? [m._supply.fromLat, m._supply.fromLng] : null,
      supplyTo:   m._supply ? [m._supply.toLat,   m._supply.toLng  ] : null,
      autoBatterySwap: m._autoBatterySwap ?? false,
      lastScanTarget: m._lastScanTarget ?? null,
      nextReconAt: m._nextReconAt || 0,
      mavicMission: m._mavicMission ? (() => {
        const mis = m._mavicMission;
        return {
          type: mis.type, phase: mis.phase,
          lat: mis.lat, lng: mis.lng,
          dstLat: mis.dstLat, dstLng: mis.dstLng,
          homeLat: mis.homeLat, homeLng: mis.homeLng,
          scanEndsAt: mis.scanEndsAt ?? 0,
          waypoints: mis.waypoints ?? null,
          currentWP: mis.currentWP ?? 1,
          hoverPerWP: mis.hoverPerWP ?? 0,
          hoverSec: mis.hoverSec ?? 0,
          outboundBatt: mis.outboundBatt ?? 0,
          returnBatt: mis.returnBatt ?? 0,
        };
      })() : null,
    };
    if (movingMarkers.has(m)) {
      const st = movingMarkers.get(m);
      u.remainingRoute = [[ll.lat, ll.lng], ...st.route.slice(st.seg + 1)];
    }
    units.push(u);
  }
  const savedAt = Date.now();
  const depPoints = deploymentPoints.map(dp => {
    const ll = dp.marker.getLatLng();
    return { lat: ll.lat, lng: ll.lng, side: dp.side, role: dp.role ?? 'infantry', moveRoute: dp.moveRoute ?? null, nextReinfAt: dp._nextReinfAt ?? 0 };
  });
  const payload = { units, depPoints, savedAt };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(payload)); } catch(e) {}
  swSend({ type: 'SAVE_STATE', state: payload });
  // Debounced push to GitHub (one push per 10s max so we don't hammer the API)
  clearTimeout(saveState._ghTimer);
  saveState._ghTimer = setTimeout(() => saveToGitHub(payload), 10000);
}

function loadSavedState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const { units, depPoints, savedAt } = JSON.parse(raw);
    if (!units || !units.length) return false;
    for (let _i = 0; _i < units.length; _i++) { const u = units[_i];
      if (!u.count || u.count <= 0) continue; // skip dead/corrupted units
      const m = createMarker([u.lat, u.lng], u.side, u.count, u.role);
      // Deterministic fallback: both tabs load same localStorage in same order → same UID
      m._uid = u.uid || (u.side + '_' + u.role + '_' + _i);
      m._ammo = u.ammo ?? 0;
      m._maxAmmo = u.maxAmmo ?? 0;
      m._drones = u.drones ?? 0;
      m._missionRepeat = u.missionRepeat ?? 1;
      m._continuousRecon = u.continuousRecon ?? false;
      m._taskQueue = (u.taskQueue ?? []).map(t => ({ latlng: L.latLng(t.latlng.lat, t.latlng.lng) }));
      // Absolute timestamps — assign directly; expired ones handled by next tick
      if (u.fpvCooldownUntil > 0) m._fpvCooldownUntil = u.fpvCooldownUntil;
      else if (u.fpvCooldownMs > 0) m._fpvCooldownUntil = (savedAt || Date.now()) + u.fpvCooldownMs;
      if (u.fpvReadyAt > 0) m._fpvReadyAt = u.fpvReadyAt;
      else if (u.fpvReadyMs > 0) m._fpvReadyAt = (savedAt || Date.now()) + u.fpvReadyMs;
      if (u.mavicBattery != null) m._mavicBattery = u.mavicBattery;
      if (u.mavicCooldownUntil > 0) m._mavicCooldownUntil = u.mavicCooldownUntil;
      else if (u.mavicCooldownMs > 0) m._mavicCooldownUntil = (savedAt || Date.now()) + u.mavicCooldownMs;
      if (u.artPending) {
        const ap = u.artPending;
        const now = Date.now();
        if (ap.fireAt > now) {
          setTimeout(() => {
            const latlng = L.latLng(ap.lat, ap.lng);
            const prepEndsAt = Math.max(now, ap.fireAt - 8000);
            const aimCircle = L.circle(latlng, { radius: ap.blastR, color:'#ef5350', weight:1.5, fillOpacity:0.07, dashArray:'6 5' }).addTo(map);
            m._artPending = { targetLatlng: latlng, aimCircle, prepEndsAt, fireAt: ap.fireAt, blastR: ap.blastR, dispMax: ap.dispMax ?? 20, flightMs: ap.fireAt - prepEndsAt };
          }, 200);
        } else {
          // Already fired while offline
          setTimeout(() => applyArtilleryImpact(m, L.latLng(ap.lat, ap.lng), ap.blastR, ap.dispMax ?? 20), 300);
        }
      }
      if (u.soldiers) {
        m._soldiers = u.soldiers.map((s, i) => ({ ...s, id: i }));
        m._count = m._soldiers.filter(s => s.alive).length;
        m._ammo  = m._soldiers.filter(s => s.alive).reduce((a, s) => a + s.ammo, 0);
        m.setIcon(soldierIcon(m._side, m._count, m._role));
      }
      if (u.lastKnownPos) {
        m._lastKnownPos = u.lastKnownPos;
        if (m._side !== userSide) showGhost(m);
      }
      if (u.fortLevel) { m._fortLevel = u.fortLevel; m._fortDamage = u.fortDamage ?? 0; updateFortBadge(m); }
      if (u.supplyType && (u.supplyArrivesAt || u.supplyArrivesMs)) {
        const arrivesAt = u.supplyArrivesAt ?? ((savedAt || Date.now()) + (u.supplyArrivesMs ?? 0));
        const convoyIcon = L.divIcon({
          className: '',
          html: `<div style="font-size:16px;filter:drop-shadow(0 1px 3px #000);opacity:0.85">${m._side==='blue'?'🚛':'🚚'}</div>`,
          iconSize: [20,20], iconAnchor: [10,10],
        });
        const fromPos = u.supplyFrom ?? supplyDepotPos(m._side);
        const toPos   = u.supplyTo   ?? markerPos(m);
        const convoyMarker = L.marker(fromPos, { icon: convoyIcon, interactive: false, zIndexOffset: 300 }).addTo(map);
        m._supply = { type: u.supplyType, arrivesAt, convoyMarker, fromLat: fromPos[0], fromLng: fromPos[1], toLat: toPos[0], toLng: toPos[1] };
      }
      if (u.conds) {
        m._conds = { ...u.conds };
        // Restore fallback point marker on map
        if (m._conds.fallbackPos && m._side === userSide) {
          m._fallbackMarker = L.marker(m._conds.fallbackPos, {
            icon: L.divIcon({ className:'', html:`<div style="width:10px;height:10px;background:#ef5350;border:2px solid #fff;border-radius:50%;opacity:0.85"></div>`, iconSize:[10,10], iconAnchor:[5,5] }),
            interactive: false, zIndexOffset: -200
          }).addTo(map).bindTooltip('Fallback point', { direction:'top', className:'fpv-eta-tip' });
        }
      }
      if (u.autoBatterySwap) m._autoBatterySwap = true;
      if (u.lastScanTarget) m._lastScanTarget = u.lastScanTarget;
      if (u.nextReconAt > 0) m._nextReconAt = u.nextReconAt;
      else if (u.nextReconMs > 0) m._nextReconAt = (savedAt || Date.now()) + u.nextReconMs;
      if (u.mavicMission) {
        const mis = u.mavicMission;
        const droneMarker = L.marker([mis.lat, mis.lng], { icon: mavicDroneIcon(), zIndexOffset: 300 }).addTo(map);
        const etaLabel = mis.phase === 'scanning' ? 'Scanning' : 'In flight';
        droneMarker.bindTooltip(etaLabel, { permanent: true, className: 'fpv-eta-tip', direction: 'right', offset: [8, 0] });
        let routeLine = null;
        if (mis.type === 'patrol' && mis.waypoints) {
          routeLine = L.polyline(mis.waypoints, { color: '#26c6da', weight: 1.5, dashArray: '6 5', opacity: 0.45 }).addTo(map);
        }
        m._mavicMission = {
          type: mis.type, phase: mis.phase,
          lat: mis.lat, lng: mis.lng,
          dstLat: mis.dstLat, dstLng: mis.dstLng,
          homeLat: mis.homeLat, homeLng: mis.homeLng,
          scanEndsAt: mis.scanEndsAt > 0 ? mis.scanEndsAt : ((savedAt || Date.now()) + (mis.scanEndsAtMs ?? 0)),
          waypoints: mis.waypoints ?? null,
          currentWP: mis.currentWP ?? 1,
          hoverPerWP: mis.hoverPerWP ?? 0,
          hoverSec: mis.hoverSec ?? 0,
          outboundBatt: mis.outboundBatt ?? 0,
          returnBatt: mis.returnBatt ?? 0,
          droneMarker, routeLine, scanCircle: null,
        };
      }
      if (u.patrolRoute) m._patrolRoute = u.patrolRoute;
      if (u.remainingRoute && u.remainingRoute.length >= 2) {
        pendingSplitCount = u.count;
        assignRoute(m, u.remainingRoute);
        pendingSplitCount = null;
      }
    }
    // Restore deployment points
    if (depPoints?.length) {
      for (const dp of depPoints) {
        const created = createDeploymentPoint({ lat: dp.lat, lng: dp.lng }, dp.side, dp.role ?? 'infantry');
        if (dp.moveRoute?.length) {
          created.moveRoute = dp.moveRoute;
          redrawDepRoute(created);
        }
        if (dp.nextReinfAt > 0) created._nextReinfAt = dp.nextReinfAt;
      }
    }
    // Fast-forward time that passed while the page was closed
    if (savedAt) {
      const deltaMs = Date.now() - savedAt;
      if (deltaMs > 1500) fastForward(deltaMs);
    }
    return true;
  } catch(e) { return false; }
}

// Advance game state by deltaMs of real elapsed time (page was closed)
function fastForward(deltaMs) {
  const deltaSec = deltaMs / 1000;

  // 1 ─ Advance moving units along their routes
  for (const [marker, state] of movingMarkers) {
    const { route } = state;
    let budget = WALK_MS * deltaSec;
    while (budget > 0 && state.seg < route.length - 1) {
      const d = segMeters(route[state.seg], route[state.seg + 1]);
      const left = d * (1 - state.t);
      if (budget >= left) { budget -= left; state.seg++; state.t = 0; }
      else { state.t += budget / d; budget = 0; }
    }
    if (state.seg >= route.length - 1) {
      marker.setLatLng(route[route.length - 1]);
      unitLog(marker, `Arrived at destination (while offline)`);
      clearRoute(marker);
    } else {
      const a = route[state.seg], b = route[state.seg + 1];
      marker.setLatLng([a[0] + (b[0] - a[0]) * state.t, a[1] + (b[1] - a[1]) * state.t]);
      rebuildLine(state);
    }
  }

  // 2 ─ Fully simulate mavic missions through all phase transitions
  for (const m of allMarkers) {
    if (!m._mavicMission) continue;
    fastForwardMavic(m, deltaMs);
    // After simulation, if a continuous recon cycle is due, let the 1s tick pick it up
    // by setting _nextReconAt to now so it fires immediately
    if (m._continuousRecon && m._nextReconAt && m._nextReconAt <= Date.now()) {
      m._nextReconAt = 0; // fire immediately on next tick
    }
  }

  // 3 ─ Supply convoys / artillery / fortification: all use absolute timestamps,
  //     so the next 1s tick handles them naturally if their time has passed.
  const elapsed = deltaSec >= 3600 ? `${Math.floor(deltaSec/3600)}h ${Math.round((deltaSec%3600)/60)}m`
                : deltaSec >= 60   ? `${Math.round(deltaSec/60)}m ${Math.round(deltaSec%60)}s`
                : `${Math.round(deltaSec)}s`;
  showToast(`Game resumed (${elapsed} offline)`, '#42a5f5');
}

// Simulate a mavic mission through all its phases for the given elapsed real-time (ms)
function fastForwardMavic(m, deltaMs) {
  const now = Date.now();
  let budget = deltaMs; // real ms remaining to consume
  let cycles = 0;

  while (budget > 0 && cycles < 50) { // cap at 50 transitions to avoid infinite loops
    cycles++;
    const mis = m._mavicMission;
    if (!mis) break;

    if (mis.phase === 'outbound' || mis.phase === 'returning') {
      const dist = segMeters([mis.lat, mis.lng], [mis.dstLat, mis.dstLng]);
      const msNeeded = dist > 0 ? (dist / MAVIC_SPD) * 1000 : 0;

      if (budget >= msNeeded) {
        budget -= msNeeded;
        mis.lat = mis.dstLat; mis.lng = mis.dstLng;

        if (mis.phase === 'outbound') {
          m._lastScanTarget = { lat: mis.dstLat, lng: mis.dstLng };
          const hoverSec = (mis.hoverSec ?? 5) / TIME_SCALE;
          mis.scanEndsAt = now + (budget > 0 ? 0 : hoverSec * 1000); // already in past if budget left
          if (budget >= hoverSec * 1000) {
            budget -= hoverSec * 1000;
            mis.phase = 'scanned'; // trigger return logic below
          } else {
            mis.phase = 'scanning';
            mis.scanEndsAt = now + (hoverSec * 1000 - budget);
            budget = 0;
          }
        } else {
          // Returned home — mission complete
          const batt = mis.returnBatt ?? 5;
          m._mavicBattery = Math.max(0, (m._mavicBattery ?? 100) - batt);
          if (m._autoBatterySwap) m._mavicBattery = 100;
          unitLog(m, `Recon mission completed (while offline)`);
          const swapMs = (m._autoBatterySwap ? 5000 : 60000) / TIME_SCALE;
          m._mavicCooldownUntil = now;
          if (m._continuousRecon) m._nextReconAt = now;

          // Remove mission layers
          try { map.removeLayer(mis.droneMarker); } catch(e) {}
          try { if (mis.routeLine) map.removeLayer(mis.routeLine); } catch(e) {}
          m._mavicMission = null;

          // If continuous recon and battery ok, launch the next mission
          if (m._continuousRecon && m._mavicBattery >= 10 && budget > swapMs) {
            budget -= swapMs;
            doReconScan(m);
            // doReconScan creates a new _mavicMission; loop continues
          } else {
            break;
          }
        }
      } else {
        // Partially travelled
        const r = budget / msNeeded;
        mis.lat += (mis.dstLat - mis.lat) * r;
        mis.lng += (mis.dstLng - mis.lng) * r;
        budget = 0;
      }
    } else if (mis.phase === 'scanning' || mis.phase === 'scanned') {
      if (mis.phase === 'scanned' || now >= mis.scanEndsAt) {
        // Scan done — transition: patrol moves to next WP, simple scan returns home
        if (mis.type === 'patrol' && mis.waypoints?.length) {
          const nextWP = (mis.currentWP ?? 1) + 1;
          if (nextWP < mis.waypoints.length) {
            mis.currentWP = nextWP;
            mis.dstLat = mis.waypoints[nextWP][0];
            mis.dstLng = mis.waypoints[nextWP][1];
            mis.hoverSec = mis.hoverPerWP ?? mis.hoverSec;
            mis.phase = 'outbound';
          } else {
            mis.dstLat = mis.homeLat; mis.dstLng = mis.homeLng;
            mis.phase = 'returning';
          }
        } else {
          mis.dstLat = mis.homeLat; mis.dstLng = mis.homeLng;
          mis.phase = 'returning';
        }
        if (mis.scanCircle) { try { map.removeLayer(mis.scanCircle); } catch(e) {} mis.scanCircle = null; }
      } else {
        // Still scanning
        budget = 0;
      }
    } else {
      break; // unknown phase
    }
  }

  // Update visual position
  if (m._mavicMission) {
    m._mavicMission.droneMarker.setLatLng([m._mavicMission.lat, m._mavicMission.lng]);
    const phase = m._mavicMission.phase;
    const label = phase === 'scanning' ? 'Scanning' : 'In flight';
    try { m._mavicMission.droneMarker.setTooltipContent(label); } catch(e) {}
  }
}

// ── Service Worker integration ────────────────────────────────────────────
let _swReg = null;
function swSend(msg) {
  if (_swReg?.active) _swReg.active.postMessage(msg);
}

async function initSW() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    _swReg = await navigator.serviceWorker.register('sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    _swReg = await navigator.serviceWorker.getRegistration('sw.js');
    return _swReg;
  } catch(e) { console.warn('SW registration failed:', e); return null; }
}

// Ask the SW for events it accumulated while the tab was closed, then apply them.
function applySWHandoff(events) {
  if (!events?.length) return;
  let artCount = 0, supplyCount = 0, movedCount = 0;
  for (const ev of events) {
    const m = allMarkers[ev.idx];
    if (!m) continue;
    if (ev.type === 'artillery_impact') {
      applyArtilleryImpact(m, L.latLng(ev.lat, ev.lng), ev.blastR, ev.dispMax ?? 20);
      artCount++;
    } else if (ev.type === 'supply_arrived') {
      if (m._supply) applySupply(m);
      supplyCount++;
    } else if (ev.type === 'unit_arrived') {
      m.setLatLng([ev.lat, ev.lng]);
      clearRoute(m);
      unitLog(m, 'Arrived at destination (while offline)');
      movedCount++;
    } else if (ev.type === 'mavic_returned') {
      if (m._mavicMission) {
        try { map.removeLayer(m._mavicMission.droneMarker); } catch(e) {}
        try { if (m._mavicMission.routeLine) map.removeLayer(m._mavicMission.routeLine); } catch(e) {}
        m._mavicMission = null;
      }
    }
  }
  const parts = [];
  if (artCount)   parts.push(`${artCount} artillery strike${artCount>1?'s':''}`);
  if (supplyCount)parts.push(`${supplyCount} supply deliver${supplyCount>1?'ies':'y'}`);
  if (movedCount) parts.push(`${movedCount} unit${movedCount>1?'s':''} arrived`);
  if (parts.length) showToast(`While offline: ${parts.join(', ')}`, '#42a5f5', 6000);
}

async function main() {
  try {
    // Register SW first — it may have fresher state from running while page was closed
    document.getElementById('loading-text').textContent = 'Restoring saved positions…';
    await initSW();

    // Ask SW for accumulated events before loading state
    let swHandoffEvents = null;
    if (navigator.serviceWorker?.controller) {
      swHandoffEvents = await new Promise(resolve => {
        const ch = new MessageChannel();
        ch.port1.onmessage = e => resolve(e.data?.events ?? null);
        navigator.serviceWorker.controller.postMessage({ type: 'PAGE_OPEN' }, [ch.port2]);
        setTimeout(() => resolve(null), 1500); // fallback if SW doesn't respond
      });
    }

    // Try GitHub state (may be newer — GH Actions ticks while nobody is online)
    const ghState = await loadFromGitHub();
    const lsRaw   = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; } })();
    let bestState = null;
    if (ghState?.units?.length && lsRaw?.units?.length) {
      bestState = (ghState.savedAt ?? 0) >= (lsRaw.savedAt ?? 0) ? ghState : lsRaw;
    } else {
      bestState = ghState?.units?.length ? ghState : lsRaw;
    }
    if (bestState?.savedAt) {
      // Write winner back to localStorage so loadSavedState picks it up
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(bestState)); } catch {}
    }

    if (loadSavedState()) {
      // Apply pending events queued by GH Actions ticks while nobody was online
      const pending = bestState?._pendingEvents;
      if (pending?.length) {
        applySWHandoff(pending);
        // Clear events from state so they aren't replayed on next load
        const cleaned = { ...bestState, _pendingEvents: [] };
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(cleaned)); } catch {}
        saveToGitHub(cleaned);
      }
      if (swHandoffEvents?.length) applySWHandoff(swHandoffEvents);
      document.getElementById('loading').style.display = 'none';
      loadAnnotations();
      fetchWeather();
      swSend({ type: 'PAGE_OPEN' });
      initFirebase(); // auto-connect if previously configured
      return;
    }

    document.getElementById('loading-text').textContent = 'Fetching map data…';
    const data  = await fetchAreas();
    document.getElementById('loading-text').textContent = 'Processing polygons…';
    urbanAnchors = extractUrbanAnchors(data);
    const extracted = extractPolygons(data);
    terrainPolys = extracted.polys;
    spawnPolys   = terrainPolys; // module-level alias used by spawn helpers
    waterPolys   = extracted.wPolys;
    riverLines   = extracted.rLines;

    if (!spawnPolys.length) {
      showError('No spawn areas found in this area.');
      return;
    }

    const MIN_DIST_SQ = 0.002 ** 2;
    const occupied = [];

    function pickSpotForRole(northSide, role) {
      const r = ROLES[role];
      const minDeg = kmToDeg(r.minKm);
      const maxDeg = kmToDeg(r.maxKm);
      for (let t = 0; t < 120; t++) {
        const pt = randomInAny(spawnPolys);
        if (!pt) continue;
        if (isNorthOfLine(pt) !== northSide) continue;
        const d = distToLine(pt);
        if (d < minDeg || d > maxDeg) continue;
        if (occupied.some(o => dist2(pt, o) < MIN_DIST_SQ)) continue;
        return pt;
      }
      // fallback: keep side, relax distance band
      for (let t = 0; t < 40; t++) {
        const pt = randomInAny(spawnPolys);
        if (pt && isNorthOfLine(pt) === northSide &&
            !occupied.some(o => dist2(pt, o) < MIN_DIST_SQ)) return pt;
      }
      return null;
    }

    function pickWeightedRole(pool) {
      const total = pool.reduce((s, e) => s + e.w, 0);
      let r = Math.random() * total;
      for (const e of pool) { r -= e.w; if (r <= 0) return e.role; }
      return pool[pool.length - 1].role;
    }

    function groupSize(role) {
      if (['fpv','mavic'].includes(role)) return 3 + Math.floor(Math.random() * 2); // 3-4
      if (role === 'artillery') return 3 + Math.floor(Math.random() * 3);           // 3-5
      if (role === 'mortar')    return 2 + Math.floor(Math.random() * 2);           // 2-3
      return 2 + Math.floor(Math.random() * 4); // 2-5
    }

    // per-role minimum separation (degrees) to avoid clustering
    const ROLE_SEP = { infantry: 0.006, mortar: 0.008, mavic: 0.014, fpv: 0.014, artillery: 0.018 };
    const roleOccupied = {}; // "role+side" → [pts]

    function markOccupied(pt, role, northSide) {
      occupied.push(pt);
      const key = role + (northSide ? 'N' : 'S');
      (roleOccupied[key] = roleOccupied[key] || []).push(pt);
    }

    // pick a spot within a custom km band (used for close-rear extras)
    function pickBand(northSide, minKm, maxKm, tries = 80) {
      const minD = kmToDeg(minKm), maxD = kmToDeg(maxKm);
      const sep = ROLE_SEP.infantry ** 2;
      const key = 'infantryN';
      const roleOcc = roleOccupied['infantry' + (northSide ? 'N' : 'S')] || [];
      for (let t = 0; t < tries; t++) {
        const pt = randomInAny(spawnPolys);
        if (!pt) continue;
        if (isNorthOfLine(pt) !== northSide) continue;
        const d = distToLine(pt);
        if (d < minD || d > maxD) continue;
        if (occupied.some(o => dist2(pt, o) < MIN_DIST_SQ)) continue;
        if (roleOcc.some(o => dist2(pt, o) < sep)) continue;
        return pt;
      }
      return null;
    }

    const BLUE_POOL = [
      { role: 'infantry',  w: 8  },
      { role: 'mortar',    w: 3  },
      { role: 'mavic',     w: 9  }, { role: 'fpv',      w: 7 },
      { role: 'artillery', w: 2  },
    ];
    const RED_POOL = [
      { role: 'infantry',  w: 8  },
      { role: 'mortar',    w: 4  },
      { role: 'mavic',     w: 10 }, { role: 'fpv',      w: 8 },
      { role: 'artillery', w: 3  },
    ];

    // override pickSpotForRole to also enforce per-role separation
    const _origPickSpot = pickSpotForRole;
    function pickSpotSep(northSide, role) {
      const r = ROLES[role];
      const minDeg = kmToDeg(r.minKm), maxDeg = kmToDeg(r.maxKm);
      const sepSq = (ROLE_SEP[role] ?? 0.003) ** 2;
      const key = role + (northSide ? 'N' : 'S');
      const roleOcc = roleOccupied[key] || [];
      for (let t = 0; t < 150; t++) {
        const pt = randomInAny(spawnPolys);
        if (!pt) continue;
        if (isNorthOfLine(pt) !== northSide) continue;
        const d = distToLine(pt);
        if (d < minDeg || d > maxDeg) continue;
        if (occupied.some(o => dist2(pt, o) < MIN_DIST_SQ)) continue;
        if (roleOcc.some(o => dist2(pt, o) < sepSq)) continue;
        return pt;
      }
      // fallback: relax role separation
      return pickSpotForRole(northSide, role);
    }

    const numBlue = 16 + Math.floor(Math.random() * 4); // 16-19
    for (let i = 0; i < numBlue; i++) {
      const role = pickWeightedRole(BLUE_POOL);
      const pt = pickSpotSep(true, role);
      if (!pt) continue;
      markOccupied(pt, role, true);
      createMarker(pt, 'blue', groupSize(role), role);
    }

    const numRed = 22 + Math.floor(Math.random() * 6); // 22-27
    for (let i = 0; i < numRed; i++) {
      const role = pickWeightedRole(RED_POOL);
      const pt = pickSpotSep(false, role);
      if (!pt) continue;
      markOccupied(pt, role, false);
      createMarker(pt, 'red', groupSize(role), role);
    }

    // Extra infantry in the close rear (1-2.5km behind the line) for both sides
    for (let i = 0; i < 5; i++) {
      const bPt = pickBand(true,  1.0, 2.5);
      if (bPt) { markOccupied(bPt, 'infantry', true);  createMarker(bPt, 'blue', groupSize('infantry'), 'infantry'); }
      const rPt = pickBand(false, 1.0, 2.5);
      if (rPt) { markOccupied(rPt, 'infantry', false); createMarker(rPt, 'red',  groupSize('infantry'), 'infantry'); }
    }

    // Enforce 1 FPV per 3 infantry per side
    for (const northSide of [true, false]) {
      const side = northSide ? 'blue' : 'red';
      const infCount = allMarkers.filter(m => m._side === side && m._role === 'infantry').length;
      const fpvCount = allMarkers.filter(m => m._side === side && m._role === 'fpv').length;
      const needed   = Math.floor(infCount / 3) - fpvCount;
      for (let i = 0; i < needed; i++) {
        const pt = pickSpotSep(northSide, 'fpv');
        if (!pt) continue;
        markOccupied(pt, 'fpv', northSide);
        createMarker(pt, side, groupSize('fpv'), 'fpv');
      }
    }

    document.getElementById('loading').style.display = 'none';
    loadAnnotations();
    fetchWeather();
    initFirebase();

  } catch (err) {
    showError(`Failed to load data: ${err.message}`);
    console.error(err);
  }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('error');
  el.style.display = 'flex';
  el.textContent = msg;
}

</script>
